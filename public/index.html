@iranintltv","link":"https://t.me/IranintlTV/359873","article_rel_path":"articles/2026-09-29/f54b0fada4b413b0.md","media_files":["media/2026-09-29/d7572f35d18cb9bb.jpg"],"published_at":"2026-09-29T18:17:23+00:00","published_epoch":1790705843,"rtl":true},{"hash":"c601936d9523a58a","source_id":"rss_euronews","source_name":"Euronews Persian","source_name_fa":"یورونیوز فارسی","source_type":"rss","author_handle":"","title":"تلاش سازمان ملل متحد برای مهار جنگ یمن؛ گفتگو با حوثی‌ها در مسقط","summary":"فرستاده سازمان ملل متحد در امور یمن روز سه‌شنبه گفت در پایان هفته گذشته با مذاکره‌کنندگان حوثی دیدار کرده تا از تشدید بیشتر درگیری‌ها در این کشور جلوگیری کند.","full_body":"همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp فرستاده سازمان ملل متحد در امور یمن روز سه‌شنبه گفت در پایان هفته گذشته با مذاکره‌کنندگان حوثی دیدار کرده تا از تشدید بیشتر درگیری‌ها در این کشور جلوگیری کند. این تلاش‌ها در حالی صورت می‌گیرد که نبردهای شدیدی در ساحل غربی یمن میان حوثی‌ها و نیروهای دولتی مورد حمایت عربستان جریان دارد؛ نیروهایی که خود دچار چنددستگی هستند.\n\nدور تازه خشونت‌ها، که صدها کشته و ده‌ها هزار آواره بر جای گذاشته، تازه‌ترین تحول در جنگ یمن است؛ جنگی که در سال ۲۰۱۴ با تصرف صنعا، پایتخت، به دست حوثی‌ها آغاز شد و دولت این کشور را ناچار کرد به عربستان برود و در تبعید مستقر شود. عربستان یک سال بعد، در راس ائتلافی چندملیتی، به یمن حمله کرد\n\nهانس گروندبرگ در مصاحبه با آسوشیتدپرس گفت هدف دیدارش در مسقط با محمد عبدالسلام، مذاکره‌کننده ارشد حوثی‌ها، بررسی این موضوع بوده که «آیا راهی برای جلوگیری از تشدید بیشتر درگیری‌های کنونی وجود دارد یا نه».\n\nاو همچنین در ریاض، پایتخت عربستان، با دولت به‌رسمیت‌شناخته‌شده بین‌المللی یمن و قدرت‌های منطقه‌ای، از جمله عربستان، گفتگو کرده است. عربستان هدف اصلی دور تازه حملات حوثی‌ها بوده؛ حملاتی که گروندبرگ شدت‌گیری آنها را «بی‌سابقه» و «چشمگیر» توصیف کرد.\n\nگروندبرگ گفت بی‌ثباتی منطقه و «نفوذ طرف‌های منطقه‌ای، از جمله ایران و دیگر همسایگان یمن» نیز بر روند جنگ این کشور تاثیر گذاشته است.\n\nحوثی‌ها با کمک کارشناسان ایرانی، اوایل سپتامبر در امتداد ساحل دریای سرخ به سمت جنوب پیشروی کردند و با تصرف شهر راهبردی مخا و چند جزیره در دریای سرخ، دامنه نفوذ خود را تا آبراه مهم تنگه باب‌المندب گسترش دادند. این بزرگ‌ترین پیشروی ارضی حوثی‌ها در سال‌های اخیر بود و به آتش‌بس سال ۲۰۲۲ پایان داد؛ آتش‌بسی که تا حد زیادی درگیری‌های عمده در جنگ داخلی ۱۲ ساله یمن را متوقف کرده بود.\n\nشورشیان همچنین حملات فرامرزی خود به عربستان را تشدید کرده‌اند، تاسیسات نفتی این کشور را هدف قرار داده‌اند و مانع عبور نفتکش‌های آن از تنگه باب‌المندب شده‌اند؛ تنگه‌ای که حدود ۱۲ درصد تجارت جهانی از آن می‌گذرد.\n\nبه گفته سازمان ملل، حمله شورشیان و درگیری با نیروهای یمنی مورد حمایت عربستان و نیروهای متحد آنها، دست‌کم ۸۳۸ کشته و بیش از سه هزار و ۶۴۰ زخمی بر جای گذاشته است. سازمان بین‌المللی مهاجرت نیز اعلام کرده که این دور از درگیری‌ها بیش از ۱۴۵ هزار نفر را ناچار به ترک خانه‌هایشان و آوارگی در داخل یمن کرده است. بنا بر گزارش این نهاد، بیش از سه هزار نفر دیگر نیز از راه دریا به جیبوتی گریخته‌اند.\n\nگروندبرگ گفت دور کنونی تشدید درگیری‌ها در یمن، در مقایسه با دوره‌های پیشین خشونت در این جنگ داخلی، پیچیده‌تر شده است. به گفته او، خطوط نبرد به ساحل دریای سرخ منتقل شده‌اند؛ جایی که «حساس‌ترین خطوط مقدم» مسیرهای دریایی حیاتی برای تجارت جهانی را تهدید می‌کنند.\n\nاو گفت: «شاهد حملاتی به کشتی‌های تجاری در دریای سرخ هم بوده‌ایم. این تحولی هشداردهنده است که باید مایه نگرانی شورای امنیت باشد.»\n\nاو همچنین گفت جنگ یمن بیش از پیش با تازه‌ترین موج جنگ‌ها در خاورمیانه پیوند خورده است؛ موجی که با حمله هفتم اکتبر ۲۰۲۳ حماس به جنوب اسرائیل آغاز شد و تازه‌ترین مورد آن، جنگ آمریکا و اسرائیل علیه ایران است.\n\nدرگیری یمن همچنین به جنگی نیابتی در منطقه میان عربستان و ایران تبدیل شده است. آمریکا نیز مدت‌ها با ارائه کمک اطلاعاتی به عربستان، به‌طور غیرمستقیم در این جنگ نقش داشته است. با این حال، انتقادهای بین‌المللی از حملات هوایی عربستان که به کشته شدن غیرنظامیان انجامید، باعث شد آمریکا حمایت خود را کاهش دهد.\n\nگروندبرگ گفت: «حل‌وفصل وضعیت کنونی دشوار خواهد بود.» او افزود که طرف‌های درگیر و حامیان آنها «در حال حاضر تلاش می‌کنند پیامدهای این تشدید تنش را ارزیابی کنند».\n\nاو گفت: «هنوز گردوخاک زیادی در هواست که باید فروبنشیند تا بتوانند ارزیابی کنند بهترین گزینه برای ادامه مسیر چیست؛ چه در میدان نبرد و چه پای میز مذاکره.»\n\nفرستاده سازمان ملل گفت برای کمک به یافتن راه‌حلی که «یمنی‌ها آن را تعیین کنند»، باید جنگ یمن از دیگر درگیری‌های منطقه جدا شود.\n\nبه کانال تلگرام یورونیوز فارسی بپیوندید\n\nاو گفت: «توصیه من در این مقطع این است که این درگیری‌ها را از هم جدا کنید و از راه مذاکره، به‌شکلی موثر و کارآمد، به تک‌تک آنها رسیدگی کنید.»\n\nهمرسانی نظرها یورونیوز را در گوگل دنبال کنید مطالب مرتبط در اقدامی کم‌سابقه اعضای شورای امنیت به اتفاق آرا حملات حوثی‌ها به عربستان را محکوم کردند خبرگزاری فرانسه: رئیس دولت یمن از ترامپ برای مقابله با حوثی‌ها درخواست کمک کرد حوثی‌های یمن پس از لغو حملات ترامپ قول می‌دهند کشتی‌های آمریکا را هدف نگیرند جنگ یمن سازمان ملل متحد یمن جنگ در یمن حوثی‌ها سیاست یمن نظرها","link":"https://parsi.euronews.com/2026/09/29/un-envoy-meets-houthi-negotiators-escalating-violence-in-yemen","article_rel_path":"articles/2026-09-29/c601936d9523a58a.md","media_files":null,"published_at":"Tue, 29 Sep 2026 20:14:39 +0200","published_epoch":1790705679,"rtl":true},{"hash":"2fdc0c177a5ef64f","source_id":"rss_farda","source_name":"Radio Farda","source_name_fa":"رادیو فردا","source_type":"rss","author_handle":"","title":"ترامپ بار دیگر گفت جنگ با ایران خیلی زود پایان خواهد یافت","summary":"ترامپ می‌گوید از جنگ ایران به عنوان «یکی از مهم‌ترین اقداماتی» که دولتش انجام داده است، یاد خواهد شد.","full_body":"لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند\n\nرئیس‌جمهور آمریکا روز سه‌شنبه هفتم مهر جنگ با ایران را یکی از مهم‌ترین دستاوردهای دولت خود دانست و گفت که از این جنگ به عنوان «یکی از مهم‌ترین اقداماتی» که دولتش انجام داده یاد خواهد شد.\n\nدونالد ترامپ در یک سخنرانی در واشینگتن بار دیگر گفت جنگ با ایران خیلی زود به پایان خواهد رسید و قیمت نفت هم پس از آن کاهش خواهد یافت.\n\nاو وضعیت ایران را «بسیار وخیم» توصیف کرد و گفت: «آن‌ها به‌شدت در حال شکست خوردن هستند».\n\nرئیس‌جمهور آمریکا پیش از این اظهارات، گزارش‌ها مبنی بر پیشنهاد لغو تحریم‌ها و آزادسازی دارایی‌های مسدودشده ایران در صورت عقب‌نشینی تهران از برنامه هسته‌ای خود را رد کرده بود.\n\nعباس عراقچی، وزیر خارجه ایران، که به مقر سازمان ملل رفته بود، روز سه‌شنبه پیش از ترک نیویورک گفت منتظر پاسخ رسمی آمریکا به طرح پیشنهادی ایران است.\n\nدر پی بالا گرفتن جنگ و طولانی‌تر شدن آن، رئیس‌جمهور آمریکا بارها گفته است که برای جلوگیری از دستیابی ایران به سلاح هسته‌ای وارد کارزار شده است.\n\nدر همین حال جی‌دی ونس، معاون رئیس‌جمهور آمریکا در یک گفت‌وگوی پادکستی با یک روزنامه‌نگار محافظه‌کار آمریکایی گفت ایالات متحده فکر می‌کند مجتبی خامنه‌ای، رهبر جمهوری اسلامی، زنده است اما به گفته او «در اداره امور روزمره کشور نقشی ندارد».\n\nونس در این باره گفت: «فکر می‌کنیم او زنده است. البته با قطعیت نمی‌دانیم. من هرگز او را ندیده‌ام. اخیرا هم تصویری از او در مقابل دوربین ندیده‌ام».\n\nمعاون رئیس‌جمهور آمریکا ساختار رهبری ایران را شامل «طیف‌های گوناگونی» از جمله تندروها، محافظه‌کاران، میانه‌روها و روحانیون دانست و گفت رهبر جمهوری اسلامی «بسیار منزوی» است و در تصمیم‌گیری‌های روزمره یا بحث‌های عمومی پیرامون مذاکرات دخالتی ندارد.\n\nونس همچنین امکان دستیابی به توافق با ایران را ممکن دانست اما تأکید کرد که این امر مستلزم آن است که تهران به گفته او «رفتار مناسبی» از خود نشان دهد و به تعهداتش پایبند باشد.\n\nاو توضیح داد که سیاست آمریکا در قبال ایران طی دو ماه آینده نه بر اساس اظهارات، بلکه بر مبنای اقدامات عملی در میدان تعیین خواهد شد و گفت: «ما بر اساس عمل مذاکره می‌کنیم، نه حرف؛ و همین اقدامات نحوه تعامل ما با تهران را در دوره پیش‌رو مشخص خواهد کرد».\n\nمعاون رئیس‌جمهور آمریکا در عین حال مقام‌های ایران را مسئول فروپاشی تفاهم‌نامه اسلام‌آباد دانست و گفت ‌آن‌ها با هدف قرار دادن کشتی‌های تجاری در آب‌های منطقه مرتکب اشتباه شدند.\n\nاو گفت: «فکر می‌کنم ایرانی‌ها متوجه شده‌اند که اشتباه کردند. آن‌ها با ما توافقی امضا کردند، آتش‌بس برقرار شد، قیمت انرژی کاهش یافت و این امکان وجود داشت که اگر ایرانی‌ها به تعهدات خود عمل می‌کردند، از بهبود روابط با آمریکا منافع زیادی به دست آورند».\n\nم انجام روزی بر کشور ما هم خواهد تابید. او با اشاره به اندیشه‌های هاول، اندیشمند چک و از چهره‌های برجسته مبارزه با حکومت کمونیستی چکلسواکی، گفت امیدوار است روزی ایرانیان دیگر ناچار نباشند هویج و سبزی روزانه خود را از لابه‌لای «پوسترهای دروغ حکومتی» که شهر را پوشانده‌اند بردارند. @iranintltv","link":"https://t.me/IranintlTV/359870","article_rel_path":"articles/2026-09-29/885db25bbb485e97.md","media_files":["media/2026-09-29/2e06c11632922dc4.jpg"],"published_at":"2026-09-29T18:10:49+00:00","published_epoch":1790705449,"rtl":true},{"hash":"4d1f16e89fc47816","source_id":"rss_hackernews","source_name":"Hacker News","source_name_fa":"هکر نیوز (تکنولوژی)","source_type":"rss","author_handle":"","title":"The End of a Fair Price: Dynamic Pricing and the Normalization of Gouging","summary":"Article URL: https://prospect.org/2026/09/29/oct-2026-battling-an-army-of-price-setters-owens-review/ Comments URL: https://news.ycombinator.com/item?id=49897826 Points: 9 # Comments: 0","full_body":"This article appears in the  October 2026  issue of  The American Prospect  magazine.   If you’d like to receive our next issue in your mailbox, please  subscribe here .\n\nWhen inflation spiked shortly after the COVID crisis, neoliberal economists kicked into high gear. Their mission was to defend corporations for all price hikes. The reason why prices were spiking, claimed the adherents to the dismal science, owed to demand—rents ostensibly spiked due to growing demand for home offices—or legitimate cost increases, or really any cause other than the firms actually setting prices higher.\n\nGouged: The End of a Fair Price—and What That Means for Your Wallet By Lindsay Owens Viking\n\nThe mainstream media dutifully followed suit . Never mind that corporate profits were soaring, or that companies were using new techniques to personalize prices and even turning over their pricing decisions to third-party consultants making use of artificial intelligence. Prices were simply the work of the invisible hand of the market, not executives wanting to use the opportunities presented by the inflationary environment to smuggle in higher profits.\n\nWhenever a heterodox economist took a dissenting view from the dominant explanations for inflation, including your book reviewer, they were ostracized. We saw this most clearly with Isabella Weber, whose modest suggestion of price controls was mocked as being “truly stupid” by none other than Paul Krugman. (Ironically, it was Krugman who peddled the silly home-office theory of higher rents and ignored, for example, the use of a common pricing algorithm by rival landlords.)\n\nInto this debate stepped Lindsay Owens, a Stanford-educated sociologist, Capitol Hill veteran, and the author of Gouged: The End of a Fair Price—and What That Means for Your Wallet . She broke through the economists’ bluster, first with a viral tweet on price-gouging in 2022, which turned into a New York Times essay . The essay did something that few economists or political analysts bothered with: It listened to the actual earnings calls where executives laid out their plans to ramp up prices as much as they could. There wasn’t an invisible hand after all, but real people telling on themselves to their investors.\n\nThe only beneficiaries of personalized pricing are the firms engaged in the predation.\n\nThree years later, Owens went viral again with a white paper about Instacart’s brief dalliance with personalized pricing. The study, conducted by the organization she runs, Groundwork Collaborative, along with Consumer Reports and More Perfect Union, showed that roughly 75 percent of the items in identical Instacart baskets purchased at the same time varied in price from one shopper to the next. Owens’s critique of Instacart’s pricing was so stinging that she managed to spur an investigation by Trump’s otherwise sleepy Federal Trade Commission. Instacart eventually relented, disavowing the surveillance technology in which it had invested millions to rob customers blind.\n\nNow Owens has put everything she’s learned over the past several years together in a book detailing how pricing is distorted, manipulated, and seized upon by profit-hungry corporations. The book is partly a revolt against economists, and deservedly so: As she writes, “I’m sure you can find plenty of economists and CEOs who will tell you that there’s nothing to see here.”\n\nIn a seemingly constant audition for corporate funding, many (if not most) economists bend over backwards to defend personalized pricing, often by citing literature related to third-degree price discrimination, such as student or senior discounts. The problem is that personalized pricing is a form of first-degree price discrimination, and the benefits from third-degree price discrimination do not carry over. If we permit a company to charge price- insensitive customers more for the same product, the argument goes, the company can also reduce the price for price- sensitive customers, permitting for an expansion of output. Owens says, archly: “If that sounds like bullshit to you, you’re not alone.” What Owens doesn’t say—again, because she’s not trying to convince conflicted economists—is that so long as the company can charge the price-sensitive types one penny below their willingness to pay under a personalized-pricing regime, no consumer benefits from the exchange .\n\nConsumer surplus, one measure ostensibly guiding neoliberal economic thinking, is literally zero when the price is set at each consumer’s willingness to pay. Price-insensitive types see their consumer surplus get drained, while the price-sensitive types realize no improvement from the status quo. The only beneficiaries of personalized pricing, therefore, are the firms engaged in the predation. And the notion, again peddled by certain economists, that we can take these newfound profits and redistribute them to the losers is hopelessly naïve.\n\nOwens also recognizes a fundamental truth that is rejected by the economic orthodoxy: that consolidation facilitates coordinated price hikes. “Competition is kryptonite for gougers,” she explains in the introduction. “So the first step is to wipe out the competition. And that’s exactly what happened.” Industrial organization economists have made a career of defending consolidation and railing against anyone who thinks that higher markups can be modeled as a function of concentration. They’ve even invented names like “superstars” to reflect firms that take over industries through purportedly superior acumen—and just happen to not share any of the spoils with their workers.\n\nGouged is a fast read and makes its persuasive case in just 176 pages. As someone who has made a career out of investigating firms engaged in price-fixing and other schemes to separate consumers (or workers) from what is rightly theirs, I presumed the contents would be familiar territory. But Owens uncovered stories and details that were amazingly fresh and powerful, even for this insider.\n\nIn Chapter 1, titled “Profiting Off You: High-Tech Pricing Consultants—Part Geek Squad, Part Seal Team Six—Killed the Price Tag,” we learn about Hermann Simon, a German professor and co-founder of Simon-Kucher \u0026 Partners (SKP). With a staff of 60 Ph.D.s, including physicists, SKP advised companies on pricing across nearly every major industry. And unlike marketing firms, which respected conflicts of interest, SKP advised purported rivals, like Coke and Pepsi, on how to set their prices. SKP legitimized a science of pricing (price-fixing, really) with a mission: “forming a growing academic infrastructure to help companies optimize prices upward.”\n\nRealPage, which allows landlords to fix prices on rentals by turning over their pricing authority to a common algorithm, is a key villain in Gouged . But the book shows that RealPage is just the latest iteration of conspiracies that have emptied consumers’ wallets for decades. In the late 1980s, U.S. airlines used the Airline Tariff Publishing Company (ATPCO) to signal their future pricing intentions to rivals. ATPCO was used to send “trial balloons” to an airline’s rival, which were accompanied by “footnote designators” specifying the route, fare class, and the terms of the proposed hike. The Department of Justice estimated the ATPCO scheme cost consumers nearly $2 billion between 1988 and 1992.\n\nBut after investigating ATPCO, the DOJ opted to settle the case with some minor modifications to slow down the rate of ticket price changes. Not only did this not work, but it led directly to more recent high-tech innovations. In fact, Jeffrey Roper, a former Alaska Airlines executive and principal target in the ATPCO investigation—his computer was seized at one point—was RealPage’s “principal scientist” at launch.\n\nUsing similar though more sophisticated techniques, RealPage’s algorithm, called YieldStar, was programmed never to recommend a rent below the minimum rent it suggested, effectively creating a “hard floor” for rent prices. Owens explains the role of RealPage’s “pricing advisers,” who served as enforcers of the cartel; if a proposed rent hike was rejected, the pricing adviser escalated the matter to the landlord’s regional manager. Stephen Winn, RealPage’s CEO, wasn’t satisfied with merely lifting rents via a common algorithm; he also cajoled landlords to “monetize lobbies, parking garages, rooftops, and even broom closets,” and to impose maintenance fees when tenants request repairs.\n\nUber is another key villain in Gouged . Per Owens, Uber’s “greatest innovation wasn’t ‘disrupting’ the taxi industry—it was socializing and normalizing the very idea of dynamic pricing. They made us comfortable with the notion that prices could change at any moment.” By now, most of us are familiar with Uber’s efforts to customize your fare based on (among other things) where you are getting picked up, where you are heading, and, allegedly, your remaining battery life . What was less understood, at least for this reviewer, is the way Uber has implemented personalized pricing on the labor side of the equation—that is, using worker data to personalize wages.\n\nIn 2022, Uber rolled out a system of “upfront pricing,” which permitted it to raise fares while cutting driver pay. Owens reviews the research of Columbia’s Len Sherman, who found that after the introduction of upfront pricing, one Uber driver’s “take rate”—the percentage of the fare captured by the company—increased from 32 to 42 percent by the end of 2024. Similar research by Oxford economists found that Uber’s take rate in the U.K. jumped from 25 to 29 percent after the introduction of upfront pricing. Discrimination is great for the entity doing the discriminating.\n\nA chapter on how companies spy on you was especially disturbing. Did you know that home insurers use aerial drones to study your rooftop? If the conditions signal neglect, they might cancel your coverage before an accident. Did you know that carmakers are reporting your driving tendencies to third parties, who “analyze, bundle, and resell it to insurance companies to hike your premiums or cancel your policy altogether”? Did you know that the McDonald’s app tracks its customers’ “spending habits, visit frequency, and even the time of month when they’re most likely to have disposable income”? McDonald’s can then adjust prices; if the app detects you visiting after payday, Owens explains, it might offer fewer discounts during that period. Did you know that Starbucks sold a Washington Post reporter’s data to more than 60 third parties? We learn that the app adjusted his rewards and discounts downward the more money he spent, presumably an indication that his willingness to pay was higher than originally thought.\n\nGouged is particularly helpful for lawmakers looking for ways to constrain the onslaught of anti-competitive pricing tactics. To bolster our defenses, the book suggests a modern-day “Shoppers’ Bill of Rights.” In particular, Owens calls for rules that would compel sellers to show the full, all-in price up front; make it easier to cancel a subscription; give shoppers the right to repair anything they buy; ban algorithmic price-fixing; curb dynamic pricing by allowing only for one price change per day; ban surveillance pricing by reinstituting the price tag; ban algorithmic wage discrimination and guarantee a fair wage; and ensure AI chatbots work for the user, not the AI company or retailer.\n\nThe faster we can convert these ideas into legislation, the faster we can reclaim a sense of fairness in our economy—with or without the support of neoliberal economists. As our faith in free-market capitalism collapses in the face of widening inequality and anti-competitive schemes to empty our wallets, is it any wonder why democratic socialists are gaining traction?\n\nx bluesky Hal Singer is a managing director of Econ One, an adjunct professor of economics at the University of Utah, and director of the Utah Project, an interdisciplinary institute studying antitrust and consumer protection. More by Hal Singer\n\nNo paywall, no corporate owners. Everything you read here is paid for by people like you. Chip in to keep it that way.\n\nKeep the Prospect ad-free and independent.\n\nGet the Prospect in your inbox Cut through the noise of daily news with in-depth, progressive analysis.\n\nUnsubscribe anytime. Submitting your email signs you up for our daily and weekly newsletters.\n\nGet the Prospect in your inbox Cut through the noise of daily news with in-depth, progressive analysis.\n\nUnsubscribe anytime. Submitting your email signs you up for our daily and weekly newsletters.\n\nContinue with Google Or Enter the code sent to your email\n\nSign in by entering the code we sent to , or clicking the magic link in the email.","link":"https://prospect.org/2026/09/29/oct-2026-battling-an-army-of-price-setters-owens-review/","article_rel_path":"articles/2026-09-29/4d1f16e89fc47816.md","media_files":null در به تصمیم‌گیری نیست و آمریکا از سر استیصال در جنگ نظامی به محاصره هوایی روی آورده است.» رضایی ادامه داد: «آمریکا آینده‌ای در منطقه ندارد و ایران با قدرت در مقابل آن ایستاده است.» https://iranintl.com/202609296976","full_body":"محسن رضایی، دبیر شورای عالی امنیت ملی، سه‌شنبه هفتم مهر در دیدار با شاهین مصطفی‌اف، معاون نخست‌وزیر جمهوری آذربایجان، با تکرار مواضع دیگر مقام‌های جمهوری اسلامی گفت: «ترامپ در باتلاقی گرفتار شده که نه می‌تواند مذاکره کند و نه می‌تواند بجنگد.» او افزود: «شروط ایران به آمریکا اعلام شده، اما ترامپ قادر به تصمیم‌گیری نیست و آمریکا از سر استیصال در جنگ نظامی به محاصره هوایی روی آورده است.» رضایی ادامه داد: «آمریکا آینده‌ای در منطقه ندارد و ایران با قدرت در مقابل آن ایستاده است.» https://iranintl.com/202609296976","link":"https://t.me/IranintlTV/359867","article_rel_path":"articles/2026-09-29/599616d725e7aad8.md","media_files":["media/2026-09-29/dc917e1b2a8b05b9.jpg"],"published_at":"2026-09-29T18:03:31+00:00","published_epoch":1790705011,"rtl":true},{"hash":"9d0a4181e005811f","source_id":"rss_iranintl","source_name":"Iran International Wire","source_name_fa":"ایران اینترنشنال وب","source_type":"rss","author_handle":"","title":"ناکامی پشت ناکامی؛ تیم امیر قلعه‌نویی این‌بار به روسیه باخت","summary":"تیم ملی فوتبال ایران در دومین دیدار تدارکاتی خود در فیفادی به مصاف روسیه رفت که با نتیجه ۲-۰ شکست خورد. هر دو گل روسیه را در این بازی آلکساندر گولووین در دقایق ۲۱ و ۳۷ به ثمر رساند.","full_body":"آخرین خبرها تیم ملی فوتبال ایران در دومین دیدار تدارکاتی خود در فیفادی به مصاف روسیه رفت که با نتیجه ۲-۰ شکست خورد. هر دو گل روسیه را در این بازی آلکساندر گولووین در دقایق ۲۱ و ۳۷ به ثمر رساند.\n\nدر این بازی مهدی طارمی و سردار آزمون دو مهاجم تیم ملی از ابتدا در ترکیب حضور داشتند اما نتوانستند دروازه روسیه را باز کنند. تیم ملی فوتبال با هدایت امیر قلعه‌نویی در دو دیدار گذشته خود برابر ازبکستان و روسیه شکست خورد.\n\n۱ کارشناسان صداوسیما: امارات متحده عربی راهبرد جمهوری اسلامی را در تنگه هرمز خنثی کرده است ۲ قوه قضاییه: حمید رسایی، نماینده تهران در مجلس، به بند روحانیت زندان اوین منتقل شده است ۳ روایت شما با وجود اصرار حکومت بر آموزش حضوری، کتاب‌های درسی هنوز توزیع نشده‌اند ۴ کنفرانس «ایران آلترناتیو» خواستار شکل‌گیری جایگزینی موثر و فراگیر در ایران شد ۵ بسنت: ایران تا دو هفته دیگر احتمالا نفتی برای مبادله نخواهد داشت • • • بر اساس این گزارش، با گذشت بیش از ۲۰۰ روز از آغاز درگیری‌ها و حمله هوایی نیروهای آمریکایی و اسرائیلی، سایه سنگین ناامنی و بلاتکلیفی بر تقویم رویدادهای بین‌المللی ورزش در منطقه افتاده است. اگرچه لغو اولیه مسابقاتی چون جایزه بزرگ فرمول یک در بحرین و عربستان و دیدار نهایی «فینالیسیما» میان آرژانتین و اسپانیا در دوحه نشان‌دهنده ابعاد اولیه این بحران بود، اما تداوم جنگ اکنون برگزاری سایر رویدادهای پردرآمد پایان سال را نیز با چالش جدی مواجه کرده است. در حوزه فرمول یک، برگزارکنندگان مسابقات تصمیم‌گیری نهایی برای اجرای دو مسابقه نهایی در قطر و ابوظبی را تا اواسط اکتبر به تاخیر انداخته‌اند. لغو این رقابت‌ها، ضررهای مالی هنگفتی به همراه دارد؛ به همین منظور پیست «ایمولا» در ایتالیا به عنوان جایگزین در حالت آماده‌باش قرار گرفته است. در گلف، تورنمنت‌های معتبر پایان فصل «DP World Tour» در ابوظبی و دبی نیز تحت تاثیر قرار گرفته‌اند. اگرچه مسئولان قصد برگزاری طبق برنامه را دارند، اما برخی بازیکنان برجسته از جمله مت فیتزپاتریک نسبت به امنیت خود ابراز نگرانی کرده‌اند. در بوکس، مبارزه بزرگ «کانلو آلوارز» و «کریستین مبیلی» که برای ۳۱ اکتبر در ریاض برنامه‌ریزی شده، به دلیل نبود برنامه‌های تبلیغاتی و عدم اعلام مبارزات مقدماتی در هاله‌ای از ابهام است و امکان انتقال آن به جده وجود دارد. در رشته دوچرخه‌سواری، تورهای منطقه‌ای مانند تور «العلا» در عربستان در هاله‌ای از ابهام قرار دارند. علاوه بر این، حامیان مالی بزرگ منطقه دچار بحران شده‌اند؛ به‌طوری که شرکت انرژی «باپکو» در بحرین پس از حملات موشکی، اعلام کرد پرداخت دستمزدهای تیم بحرین-ویکتوریوس با تاخیر مواجه شده است. همچنین ابهاماتی درباره تداوم اسپانسری العلا برای تیم استرالیایی جکوالعلا وجود دارد. در فوتبال، لیگ‌های داخلی منطقه‌ای از جمله لیگ برتر ایران ماه‌ها تعطیل بودند و تیم‌های ایرانی مانند استقلال و تراکتور مجبور به برگزاری بازی‌های خود در زمین بی‌طرف در لیگ نخبگان آسیا شده‌اند. در تنیس و قایقرانی (SailGP) نیز تورنمنت‌های فوریه و مسابقات پایانی دبی و ابوظبی تحت نظر نهادهای امنیتی قرار دارند. در مجموع، ورزش خلیج فارس که سرمایه‌گذاری‌های سنگینی در سال‌های اخیر انجام داده بود، اکنون با بحرانی بی‌سابقه و بلاتکلیفی جدی روبه‌رو است.\n\nانگلیس پس از شکست در نیمه‌نهایی جام جهانی مقابل آرژانتین، با وعده توخل برای ساختن تیمی جسورتر و پذیرش «آشوب» به میدان برگشت، اما نخستین رویارویی با اسپانیای قهرمان جهان و اروپا بار دیگر یک مشکل قدیمی را آشکار کرد.\n\nانگلیس در ومبلی ۳ بر ۲ شکست خورد تا تیمی که از سال ۱۹۶۶ در انتظار یک جام بزرگ است، همچنان در مسابقات بزرگ ناکام بماند.\n\nبه نوشته بی‌بی‌سی، انگلیس شروعی آشفته داشت و در همان دو دقیقه نخست با اشتباه مارک گوئهی از لامین یامال گل خورد. اسپانیا چند فرصت دیگر را نیز از دست داد، اما تیم توخل با گل‌های آنتونی گوردون و هری کین ورق را برگرداند و نیمه نخست را ۲ بر یک برد.\n\nتوخل درباره عملکرد تیمش گفت: «مطمین نیستم آشوب زیادی در بازی ما وجود داشت. تعداد فوق‌العاده‌ای توپ را در نیمه زمین حریف پس گرفتیم. مقابل تیمی مثل اسپانیا فقط با بازی نفر به نفر می‌توان چنین کاری کرد، بنابراین بسیار شجاع بودیم.»\n\nنقطه عطف مسابقه در نیمه دوم رقم خورد؛ کین پشت ضربه پنالتی ایستاد، هنگام ضربه لیز خورد و فرصت افزایش برتری انگلیس را از دست داد. اسپانیا پس از آن با گل‌های الکس بائنا و میکل اویارزابال بازی را برگرداند و روند شکست‌ناپذیری خود را به ۳۹ مسابقه رساند.\n\nتوخل با وجود شکست از ساختار تیمش دفاع کرد و گفت: «در حمله ساختار مشخصی داشتیم. تلاش کردیم بارها جهت بازی را عوض کنیم و مدافعان کناری را جلو ببریم تا تفاوت ایجاد کنند. نکات مثبت زیادی وجود داشت، اما متاسفانه نتیجه را نگرفتیم.»\n\nسرمربی انگلیس عملکرد دفاعی تیمش را نیز مثبت ارزیابی کرد و گفت: «دفاع ما و عملکردمان در بلوک پایین عالی بود، به جز گل سوم که از وسط باز شدیم. معمولا نباید چنین اتفاقی بیفتد.» با این حال، انگلیس در این مسابقه بارها در خط دفاع آسیب‌پذیر نشان داد و اشتباه‌های گوئهی و نیکو اورایلی مستقیما به گل‌های اسپانیا منجر شد.\n\nاین شکست برای انگلیس یادآور نیمه‌نهایی جام جهانی بود؛ این تیم آنجا نیز با گل گوردون مقابل آرژانتین پیش افتاد، اما در نهایت شکست خورد. تفاوت این بار این بود که انگلیس عقب نکشید و تا پایان جنگید.\n\nبا این حال، اسپانیا در لحظات تعیین‌کننده آرام‌تر و دقیق‌تر بود؛ همان تفاوتی که مرز میان تیمی است که مرتب جام می‌برد و انگلیسی که همچنان در حسرت نخستین افتخار بزرگ فوتبال مردان از سال ۱۹۶۶ است. توخل با این حال معتقد بود فاصله زیادی میان دو تیم وجود نداشت: «هیچ فاصله‌ای ندیدیم، به جز در اجرای فنی. در ۲۰ متر پایانی آنها از ما بهتر بودند.»\n\nارزیابی‌ای که با جریان بخش‌هایی از مسابقه همخوانی نداشت؛ اسپانیا پیش از آنکه انگلیس نخستین گل خود را بزند، فرصت‌های متعددی برای افزایش اختلاف داشت و می‌توانست خیلی زود سرنوشت مسابقه را مشخص کند.\n\nکین پس از مسابقه گفت: «در جام جهانی به سطح خوبی رسیدیم، اما نتوانستیم ۹۰ دقیقه کامل آن سطح را حفظ کنیم. اینجا هم احتمالا همین اتفاق افتاد. یک روز دیگر قطعا می‌توانستیم این بازی را ببریم.»\n\nاما آن روز فرا نرسید و انگلیس باز هم نبرد. توخل می‌خواهد تیمش «آشوب را بپذیرد»، اما شکست مقابل اسپانیا نشان داد برای فتح جام‌های بزرگ، جسارت و آشوب بدون کنترل کافی نیست.\n\nاتلتیک روز جمعه افشا کرد که منچسترسیتی در تقریبا تمام ۱۱۵ مورد نقض مقررات لیگ برتر که به آن متهم شده بود، مقصر شناخته شده است. این اتهام‌ها به تخلفات مالی بین سال‌های ۲۰۰۹ تا ۲۰۱۸ مربوط می‌شوند.\n\nسیتی قصد دارد به این رای اعتراض کند و مجازات باشگاه هنوز تعیین نشده است. خلدون المبارک تاکید کرد که «این روند هنوز راه درازی در پیش دارد». مجازات‌های احتمالی می‌تواند شامل کسر امتیاز، جریمه مالی سنگین یا حتی اخراج از لیگ برتر باشد.\n\nاتلتیک روز جمعه همچنین گزارش داد باشگاه‌های لیگ برتر در واکنش به رای صادرشده علیه منچسترسیتی در حال برنامه‌ریزی برای اقدام حقوقی هستند.\n\nبه نوشته بی‌بی‌سی، چهار باشگاه لیگ برتر حق خود را برای درخواست غرامت از منچسترسیتی محفوظ نگه داشته‌اند.\n\n«بی‌گناهی را اثبات می‌کنیم»\n\nسیتی نخستین بار در فوریه ۲۰۲۳ با این اتهام‌ها روبه‌رو شد. جلسات رسیدگی به پرونده از اواسط سپتامبر ۲۰۲۴ آغاز شد و در دسامبر همان سال به پایان رسید.\n\nبا این حال، خلدون المبارک که برای نخستین بار پس از صدور رای به‌طور علنی اظهارنظر می‌کرد، روز شنبه در نامه‌ای به هواداران باشگاه نوشت: «اطمینان و عزم ما برای اثبات بی‌گناهی باشگاه، درست به همان اندازه‌ای است که در آغاز این روند بود.»\n\nرییس منچسترسیتی از اظهارنظر درباره اینکه آیا مقصر شناخته شده است یا نه خودداری کرده است، اما در بیانیه‌ نوشت: «روند رسیدگی لیگ برتر همچنان ادامه دارد، بخش‌های مهمی از آن هنوز باید تکمیل شود و این روند مشمول محرمانگی شدید است.»\n\nاو نوشت: «در حالی که برخی خیلی سریع به نتیجه‌گیری‌های خود رسیده‌اند و سروصدای زیادی اطراف ما وجود دارد، هیچ‌چیز تغییر نکرده است. ما پیش از این نیز با چالش‌هایی روبه‌رو شده‌ایم و پیروز شده‌ایم. هنوز افراد زیادی هستند که می‌خواهند روند روبه‌رشد باشگاه ما را تضعیف کنند. ما چنین فرصتی به آنها نخواهیم داد.»\n\nمنچسترسیتی مقابل لیگ برتر\n\nدر همین حال، کریستین پرسلو، مدیرعامل سابق استون ویلا و مدیر اجرایی سابق لیورپول که در چلسی نیز سمتی ارشد داشته است، گفت پرونده سیتی می‌تواند زنجیره‌ای از اتفاقات را آغاز کند که برای فوتبال «وحشتناک» خواهد بود.\n\nپرسلو در برنامه Today رادیو ۴ بی‌بی‌سی در کنار پل گیلروی، وکیل متخصص حقوق فوتبال، حضور یافت.\n\nگیلروی این پرونده را «لحظه‌ای بسیار مهم و تحول‌آفرین برای فوتبال جهان» توصیف کرد.\n\nپرسلو گفت: «سوال این است که این ماجرا کجا تمام می‌شود؟ چون اگر تک‌تک فصل‌ها را بررسی کنید، یعنی همان ۹ فصلی که حالا می‌دانیم منچسترسیتی در آنها مقررات را نقض کرده، هر ۱۹ رقیب سیتی در لیگ برتر در آن فصل‌ها، به درجات مختلف، متحمل زیانی شده‌اند که محاسبه آن آسان است. هر رتبه در لیگ برتر سه میلیون پوند ارزش داشت.»\n\nاو گفت: «تیم‌هایی که پنجم شدند و به لیگ قهرمانان نرسیدند شاید ده‌ها میلیون پوند از دست داده باشند و البته تیم‌هایی که سقوط کردند. فرض کنید تیمی که هجدهم شد، اگر منچسترسیتی آنجا نبود هفدهم می‌شد. طبیعتا آن تیم زیان بسیار بزرگی متحمل شده است.»\n\nپرسلو ادامه داد: «اگر تمام این ادعاهای خسارت را در طول ۹ سال با هم جمع کنید، آن هم فقط در لیگ برتر، می‌بینید که ظرفیت این پرونده برای خارج‌شدن از کنترل بسیار زیاد است.»\n\nهمچنین، لیزا نندی، وزیر فرهنگ بریتانیا، از لیگ برتر خواست هرچه سریع‌تر این پرونده را به نتیجه برساند.\n\nاو به رادیو ۵ لایو بی‌بی‌سی گفت: «فکر می‌کنم بیشتر هواداران فوتبال احساس می‌کنند که این لحظه خوبی برای کلیت فوتبال نیست و هواداران منچسترسیتی نیز درباره اتفاق بعدی بسیار بسیار نگران خواهند بود.»\n\nنندی گفت: «طبیعتا آنچه از این پرونده بیرون می‌آید را با دقت بررسی خواهم کرد، خود لیگ باید هرچه سریع‌تر این پرونده را حل کند؛ نه فقط به خاطر منچسترسیتی، بلکه به خاطر فوتبال.»\n\nرییس سابق سیتی: مجازات باید شدیدتر از جریمه مالی باشد\n\nسیتی در دوره زمانی تحت بررسی این پرونده هشت جام به دست آورد که شامل سه قهرمانی لیگ برتر، سه جام اتحادیه، یک جام خیریه و یک جام حذفی بود.\n\nاتهام‌ها دوران مربیگری روبرتو مانچینی و مانوئل پیگرینی و دو سال نخست حضور پپ گواردیولا را در بر می‌گیرند. گواردیولا پس از ۱۰ سال حضور در باشگاه، در پایان فصل گذشته از سیتی جدا شد.\n\nدیوید برنستین، رییس منچسترسیتی از سال ۱۹۹۸ تا ۲۰۰۳، به تایمز رادیو گفت پس از شنیدن خبر مقصر شناخته‌شدن سیتی احساس «بسیار وحشتناکی» داشته است، اما پذیرفت که هر مجازاتی باید «شدیدتر» از یک جریمه مالی باشد.\n\nاو افزود: «نمی‌توانم درباره مجازات نظر بدهم. اگر پس از اعتراض مشخص شود باشگاه محبوب من در ۱۱۵ اتهام مقصر است، با مجازات بسیار شدیدی روبه‌رو خواهد شد.»\n\nبرنستین گفت: «تنها چیزی که می‌توانم بگویم این است که مجازات مالی کافی نیست. متاسفانه باید چیزی شدیدتر از آن باشد.»\n\nاین تیم در آستانه دیدار شنبه لیگ ملت‌های اروپا مقابل انگلیس در ورزشگاه ومبلی، با رکورد ۳۸ بازی پیاپی بدون شکست در مسابقات ملی وارد میدان می‌شود.\n\n- قهرمان یورو ۲۰۰۸ - قهرمان جام جهانی ۲۰۱۰ - قهرمان یورو ۲۰۱۲ - قهرمان یورو ۲۰۲۴ - قهرمان جام جهانی ۲۰۲۶\n\nاین تیم از شکست یک بر صفر مقابل کلمبیا در سال ۲۰۲۴ تاکنون نباخته است.\n\nموفقیت‌های فوتبال اسپانیا به تیم ملی بزرگسالان مردان محدود نمی‌شود؛ - شش قهرمانی اروپا در رده زیر ۱۹ سال - سه قهرمانی اروپا در رده زیر ۲۱ سال - قهرمانی جام جهانی زنان در سال ۲۰۲۳\n\nدر سطح باشگاهی نیز تیم‌های اسپانیایی از سال ۲۰۰۹ تاکنون نیمی از تمام عناوین قهرمانی ممکن در لیگ قهرمانان اروپا و لیگ اروپا را به دست آورده‌اند.\n\nبی‌بی‌سی نقش لاماسیا را یکی از عوامل کلیدی تداوم موفقیت اسپانیا می‌داند؛ هشت محصول آکادمی بارسلونا در تیم قهرمان جام جهانی ۲۰۱۰ حضور داشتند و همین تعداد نیز در تیم قهرمان جهان در سال ۲۰۲۶ بازی کردند.\n\nهشت بازیکن پرورش‌یافته در آکادمی لاماسیای بارسلونا در تیم اسپانیایی حضور داشتند که با هدایت ویسنته دل‌بوسکه قهرمان جام جهانی ۲۰۱۰ شد. در تیم لوییس دلافوئنته که تابستان امسال بار دیگر جام جهانی را بالای سر برد نیز هشت محصول این آکادمی حضور داشتند.\n\nبارسلونا در سال ۱۹۹۲ با هدایت کرویف و با سبک «فوتبال کامل» برای نخستین بار قهرمان جام باشگاه‌های اروپا شد؛ سبکی که تیم ملی هلند در دهه ۱۹۷۰، با حضور خود کرویف، پیشگام آن بود و بعدها بین سال‌های ۲۰۰۸ تا ۲۰۱۲ در دوران مربیگری پپ گواردیولا در نیوکمپ بازتاب پیدا کرد.\n\nدر آن دوره، بارسلونا سه فصل پیاپی قهرمان لالیگا شد و اسپانیا نیز در فاصله قهرمانی‌هایش در جام ملت‌های اروپا در سال‌های ۲۰۰۸ و ۲۰۱۲، جام جهانی ۲۰۱۰ را فتح کرد.\n\nژاوی، آندرس اینیستا و سرخیو بوسکتس در سیستمی پرورش یافتند که بازیکنان در آن مالکیت توپ و بازی موقعیتی را در خالص‌ترین شکل آن می‌آموختند.\n\nجوردی گراتاکوس، مدیر بین‌المللی آکادمی‌های بارسلونا از سال ۲۰۰۹ تا ۲۰۱۱ و سپس از ۲۰۱۶ تا ۲۰۲۰، به رادیو ۵ لایو بی‌بی‌سی گفت: «مهم‌ترین نکته، درک معنای تاکتیکی یک اقدام فنی است. منظورم تربیت بازیکنان باهوشی است که از نظر فنی نیز بسیار توانمند باشند.»\n\nاو افزود: «در این سطح، همه بازیکنان از نظر فنی بسیار خوب هستند. مهم‌ترین بازیکنان کسانی‌اند که همیشه بهترین تصمیم را در زمین می‌گیرند و باعث بهتر شدن دیگران می‌شوند.»\n\nمدیر پیشین بین‌المللی آکادمی‌های بارسلونا گفت: «هدف اصلی آماده کردن بازیکنان برای قرار گرفتن در موقعیت مناسب است. این یک آموزش باز است؛ شرایط، زمینه و محیطی ایجاد می‌کنید که بازیکن در آن باید تصمیم بگیرد و مربی نیز باید بگوید: \"این بهترین انتخاب بود؛ دفعه بعد گزینه دیگر را انتخاب کن.\" مهم‌ترین مساله این است که خود بازیکنان باید در جریان بازی تصمیم بگیرند.»\n\nهانسی فلیک در دو فصل نخست حضورش به عنوان سرمربی بارسلونا، کاری را که گواردیولا انجام داده بود تکرار کرد؛ و این شباهت فقط به دو قهرمانی پیاپی در لالیگا محدود نمی‌شود.\n\nمحصولات آکادمی موتور محرک پروژه او هستند. لامین یامال، دنی اولمو و پائو کوبارسی به بازیکنانی کلیدی در سطح باشگاهی و ملی تبدیل شده‌اند؛ درست مانند نسل سال‌های ۲۰۰۸ تا ۲۰۱۲.\n\nاسپانیا فرمول تکرار موفقیت را پیدا کرده و بارسلونا در قلب این فرمول قرار دارد.\n\nاگر بارسلونا و کاتالونیا نماینده هنر فوتبال اسپانیا باشند، سرزمین باسک نماینده شخصیت آن است.\n\nپنج بازیکن تیم اسپانیا در جام جهانی ۲۰۲۶ از این منطقه بودند و در اتلتیک بیلبائو یا رئال سوسیداد پرورش یافته بودند؛ دو باشگاهی که هنگام قهرمانی اسپانیا در یورو ۲۰۲۴، هشت بازیکن تیم ملی در آن‌ها بازی می‌کردند.\n\nمیکل مرینو نیز هست؛ بازیکنی که در مرحله یک‌چهارم نهایی یورو ۲۰۲۴ گل پیروزی مقابل آلمان را زد و سپس در شش مسابقه مقدماتی جام جهانی شش گل به ثمر رساند و در تابستان نیز گل‌های دیرهنگام پیروزی‌بخش مقابل پرتغال و بلژیک را زد.\n\nمرینو باسکی نیست، اما اهل پامپلونا در منطقه خودمختار ناوار است؛ منطقه‌ای که فرهنگ اسپانیایی و باسکی هر دو تاثیر قابل توجهی بر آن دارند. تنها پنج کیلومتر آن‌طرف‌تر از پامپلونا، شهر سیسور مایور قرار دارد؛ شهری که سزار آسپیلیکوئتا، کاپیتان سابق چلسی و ملی‌پوش اسپانیا، در آن بزرگ شده است.\n\nآسپیلیکوئتا در توصیف فرهنگ باسک به رادیو ۵ لایو بی‌بی‌سی گفت: «انضباط، فرهنگ سخت‌کوشی، تسلیم نشدن و تاب‌آوری؛ بدون خودنمایی زیاد. معمولا مردم می‌خواهند این فرهنگ مبارزه و سرسختی را نشان دهند؛ چیزی شبیه فوتبال انگلیس، با نبردهای بیشتر، بازی فیزیکی‌تر و جنبه فنی کمتر. اما از نظر تاکتیکی نیز تیم‌ها منسجم‌ترند، شناخت بسیار خوبی از محل حرکت خود دارند و وقتی صاحب توپ می‌شوند، ساده بازی می‌کنند و تلاش می‌کنند هرچه سریع‌تر به سمت جلو بروند.»\n\nپنج بازیکن باسکی حاضر در تیم جام جهانی ۲۰۲۶ نقش مهمی در موفقیت‌های اخیر اسپانیا داشته‌اند و نمونه‌ای از همان ویژگی‌هایی هستند که کرویف درباره بازیکنان این منطقه به آن اعتقاد داشت.\n\nکرویف زمانی گفته بود: «نخستین کاری که به عنوان مربی انجام دادم، جذب چهار بازیکن از منطقه باسک بود. آن‌ها از هیچ‌چیز نمی‌ترسند.»\n\nدر تیم اسپانیا با هدایت دلافوئنته در سال ۲۰۲۶، اونای سیمون درون دروازه قرار داشت و آیمریک لاپورته، مدافع سابق منچسترسیتی، یکی از ستون‌های خط دفاعی بود؛ خط دفاعی که در هشت مسابقه کل تورنمنت تنها یک گل دریافت کرد.\n\nنیکو ویلیامز پاس گل قهرمانی فران تورس در فینال مقابل آرژانتین را داد. مارتین سوبیمندی نیز پس از ورود از روی نیمکت در فینال‌های یورو ۲۰۲۴ و جام جهانی تاثیر مثبتی داشت و میکل اویارسابال در ۲۰ بازی اخیرش برای اسپانیا ۱۸ گل به ثمر رسانده است.\n\nنفوذ باسک فراتر از زمین مسابقه نیز دیده می‌شود؛ مربیان باسکی هدایت چهار باشگاه بزرگ انگلیس را بر عهده دارند: میکل آرتتا در آرسنال، اونای امری در استون ویلا، ژابی آلونسو در چلسی و آندونی ایرائولا در لیورپول.\n\nو اما ستون نهایی؛ آموزش\n\nرافا بنیتز، سرمربی سابق لیورپول، توضیح داد: «ما در اسپانیا در حال تربیت گروهی از مربیان بدنسازی بودیم که فوتبال را می‌شناختند. به دانشگاه جان مورز لیورپول رفتم تا برنامه متخصصان علوم ورزشی آن‌ها را ببینم و آن‌ها دانشی را که ما درباره فوتبال داشتیم، نداشتند.»\n\nاو می‌گوید: «آن‌ها در زمینه آمادگی جسمانی بسیار خوب بودند، اما درباره کار با توپ و مدیریت در زمین شناخت لازم را نداشتند. بنابراین در انگلیس چنین متخصص حرفه‌ای که فوتبال، پزشکی ورزشی و تمام موضوعاتی را که ما در دانشگاه می‌خواندیم بشناسد، وجود نداشت. این بخش بسیار مهمی از فرایندی بود که باعث پیشرفت اسپانیا شد؛ پیشرفتی که از آن زمان تاکنون ادامه داشته است.»\n\nآن‌ها همچنین با اشاره به پرونده فولارین بالوگان خواستار افزایش سازوکارهای کنترل و نظارت شده‌اند تا اطمینان حاصل شود که «پرونده‌های انضباطی افراد به شکلی آشکار و قابل اثبات از دخالت سیاسی مصون می‌ماند».\n\nمدت‌هاست میان لیگ‌های بزرگ اروپا و فیفا تنش وجود دارد؛ به‌ویژه بر سر تقویم روزبه‌روز فشرده‌تر فوتبال. راه‌اندازی و گسترش رقابت‌های جدیدی مانند جام جهانی باشگاه‌ها نیز به این اختلاف‌ها دامن زده است.\n\nگروه «لیگ‌های اروپایی» دو سال پیش با ارایه شکایتی به کمیسیون اروپا، فیفا را به اقدامات سو استفاده‌گرانه متهم کرد. دامنه این شکایت از آن زمان به فوتبال زنان نیز گسترش یافته است.\n\nدر بیانیه چهار لیگ آمده است: «بنیان‌های دیرینه فوتبال در سال‌های اخیر با یک مشکل اساسی در حکمرانی روبه‌رو شده است؛ مشکلی که در آن رییس فیفا به جای مقابله با ایده‌های استثمارگرانه، فعالانه آن‌ها را ترویج کرده است. هرچند ذی‌نفعان فوتبال در نهایت فیفا را وادار کردند طرح فیفا فوروارد اینترپرایز را کنار بگذارد، شرایطی که زمینه شکل‌گیری FFE را فراهم کرد همچنان پابرجاست.»\n\nدر بخش دیگری از بیانیه این چهار لیگ آمده است: «رییس فیفا اکنون ضرورت اصلاحات را پذیرفته است، اما پس از ماجرای FFE، بررسی تغییرات سطحی و صرفا فرایندی کافی نیست. اصلاحات بنیادین در ساختار حکمرانی ضروری است تا حدود و اختیارات قانونی در فیفا بار دیگر به شکلی روشن مشخص شود؛ از جمله اینکه اطمینان وجود داشته باشد پرونده‌های انضباطی افراد به شکلی آشکار و قابل اثبات از دخالت سیاسی مصون هستند.»\n\nدر ادامه بیانیه آمده است: «آینده فیفا برای همه کسانی که به فوتبال اهمیت می‌دهند مهم است، زیرا اگر بنیان‌های این ورزش تضعیف شود، فوتبال نمی‌تواند در سطح جهانی رشد کند.»\n\nچهار لیگ بزرگ اروپا علاوه بر انتقاد از اینفانتینو، از رییس آینده فیفا خواسته‌اند سه اصلاح اساسی را بپذیرد: نخست، ایجاد یک نهاد دایمی تصمیم‌گیر در فیفا که نمایندگان فدراسیون‌های ملی، لیگ‌ها، باشگاه‌ها و بازیکنان در آن حضور داشته باشند؛ دوم، تعهد به انتشار دلایل و استدلال‌های پشت تصمیم‌های مهم پیش از اتخاذ آن‌ها؛ و سوم، جداسازی وظایف مقررات‌گذاری فیفا از فعالیت‌های تجاری این نهاد.\n\nدر بیانیه آمده است: «ساختار حکمرانی فیفا که قدرت مقررات‌گذاری، تجاری و سیاسی را بدون کنترل و نظارت در یک دفتر متمرکز می‌کند و در همان حال، ذی‌نفعانی را که از این تصمیم‌ها تاثیر می‌پذیرند صرفا به جایگاهی مشورتی تنزل می‌دهد، دیگر پاسخگوی نیازهای موجود نیست.»\n\nاین لیگ‌ها همچنین از نامزدهای انتخابات ریاست فیفا خواسته‌اند این اصول را بپذیرند و رییس بعدی فیفا در ۱۰۰ روز نخست دوره خود، نشستی برای اصلاح ساختار حکمرانی برگزار کند؛ نشستی با ریاست فردی مستقل که فدراسیون‌های عضو و دیگر بخش‌های جامعه فوتبال در آن نماینده داشته باشند و موظف باشد ظرف شش ماه گزارش خود را به صورت عمومی منتشر کند.\n\nدر ادامه بیانیه آمده است: «همه نامزدهای ریاست فیفا باید برنامه اصلاحی خود را منتشر کنند، درباره محتوای آن به بحث بپردازند و به قواعد انتخاباتی عادلانه پایبند باشند. منابع مالی، حقوقی، ارتباطی و بازاریابی فیفا و همچنین بودجه‌های توسعه فوتبال باید کاملا بی‌طرف باقی بمانند و هرگز برای هیچ نامزدی مزیت انتخاباتی ایجاد نکنند.»\n\nمهلت نامزدهای انتخابات ریاست فیفا برای اعلام رسمی حضورشان ۱۸ نوامبر است و انتخابات در ماه مارس برگزار خواهد شد.\n\nاینفانتینو تاکنون تنها فردی است که نامزدی خود را اعلام کرده است. گاردین پیش‌تر گزارش داده بود که در فوتبال اروپا نگرانی‌ها درباره این احتمال افزایش یافته که او بدون هیچ رقیبی دو اری آمریکا شبکه‌های تأمین تجهیزات نظامی ایران را در چین و پاکستان هدف قرار داد","summary":"وزارت خزانه‌داری آمریکا می‌گوید «سید اصغر علیزاده طباطبایی»، نماینده وزارت دفاع ایران در پکن، را نیز تحریم کرده است.","full_body":"لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند\n\nوزارت خزانه‌داری ایالات متحده روز سه‌شنبه هفتم مهر در چارچوب «عملیات طرد اقتصادی»، ۱۰ فرد و نهاد را در چندین حوزهٔ قضایی تحریم کرد که به گفته آن، برای وزارت دفاع و پشتیبانی نیروهای مسلح جمهوری اسلامی ایران، سلاح و قطعات تسلیحاتی تهیه کرده‌اند.\n\nآمریکا می‌گوید این وزارتخانه نه تنها مسئول تحقیق، تولید و تأمین تسلیحات برای نیروهای مسلح ایران است، بلکه همچنین بر سازمان‌هایی نظارت دارد که در توسعهٔ موشک‌های بالستیک و پهپادهای ایران مشارکت دارند.\n\nاسکات بسنت، وزیر خزانه‌داری آمریکا، در بیانیه‌ای گفت: «در چارچوب عملیات طرد اقتصادی، وزارت خزانه‌داری همچنان کسانی را که با ارائهٔ حمایت‌های مادی، فناورانه یا مالی به رژیم ایران امکان تداوم فعالیت‌های تروریستی‌اش را می‌دهند، هدف قرار داده و مختل خواهد کرد».\n\nبه گفته او، «وزارت خزانه‌داری هیچ‌گونه حمایتی از این رژیم را تحمل نخواهد کرد و به شناسایی، افشا و منزوی کردن تسهیل‌گران ایران ادامه خواهد داد».\n\nوزارت خزانه‌داری ایالات متحده می‌گوید تحریم‌های روز سه‌شنبه بیش از پیش توانایی ایران را برای بازسازی برنامه‌های تسلیحاتی‌اش تضعیف می‌کند و هزینهٔ کسانی را که تصمیم می‌گیرند به تلاش‌های تهران برای تأمین تجهیزات نظامی کمک کنند، افزایش می‌دهد.\n\nوزیر خزانه‌داری ایالات متحده روز دوم شهریور اقدامات گسترده و همه‌جانبه اقتصادی علیه جمهوری اسلامی ایران را با عنوان «عملیات طرد اقتصادی» اعلام کرد که هدف از آن، به گفتهٔ اسکات بسنت، «قطع تمام شریان‌های حیاتی اقتصادی» ایران است، «تا زمانی که تهران کاملاً تنها بماند».\n\nاین وزارتخانه روز سه‌شنبه اعلام کرد که عملیات یاد شده «در حال قطع آخرین شریان‌های اقتصادی تأمین‌کنندهٔ بقای رژیم ایران است».\n\nبه گفته آن، وزارت خزانه‌داری شبکه‌ها، واسطه‌ها و کانال‌های مالی را که ایران برای قاچاق نفت، دور زدن تحریم‌ها و تأمین مالی تروریسم به کار می‌گیرد، شناسایی کرده است. «وزارت خزانه‌داری در همکاری با شرکا در سراسر دولت آمریکا، اتحادیهٔ اروپا، بریتانیا، شرکای خلیج فارس و دیگران، هر منبع درآمد غیرقانونی این رژیم را هدف قرار می‌دهد».\n\nوزارت خزانه‌داری ایالات متحده هشدار داد هر نهادی که از طرف ایران در تسهیل پولشویی یا دور زدن تحریم‌ها نقش داشته باشد، در معرض قطع دسترسی به نظام مالی ایالات متحده قرار می‌گیرد.\n\nاین وزارتخانه همچنین تأکید کرد کسانی که همچنان با رژیم ایران تجارت می‌کنند، در معرض «تحریم‌های ثانویه» خواهند بود و سرعت اجرای اقدامات تنبیهی آمریکا نیز افزایش خواهد یافت.\n\nوزارت خزانه‌داری آمریکا می‌گوید «سید اصغر علیزاده طباطبایی» به‌عنوان نماینده وزارت دفاع ایران در پکن، مسئول هماهنگی خرید سامانه‌های تسلیحاتی کامل و قطعات دومنظوره از سوی تهران در چین است و به همین دلیل، بر اساس فرمان اجرایی ۱۳۳۸۲ تحریم می‌شود.\n\n«گروه تحقیق و توسعه کاوشکام آسیا»، مستقر در ایران، نیز که در فهرست تحریم‌های روز سه‌شنبه قرار گرفته است، متهم شده که تجهیزات الکترونیکی از جمله کانکتورها را برای «شرکت صنایع هواپیماسازی ایران (هسا)» تهیه کرده است.\n\nوزارت خزانه‌داری آمریکا می‌گوید این شرکت که زیرمجموعهٔ وزارت دفاع ایران است، در توسعهٔ پهپادها و هواپیماهای نظامی تخصص دارد. کاوشکام همچنین تجهیزات الکترونیکی در اختیار «گروه صنعتی شهید باکری» قرار داده است؛ نهادی زیرمجموعهٔ «سازمان صنایع هوافضا» که مسئول برنامهٔ موشک‌های بالستیک سوخت جامد ایران است.\n\n«علی فتوت احمدی»، مستقر در ایران، مدیر کاوشکام است و از طرف این شرکت مکاتباتی را با هسا امضا کرده است. او نیز در فهرست تحریم‌های آمریکا قرار گرفته است.\n\nبه گفته وزارت خزانه‌داری آمریکا، شرکت «EC Mojo Technology Co Limited» مستقر در هنگ‌کنگ، قطعات الکترونیکی برای پشتیبانی از تلاش‌های تأمینی کاوشکام فراهم کرده است.\n\n«لی فن»، نمایندهٔ این شرکت در چین، هنگام ارائهٔ خدمات در حمایت از تلاش‌های تأمینی کاوشکام، کوشیده است تحریم‌ها و کنترل‌های صادراتی را دور بزند.\n\n«پریسا لالی»، نمایندهٔ کاوشکام در ایران، نیز متهم شده که خریدهای این شرکت را برای هسا تسهیل کرده است.\n\nاین شرکت و نمایندگان ایران و چین که همکار آن هستند نیز تحریم شده‌اند.\n\n«وسیم پاشا تجمعال»، مستقر در پاکستان، رئیس «گروه کاوالیر» معرفی شده است؛ یک شرکت خصوصی دفاعی که در پاکستان و دیگر ول اعتماد ندارد، فاصله میان دریافت درآمد و از دست رفتن ارزش آن کوتاه تر میشود. مردم دیگر نمیپرسند با پولشان چه بخرند، میپرسند «چگونه پیش از آنکه دیر شود از شر آن خلاص شوند.» حقوق صبح واریز میشود و ممکن است همان روز به کالا تبدیل میشود (از وحشت گران شدن لحظه ای) و اگر مبلغی باقی بماند بلافاصله تبدیل به ارز یا طلا میشود. فروشنده از نگه داشتن پول میترسد، خریدار از عقب انداختن خرید میترسد. قراردادها کوتاه تر میشوند، قیمت ها ماندگار نیستند، هیچ کس مطمئن نیست عددی که امروز میبیند فردا نیز معنایی داشته باشد. در این مرحله، پول یکی از بنیادی ترین کارکردهای خود را از دست میدهد، توان ذخیره ارزش! و زمانی که جامعه دیگر حاضر نیست ثروت خود را در قالب پول ملی نگه دارد، بحران از مرز اقتصار عبور میکند و به بحران اعتماد تبدیل میشود. به امید نجات از وضعیت بوجود آمده (در آخرین لحظات) موضوع یک توافق موقت با ایالات متحده نیز در دستور کار جمهوری اسلامی قرار گرفته است. ولی بر اساس اطلاعات موثقی که بدست «عدالت علی»رسیده است کارشنان اقتصادی خود دولت هم عقیده هستند که حتی اگر چنین توافقی بتواند برای مدتی منابع مالی تازه ای وارد اقتصاد کند یا فشار ها را کاهش دهد، چیزی پیش از یک تزریق موقت نخواهد بود، فرصتی برای خریدن زمان، نه درمان مسئله ای که ریشه های آن بسیار عمیق تر شده است. اقتصاد ایران در این نقطه دیگر با یک بحران معمولی روبه‌رو نیست. مسئله فقط تورم نیست، فقط سقوط ریال نیست، فقط کسری بودجه نیست. مسئله این است که چند بحران، هم زمان یکدیگر را تعذیه میکنند، دولت برای جبران کسری به پول بیشتری نیاز دارد، پول بیشتر تورم را تشدید میکند، تورم اعتماد به ریال را از بین میبرد، فرار از ریال سقوط آن را سریع تر میکند، سقوط پول درامد واقعی دولت و مردم را کاهش میدهد و همین کاهش دوباره فشار برای خلق پول را بیشتر را افزایش میدهد. دایره بسته شده است. و زمانی که چرخه ای شکل میگیرد، ترسناک ترین بخش ماجرا دیگر سقوط نیست.","full_body":"۴. اثر اولیورا - تانزی (Olivera–Tanzi Effect) تورم فقط مردم را فقیر نکرده است در سطوح بالا خود دولت را نیز بلعیده است. میان زمانی که یک مالیات محاسبه میشود و زمانی که پول واقعا به خزانه میرسد تورم بخش قابل توجهی از آن را میبلعد. دولت روی کاغذ در آمد دارد، اما زمانی که آن درآمد وصو صله میان در آمد ها و هزینه های دولت آن قدر عمیق شده که بخشی از این شکاف از مسیر افزایش حجم پول جبران میشود. پولی وارد اقتصاد میشود که در برابرش کالا، تولید یا ثروت تازه ای ایجاد نشده است. عدد ها بزرگ تر میشوند اما کشور فقیر تر میشود. حساب ها به نظر عادی هستند در حالی که ارزش پولی که در آن ها است تبخیر شده و تنها سایه آن به جا مانده. ۳. فرار از ریال و دلارزه شدن اقتصاد (Currency Substitution / Dollarization) فرار از ریال پدیده تازه ای نیست. سال ها است بخشی از جامعه برای حفظ ارزش دارایی های خود به ارز، طلا، ملک کالا و هر چیزی پناه میبرند که تصور میکند در برابر کاهش ارزش پول ملی دوام بیشتری دارد. اما انچه اکنون تغییر کرده مقیاس و سرعت این رفتار است. اعتماد به ریال به عنوان وسیله ای برای حفظ ارزش به شدت فرسوده شده است. به محض اینکه پول به دست میرسد مسابقه ای برای خلاص شدن از آن آغاز میشود. حقوق، درآمد فروش کالا یا هر دریافتی دیگری باید هر چه زودتر به چیزی تبدیل شود که احتمال دارد فردا هنوز ارزش داشته باشد. هیچ کس نمیخواهد آخرین نفری باشد که ریال را در دست نگه داشته است و همین ترس خود به نیرویی تازه علیه ریال تبدیل میشود. هر چه مردم سریع تر از پول ملی خارج میشوند فشار بر آن بیشتر میشود و هر چه ریال سریع تر سقوط میکند انگیزه برای فرار از آن شدید تر میشود. در این مرحله دیگر تنها با کاهش ارزش پول رو به رو نیستیم، با فروپاشی اعتماد به خود پول روبه رو هستیم.","full_body":"در روزهای اخیر، بخش قابل توجهی از اطلاعاتی که به «عدالت علی» رسیده، مربوط به وضعیت اقتصادی ایران است. نه آمارهای معمول تورم نه قیمت کالاهای روزمره و نه گزارش هایی که مردم هر روز با پوست و استخوان خود احساس میکنند. بلکه داده ها و ارزیابی های درونی که معمولا راهی به فضای عمومی پیدا نمیکند. برای حفظ امنیت دوستانی که این اطلاعات را برای ما ارسال میکنند به شیوه ای این اطلاعات را منتشر میکنیم که آنها در معرض خطر قرار نگیرند. اما آنچه میتوان گفت به اندازه کافی روشن است. ۱. سلطه مالی (Fiscal Dominance) بانک مرکزی دیگر عملا در موقعیتی نیست که بتواند مستقل از نیازهای دولت تورم را مهار کند. کسری های سنگین دولت همه چیز را تحت الشعاع قرار داده اند و سیاست پولی بیش از آنکه در خدمت ثبات قیمت ها باشد به ابزاری برای تامین ما           fullArticleBtn = '<button class="offline-article-btn" onclick="openArticleModal(' + idx + ')">📖 مطالعه کامل مقاله (آفلاین)</button>';
        } else if (it.article_rel_path) {
          fullArticleBtn = '<a class="offline-article-btn" href="../' + it.article_rel_path + '" target="_blank">📖 مطالعه کامل مقاله (آفلاین)</a>';
        }

        html += '<div class="tweet-card">' +
          '<div class="avatar">' + initial + '</div>' +
          '<div class="tweet-content">' +
            '<div class="tweet-header">' +
              '<span class="author-name">' + (it.source_name_fa || it.source_name) + '</span>' +
              (it.author_handle ? '<span class="author-handle">' + it.author_handle + '</span>' : '') +
              '<span class="dot">•</span>' +
              '<span class="time-badge">' + (it.published_at || '') + '</span>' +
              '<span class="' + badgeClass + '">' + typeLabel + '</span>' +
            '</div>' +
            '<div class="tweet-text" dir="' + (it.rtl ? 'rtl' : 'ltr') + '">' + escapeHtml(it.summary || it.title) + '</div>' +
            mediaHtml +
            fullArticleBtn +
          '</div>' +
        '</div>';
      });
      container.innerHTML = html;
    }

    function openArticleModal(idx) {
      const it = items[idx];
      if (!it) return;
      document.getElementById('m-title').innerText = it.title;
      document.getElementById('m-meta').innerText = 'منبع: ' + (it.source_name_fa || it.source_name) + ' | زمان: ' + it.published_at;
      
      const paragraphs = (it.full_body || it.summary).split('\n\n');
      let bodyHtml = '';
      paragraphs.forEach(p => {
        if (p.trim()) bodyHtml += '<p>' + escapeHtml(p.trim()) + '</p>';
      });
      document.getElementById('m-body').innerHTML = bodyHtml;
      document.getElementById('article-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('article-modal').classList.remove('open');
    }

    function filterTab(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFeed();
    }

    function escapeHtml(t) {
      if (!t) return '';
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    renderFeed();
  </script>
</body>
</html>
