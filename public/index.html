a access - Reuters", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxQSVFmcHRvNGEzVXRKbU5Kc0JhSDV4R2o0bnpXSUJMZnRMc1E2ckNCRzBaWDhzY2xObHVtNmtiWmdoX3g4NlVsYkc1bzFDbVB0T016LWczNHJ6bGx2ZXlQeDZPUGNjeXJPaWZ3Wm5DdU9za21PMXFlZVVDckh5Q1I0QnROcElOTnA2bGMzczBMbFJweW1ISkkwWUgzNXJpTU95N0NR?oc=5", "summary": "Italy fines Meta $887 million over Android users' data access    Reuters", "source_id": "reuters_wire", "source_name": "Reuters Wire", "source_name_fa": "خبرگزاری رویترز", "category": "wire", "published_at": "2026-11-14T13:08:10+00:00", "published_epoch": 1794661690, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "05a3524242e0e2a5", "title": "♦️ خبرگزاری رویترز در گزارشی اختصاصی به نقل از سه منبع آگاه گزارش داده است که دونالد ترامپ، رئیس‌جمهوری آمریکا، در روزها...", "link": "https://t.me/VahidOnline/79111", "summary": "♦️ خبرگزاری رویترز در گزارشی اختصاصی به نقل از سه منبع آگاه گزارش داده است که دونالد ترامپ، رئیس‌جمهوری آمریکا، در روزهای اخیر به مشاوران ارشد خود گفته است در صورتی که ایران یا حوثی‌های مورد حمایت تهران اقدام تحریک‌آمیز تازه‌ای علیه آمریکا انجام ندهند، ممکن است از صدور دستور حملات نظامی جدید علیه ایران خودداری کند.\n\nبر اساس این گزارش که روز شنبه ۲۳ آبان منتشر شد، ترامپ پس از برگزاری جلساتی با مشاوران امنیت ملی و دریافت گزارش‌های اطلاعاتی، در حال بررسی امکان خودداری از آغاز دور تازه حملات است. با این حال، او هنوز تصمیم نهایی درباره چگونگی پایان دادن به جنگی که در فوریه ۲۰۲۶ با مشارکت اسرائیل علیه ایران آغاز شد، اتخاذ نکرده است.\n\nترامپ طی هفته‌های اخیر مواضع متفاوتی درباره آینده جنگ اتخاذ کرده است؛ گاهی از احتمال تشدید حملات و ازسرگیری عملیات نظامی گسترده سخن گفته و گاهی از پایان دادن به درگیری‌ها و استفاده از فشارهای اقتصادی به جای جنگ نظامی حمایت کرده است.\n\nبه گفته منابع رویترز، او همچنین نسبت به درخواست متحدان منطقه‌ای آمریکا برای پرهیز از بازگشت به یک جنگ تمام‌عیار ابراز همدلی کرده است.\n\nیکی از بخش‌های مهم گزارش رویترز به تلاش‌های دیپلماتیک عربستان سعودی و ترکیه برای جلوگیری از آغاز مجدد حملات آمریکا علیه ایران مربوط است.\n\nبر اساس این گزارش، ترامپ طی دو هفته گذشته در تماس‌های تلفنی با شاهزاده محمد بن سلمان، ولیعهد عربستان سعودی و رجب طیب اردوغان، رئیس‌جمهوری ترکیه، نظر آنها را درباره تحولات جنگ جویا شده است. هر دو رهبر از او خواسته‌اند حملات نظامی علیه ایران را از سر نگیرد.\n\nبه گفته منابع مطلع، ترامپ در این تماس‌ها تعهد مشخصی درباره تصمیم نهایی خود نداده است.\n\nرویترز گزارش داده است که ترامپ در تماس ۹ آبان به شاهزاده محمد بن سلمان گفته بود قصد دارد پس از انتخابات میان‌دوره‌ای آمریکا حمله به ایران را از سر بگیرد، اما ولیعهد سعودی از او خواسته بود از این اقدام خودداری کند. شاهزاده بن سلمان معتقد بوده که تحریم‌های اقتصادی علیه ایران در حال اثرگذاری هستند و ادامه فشار اقتصادی می‌تواند نتایج موردنظر واشنگتن را بدون بازگشت به جنگ گسترده تأمین کند.\n\nاردوغان نیز از ۶ آبان تاکنون سه بار با ترامپ گفت‌وگو کرده است. در بیانیه رسمی ریاست‌جمهوری ترکیه درباره تماس ۱۶ آبان بر ضرورت پایان یافتن تنش‌ها میان ایران و آمریکا تأکید شده بود.\n\nبا وجود احتمال خودداری ترامپ از آغاز حملات جدید، تحرکات نظامی آمریکا در منطقه متوقف نشده است.\n\nبه گزارش رویترز، ارتش آمریکا در روزهای آینده یک ناو هواپیمابر سوم را به خاورمیانه اعزام می‌کند. این ناو قرار است جایگزین یکی از دو ناو هواپیمابر حاضر در منطقه شود، اما منابع مطلع گفته‌اند در صورت نیاز ممکن است هر سه ناو به‌طور هم‌زمان در منطقه باقی بمانند.\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-14T13:00:14+00:00", "published_epoch": 1794661214, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/k1iBRkJQQgjnh8CcOsxQcfX1oFjM4TY3xmHOY4nhGPf6lVlsIB-RFMbJzyaCHYNMmzxQeuOEP4wgi6nKbylkBr0TgWwMassQJVW20xf_09gd7pxH3RnCDk_KUZoZbc0187_oF5RP96BLzhI6N2124zcO66QTF5cGgik8L4kOQ9qtvEFVEjzImv8i8TeqbiSj0Sr3qtd6Jr7WMCP3rwpRKksD7ubK4IqSgkbrwOIYRz7JPOsRZ4hWtdpEaBE1w_u4A_xcOAU2WDTqGDWCdGz2RVl-II6ZvzHfUxUnj-brS4cWW7EW453YiZtAFDd8qemKBIrnamB4lsEfYudxsRHG-w.jpg"], "local_media_path": null}, {"hash": "d0a4f968430b5522", "title": "محمدرضا عارف، معاون اول رئیس‌جمهوری، به مقام‌های دولتی دستور داد تا پیش از نهایی شدن تصمیم‌ها درباره بنزین و فرآورده‌های...", "link": "https://t.me/VahidOnline/79104", "summary": "محمدرضا عارف، معاون اول رئیس‌جمهوری، به مقام‌های دولتی دستور داد تا پیش از نهایی شدن تصمیم‌ها درباره بنزین و فرآورده‌های نفتی از اظهارنظر خودداری کنند و اعلام کرد مواضع رسمی دولت تنها باید از سوی سخنگوی دولت یا مدیرعامل شرکت ملی پالایش و پخش فرآورده‌های نفتی منتشر شود.\n\nاین دستور پس از چند روز اظهارات متفاوت مقام‌های دولتی درباره آینده کارت‌های سوخت، سهمیه‌ها و نحوه دسترسی مردم به بنزین صادر شده است.\n\nدولت پیش‌تر نیز در شهریور اعلام کرده بود فقط سخنگوی دولت و مدیرعامل شرکت ملی پالایش و پخش فرآورده‌های نفتی، اجازه دارند سیاست‌ها و تصمیم‌های رسمی درباره بنزین را اعلام کنند.\n\nبحث تازه پس از سخنان اسماعیل سقاب اصفهانی، معاون رئیس‌جمهوری و رئیس سازمان بهینه‌سازی و مدیریت راهبردی انرژی، بالا گرفت. او پنجشنبه گفت مردم دیگر نمی‌توانند مانند گذشته به کارت‌های سوخت جایگاه‌ها متکی باشند و برای سفر باید مصرف بنزین خود را از قبل برنامه‌ریزی کنند.\n\nسقاب اصفهانی تأیید کرد کارت‌های جایگاه در برخی استان‌ها جمع‌آوری شده و گفت دولت در شرایط فعلی با محدودیت واقعی تأمین سوخت روبه‌رو است.\n\nطرح محدود کردن کارت‌های اضطراری اکنون در ۱۱ استان اجرا می‌شود. همزمان، ۵۰ لیتر بنزین با نرخ سوم ۱۰ هزار تومان به کارت شخصی خودروهای مشمول اضافه شده است. سهمیه‌های اصلی فعلاً شامل ۶۰ لیتر بنزین ۱۵۰۰ تومانی و ۵۰ لیتر بنزین ۳۰۰۰ تومانی است.\n\nاین تغییر عملاً بخشی از دسترسی به بنزین آزاد از طریق کارت جایگاه را به کارت شخصی منتقل می‌کند و برای رانندگانی که بیش از سهمیه ماهانه مصرف می‌کنند، هزینه بالاتری ایجاد می‌کند.\n\nرسانه‌های داخل کشور نیز درباره مشکلات سفرهای پیش‌بینی‌نشده، خودروهای عبوری و افرادی که کارت شخصی در اختیار ندارند پرسش‌هایی مطرح کرده‌اند. روزنامه جام‌جم نوشت محدودیت کارت‌های جایگاه می‌تواند برنامه سفر شهروندان را مستقیماً تحت تأثیر قرار دهد.\n\nاین اقدامات در حالی ادامه دارد که عارف در مرداد گفته بود دولت قصد کاهش سهمیه اول را ندارد، اما سهمیه دوم باید به‌تدریج کاهش یابد، زیرا «راهبرد د       grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
