14", "summary": "اسکنر زنجیره‌ای کانفیگ برای Google AI Studio، Gemini و Antigravity \n https://github.com/MatinSenPai/Gemini-Config-Checker \n\n\" دقت کنید قبل از استفاده از این ابزار، طبق این آموزش حتما باید ریجن اکانتتون رو تغییر بدید: https://t.me/MatinSenPaii/2881 \"\n\nکانفیگ‌های رایگان زیاد هست، ولی کدومشون واقعا Gemini و AI Studio رو برای جیمیل خودت باز می‌کنه؟\nاین ابزار هر کانفیگ رو همون‌طوری تست می‌کنه که یه آدم استفاده می‌کنه: با حساب Google واقعی خودت، توی مرورگر خودت، از مسیری که واقعاً ازش وصل می‌شی. چون Google ریجن رو فقط برای حساب واردشده و بعد از لود شدن صفحه تعیین می‌کنه، تست‌های ساده‌ی «پینگ و API» همیشه همه‌چیز رو سالم نشون می‌دن و دروغ می‌گن.\n\n 🔹 دو حالت ساده و پیشرفته برای انواع شرایط\n• ساده: کانفیگ‌های خودت یا لیست کانفیگ‌های رایگان (لینک، ساب، base64) مستقیم و بدون زنجیره تست می‌شن\n• پیشرفته: کانفیگ‌های رایگان از پشت کانفیگ پایه‌ی خودت تست می‌شن (تو ← کانفیگ پایه ← کانفیگ رایگان ← Google)\n\n 🔹 تست واقعی ریجن\n• ورود با حساب Google کاملاً لوکال، با Chrome / Edge / Brave خودت؛ نشست فقط داخل حافظه‌ی برنامه می‌مونه، چیزی جایی ارسال نمی‌شه\n• AI Studio و Gemini جدا بررسی می‌شن و می‌تونی انتخاب کنی «سالم» یعنی کدوم‌ها\n• اول اتصال سنجیده می‌شه تا کانفیگ‌های مرده زود حذف بشن، بعد فقط بقیه به مرورگر می‌رسن\n\n 🔹 پروفایل ضد فیلتر\n• Finalmask (fragment)، Fingerprint، ALPN، Cipher suites و IP تمیز\n• مقدارها رو از خود کانفیگ یا لینک می‌خونه؛ کپی‌پیست کن و تمام\n\n 🔹 خروجی\n• «کپی با Chain»: کانفیگ کامل و مستقل، آماده‌ی PattN / v2rayN و Xray استاندارد\n• خروجی لینک، JSON، و ذخیره در فایل\n• انتخاب کانفیگ‌ها، مرتب‌سازی بر اساس تأخیر، و چک‌کردن دوباره\n\n 🔹 همه‌جا اجرا می‌شه\n• ویندوز، مک، لینوکس: اپ دسکتاپ و نسخه‌ی وب (برای سرور)\n• اندروید (APK): فقط تست اتصال؛ اندروید اجازه نمی‌ده برنامه مرورگر رو کنترل کنه، پس بررسی ریجن واقعی رو روی کامپیوتر انجام بده\n• رابط فارسی با تم تیره و روشن\n• متن‌باز، با موتور Xray-core داخل خود برنامه\n\n این پروژه، به لطف این پروژه‌ها و آدم‌ها ساخته شد (حتما اگر دوست داشتید استار بدید):\n\n • patterniha: PattN / PattNG و مقدارهای ضد فیلتر (Finalmask) \n • 0xRadikal/Free-v2ray-Configs: لیست‌های کانفیگ رایگان \n • bia-pain-bache/BPB-Worker-Panel \n\n 📥 دانلود و راهنمای کامل (فارسی و انگلیسی):\n https://github.com/MatinSenPai/Gemini-Config-Checker \n\n ✉️ t.me/MatinSenPaii", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-03T22:01:24+00:00", "published_epoch": 1791064884, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/HH5eWC0Amo0ykBy2OmfMIX3yWCfthSdgVOyLFFhvbrSLltLQg5tn2WRhJ5V3uCfIQh0_hSUlzmiKc04joIwZysbJrtc6KRG3zVP9UTnkXjsy1y3Fw6Csu7qurusKltAIZz2Qs9kIXLtJ1Qrfps_1GWquuEDe5sSxHv6ynU1mARF_m_XoMdn2lo3Kdp8WeNWdFLEK2BFtTVYS-OzmmxwVmVkQC3TUge4CasVdGbmgJa_W-au_PPx6pJt3xgbn8J4Pel2AWzM9rRPjCWicoTkbOmyWLfXygyl_ll4xFhP0A7OcpOQQR7CeHwC7prw_k8fFhJBmGdBKWlp8ciU8krnfDA.jpg"], "local_media_path": null}, {"hash": "b589145a59bf09c0", "title": "چه گنجینه‌هایی از دنیای باستان هنوز پیدا نشده‌اند؟", "link": "https://www.bbc.com/persian/articles/c9wxxd9jn7ko?at_medium=RSS&at_campaign=rss", "summary": "از نقاشی‌های گمشده غارها و ابزارهای چوبی که هزاران سال پیش پوسیده‌اند تا اجساد باتلاقی، روستاهای ناشناخته و ردپای بیماری‌هایی که تمدن‌های باستانی را دگرگون کرده‌اند؛ باستان‌شناسان معتقدند هنوز کشف‌های بزرگی در انتظارند. اگر این آثار روزی از دل خاک یا لایه‌های پنهان تاریخ بیرون آورده شوند، می‌توانند بسیاری از دانسته‌های ما درباره زندگی انسان‌های گذشته را به چالش بکشند و حتی تاریخ را از نو روایت کنن...", "source_id": "bbc_persian", "source_name": "BBC Persian", "source_name_fa": "بی‌بی‌سی فارسی", "category": "persian", "published_at": "2026-10-03T21:16:18+00:00", "published_epoch": 1791062178, "rtl": true, "raw_media_urls": ["https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/5b79/live/068bad40-f7af-11f0-9746-bbf190b04917.jpg"], "local_media_path": null}, {"hash": "edf787c47de89a38", "title": "Reasons I didn't become an EMT, ranked", "link": "https://ben.stolovitz.com/posts/reaso ن (تو ← کانفیگ پایه ← کانفیگ رایگان ← Google)\n\n 🔹 تست واقعی ریجن\n• ورود با حساب Google کاملاً لوکال، با Chrome / Edge / Brave خودت؛ نشست فقط داخل حافظه‌ی برنامه می‌مونه، چیزی جایی ارسال نمی‌شه\n• AI Studio و Gemini جدا بررسی می‌شن و می‌تونی انتخاب کنی «سالم» یعنی کدوم‌ها\n• اول اتصال سنجیده می‌شه تا کانفیگ‌های مرده زود حذف بشن، بعد فقط بقیه به مرورگر می‌رسن\n\n 🔹 پروفایل ضد فیلتر\n• Finalmask (fragment)، Fingerprint، ALPN، Cipher suites و IP تمیز\n• مقدارها رو از خود کانفیگ یا لینک می‌خونه؛ کپی‌پیست کن و تمام\n\n 🔹 خروجی\n• «کپی با Chain»: کانفیگ کامل و مستقل، آماده‌ی PattN / v2rayN و Xray استاندارد\n• خروجی لینک، JSON، و ذخیره در فایل\n• انتخاب کانفیگ‌ها، مرتب‌سازی بر اساس تأخیر، و چک‌کردن دوباره\n\n 🔹 همه‌جا اجرا می‌شه\n• ویندوز، مک، لینوکس: اپ دسکتاپ و نسخه‌ی وب (برای سرور)\n• اندروید (APK): فقط تست اتصال؛ اندروید اجازه نمی‌ده برنامه مرورگر رو کنترل کنه، پس بررسی ریجن واقعی رو روی کامپیوتر انجام بده\n• رابط فارسی با تم تیره و روشن\n• متن‌باز، با موتور Xray-core داخل خود برنامه\n\n این پروژه، به لطف این پروژه‌ها و آدم‌ها ساخته شد (حتما اگر دوست داشتید استار بدید):\n\n • patterniha: PattN / PattNG و مقدارهای ضد فیلتر (Finalmask) \n • 0xRadikal/Free-v2ray-Configs: لیست‌های کانفیگ رایگان \n • bia-pain-bache/BPB-Worker-Panel \n\n 📥 دانلود و راهنمای کامل (فارسی و انگلیسی):\n https://github.com/MatinSenPai/Gemini-Config-Checker \n\n ✉️ t.me/MatinSenPaii", "source_id": "tg_MatinSenPaii", "source_name": "@MatinSenPaii", "source_name_fa": "@MatinSenPaii (متین سنپای (شبکه و فیلترشکن))", "category": "telegram", "published_at": "2026-10-03T19:25:08+00:00", "published_epoch": 1791055508, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/Cfp2UmGrBrEzae8qNAviwDQ0w_1UJepJS6eF25N4vsArGogeAv1301aYInj53SgXaenyP4wulXp6JJkls-ZSshDW3CVcRV3fIQzazv4Sv0Qdvn52yk60hhz9KREB392_net4eVIX6zuyS5kaFqAuhVOfwOExI83OMYdHbnXbC-UMfQFVYj8SJv4j2jPcYZ3zi0UxJ5RnkYKwBHrDzEK2AAJelbE4xyTXq_vzpLfexY-SIDWQntWVFPtOF1gIqQUZGo0czpY5w-v0d6H_tI28xp0W9RjYtEi0p2Vl77--Q5W5TO5b8RQJUnTKNi_vwLsQUXCVS4ACVzf     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
