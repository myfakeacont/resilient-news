 باشند. با این...", "link": "https://t.me/IranintlTV/363762", "summary": "احزاب عرب اسرائیل با وجود اختلاف‌نظرهای سیاسی، ممکن است در تعیین سرنوشت دولت آینده این کشور نقش مهمی داشته باشند. با این حال، بنیامین نتانیاهو و رقیبان اصلی او تاکنون ائتلاف با این احزاب را رد کرده‌اند.\n\nدر سال ۲۰۲۱، حزب رعام به رهبری منصور عباس در ائتلافی مشارکت کرد که به ۱۲ سال نخست‌وزیری پیاپی نتانیاهو پایان داد. اما در آستانه انتخابات پیش رو، تکرار چنین ائتلافی با مخالفت سیاستمداران اصلی روبه‌رو شده است.\n\nاگر هیچ‌یک از بلوک‌های سیاسی نتواند اکثریت ۶۱ کرسی کنست را به دست آورد، نمایندگان عرب چه نقشی در تشکیل دولت آینده خواهند داشت؟\n @iranintltv", "source_id": "tg_IranintlTV", "source_name": "@IranintlTV", "source_name_fa": "@IranintlTV (ایران اینترنشنال (تلگرام))", "category": "telegram", "published_at": "2026-10-24T22:43:10+00:00", "published_epoch": 1792881790, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/EMoaFYRrBeRkPyNunmr5fzUw38Iwe5NJeSlqvsg3Oj4d84HQo6jBwkbDGMWp49x19ZttY0KHJ2uaVdwW0SpLZPELRJ8j9MBozrgA5z4Nhu9ddqtFoUkiGLUkLFb-a1OfZS8LCcMOBaIBcN_IGERyozapisZOg8W0jA-riuPyGI9J0NwMzN2fUdiieetT507TeEsWYtW3Hz5QKYBi2n_UriudZrq0QbSePslNrHEj6Ai87GP42ObCHOU0N5g-dn5um_vdTX-oU09VeIm99-9IAtUvK6rnQPLlBKBVtTh0MgGaCkn26KESnXashRkf5bBKIAKmFgkRJvx4atu2Cagb3A"], "local_media_path": null}, {"hash": "f5f6df00612faf1e", "title": "دونالد ترامپ، رییس‌جمهوری آمریکا، بار دیگر از احتمال حمله نظامی به جمهوری اسلامی یا دستیابی به توافق با تهران سخن گفت و ...", "link": "https://t.me/VahidOnline/78831", "summary": "دونالد ترامپ، رییس‌جمهوری آمریکا، بار دیگر از احتمال حمله نظامی به جمهوری اسلامی یا دستیابی به توافق با تهران سخن گفت و تاکید کرد هدف واشینگتن این است که مانع دستیابی ایران به سلاح هسته‌ای برای همیشه شود.\n\nترامپ روز شنبه دوم آبان در جمع خبرنگاران در فلوریدا، در پاسخ به پرسشی درباره میزان پیشرفت برنامه‌ریزی برای حمله احتمالی به ایران گفت: «داریم به انجامش فکر می‌کنیم، شاید فردا.» او بلافاصله افزود: «واقعا فکر می‌کنید به شما می‌گویم که قرار است این کار را بکنم یا نه؟»\n\nرییس‌جمهوری آمریکا بدون اعلام زمان مشخصی برای اقدام نظامی گفت: «این احتمال وجود دارد که انجامش بدهم. این احتمال هم هست که به یک توافق خوب، بزرگ و زیبا برسیم.»\n\nترامپ گفت مقام‌های جمهوری اسلامی خواهان توافق هستند، اما درباره پایبندی تهران به هر توافق احتمالی ابراز تردید کرد و گفت: «مشکل این است: آیا به توافق پایبند می‌مانند؟»\n\n او با اشاره به عملیات بمب‌افکن‌های بی‌۲ علیه ایران گفت می‌توانست یک سال پیش این عملیات را انجام دهد و به اقدام نظامی پایان دهد، اما به گفته او، جمهوری اسلامی ممکن بود ظرف یک تا دو سال راهی برای ساخت بمب هسته‌ای پیدا کند.\n\nترامپ تاکید کرد: «باید کاری کنم که این مساله برای همیشه حل شود. تنها دلیل اینکه این کار را این‌قدر ادامه داده‌ام، همین است.»\n\nاو درباره گزینه‌های پیش روی دولت آمریکا گفت: «سوال این است: کار را تمام کنیم، که دشوار هم نخواهد بود، یا با آنها توافق کنیم؟ و این به خودشان بستگی دارد.»\n\nرییس‌جمهوری آمریکا در بخش دیگری از سخنانش بار دیگر مدعی شد که تمامی جنگنده‌ها و کشتی‌های ایران در جریان عملیات نظامی آمریکا از بین رفته‌اند. او شمار کشتی‌های منهدم‌شده را ۲۵۹ فروند اعلام کرد و گفت همه آنها «در قعر دریا» هستند.\n\nترامپ همچنین مدعی شد سامانه‌های راداری ایران نابود شده‌اند و از عملکرد نیروی دریایی آمریکا تمجید کرد.\n\nاو با اشاره به وضعیت اقتصادی ایران گفت که صبح همان روز گزارشی درباره رسیدن تورم ایران به ۳۰۱ درصد خوانده است. ترامپ همچنین ادعا کرد که اکنون نفت بیشتری نسبت به پیش از آغاز جنگ از تنگه هرمز عبور می‌کند.\n\nترامپ در واکنش به پرسشی درباره گزارش‌های اطلاعاتی مربوط به افزایش تلاش‌های جمهوری اسلامی برای هدف قرار دادن نیروها و کارکنان آمریکایی در خاورمیانه، مقام‌های جمهوری اسلامی را «آدم‌های بد» با «رهبری بسیار بد» توصیف کرد.\n\nاو مدعی شد مقام‌های جمهوری اسلامی ۷۵ هزار معترض را کشته‌اند و خطاب به خبرنگاران گفت: «شما هیچ‌وقت درباره‌اش نمی‌نویسید.» ترامپ همچنین جمهوری اسلامی را به کشتن شمار زیادی از شهروندان آمریکایی متهم کرد.\n\nرییس‌جمهوری آمریکا در ادامه جمهوری اسلامی را «بزرگ‌ترین حامی دولتی تروریسم» خواند و با انتقاد از روسای‌جمهوری پیشین آمریکا گفت آنها باید زودتر اقدام مشابهی انجام می‌دادند، زیرا به گفته او، در آن زمان این کار               <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
