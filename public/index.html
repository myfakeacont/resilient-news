": "https://t.me/whitedns/2271", "summary": "🚀 WhiteAesther 1.16.0\n\nاین نسخه اتصال را روی شبکه‌های سخت‌گیرتر قابل‌اعتمادتر می‌کند و دو امکان تازه دارد: حالت «فقط IPv6» و وارد کردن فهرست قوانین مسیریابی از فایل.\n\n ✨ تازه‌ها\n• ثبت حساب WARP روی شبکه‌هایی که مسیرهای معمول را می‌بندند، یک مسیر جایگزین تازه دارد. روی شبکهٔ عادی هیچ تغییری حس نمی‌کنید.\n• گزینهٔ «فقط IPv6» در بخش «آدرس‌ها»، برای شبکه‌هایی که مسیر IPv6 تمیزتری دارند.\n• وارد کردن فهرست قوانین آماده از یک فایل روی گوشی، برای «هرگز وصل نشو» یا «بدون تونل».\n• جعبهٔ «این مقصد با کدام قانون می‌خورد؟» که روی خود گوشی می‌گوید یک سایت از تونل می‌رود، مستقیم می‌رود یا مسدود می‌شود.\n• پورت محلی ورکر حالا رمز تصادفی دارد و برنامه‌های دیگر گوشی نمی‌توانند از آن استفاده کنند.\n• اگر روش اتصالتان Psiphon، Tor، ورکر یا پروفایل پروکسی باشد، صفحهٔ ابزارها می‌گوید کدام تنظیمات مال موتور اتر است و الان اثری ندارد.\n• ورکر نام هاست خودش را اول از DNS رمزشده می‌پرسد و با یک IP تمیز شروع می‌کند، پس اپراتوری که نام ورکر را جواب نمی‌دهد دیگر اتصال را نگه نمی‌دارد.\n• پیام گزینهٔ «بدون مبهم‌سازی» روشن‌تر شد: روی شبکهٔ فیلترشده بیشترین احتمال را دارد که اتصال را از کار بیندازد.\n\n 📖 آموزش کوتاه\n\nحالت فقط IPv6\n۱. ابزارها ← آدرس‌ها ← «فقط IPv6».\n۲. اگر زیر گزینه نوشت «این شبکه IPv6 ندارد»، روی همین شبکه کار نمی‌کند؛ «IPv4 + IPv6» را بگذارید.\nاین گزینه فقط تعیین می‌کند موتور با کدام آدرس‌های کلادفلر وصل شود. برنامه‌های داخل تونل همچنان هر دو نوع آدرس را دارند.\n\nوارد کردن فهرست قوانین\n۱. ابزارها ← قوانین مسیریابی.\n۲. «وارد کردن فهرست هرگز وصل نشو» یا «وارد کردن فهرست بدون تونل» را بزنید و فایل را انتخاب کنید.\n۳. برنامه می‌گوید چند قانون اضافه شد و چه چیزی به چه دلیل کنار رفت.\n۴. هر فهرست را می‌توانید جدا روشن، خاموش یا حذف کنید.\nفرمت‌های پشتیبانی‌شده: نام دامنه، فایل hosts، آدرس IP و CIDR، و فهرست قوانین Clash.\n\n 💡 نکته‌ها\n• قوانین geosite و geoip (به‌جز private) فعلاً پشتیبانی نمی‌شوند و در گزارش ورود شمرده می‌شوند.\n• هر چه در فهرست «بدون تونل» باشد با آدرس واقعی گوشی شما می‌رود. فقط فهرستی را وارد کنید که به م     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
