 گفت امیدوار است این کار را بکنند، چون در آن صورت همه‌شان به قعر دریا خواهند رفت؛ مثل بقیه نیروی دریایی ایران. البته اگر این شناورها تلاش کنند از محاصره دریایی آمریکا عبور کنند. \n\nاین همان روشی است که ایرانی‌ها اکنون در پیش گرفته‌اند. دارند امتحان می‌کنند که با این تهاجم علیه کشورهای خلیج فارس تا کجا می‌توانند پیش بروند.\nدیشب هم شاهد حملاتی به نیروهای آمریکایی در بحرین بودیم.\n\n....\n بر اساس گفت‌وگویی که همین حالا با رئیس‌جمهور داشتم، هیچ نشانه‌ای دیده نمی‌شود که ایرانی‌ها در این مقطع حاضر به توافق باشند. \n\nو باز هم همان رفت‌وبرگشت‌هایی است که پیش‌تر شاهدشان بوده‌ایم.\n\nاین چرخه‌ای عجیب است که تمام دنیا نظاره‌گر آن است؛ چون بعضی روزها تیتر خبرها این است که ایرانی‌ها آماده توافق‌اند و می‌خواهند برای نوعی راه‌حلِ مورد مذاکره برای این درگیری گفت‌وگو کنند.\n\nاما وال‌استریت ژورنال گزارش داده هنوز حدود ۱۵۰۰ موشک بالستیک در زرادخانه‌شان دارند و همچنان می‌توانند هر ماه حدود ۵۰ موشک دیگر تولید کنند.\nبنابراین پرسش‌هایی مطرح می‌شود درباره تهدید موشک‌های بالستیک که هنوز برقرار است، آنچه از برنامه هسته‌ای این کشور باقی مانده، و اینکه این درگیری واقعاً چگونه می‌تواند پایان یابد.\n\nحالا نکته جالب دیگری هم در این میان وجود دارد: ما دوباره شاهد شکل‌گیری اعتراض‌ها در داخل ایران هستیم.\nامروز هم در ایران اعلام شد که قطعی‌های نوبتی برق در کشور اجرا خواهد شد.\n\n از رئیس‌جمهور پرسیدم آیا از این اعتراض‌ها خبر دارد.\nگفت بعضی از ویدیوها را دیده و از معترضان در ایران خواسته به اعتراض ادامه دهند.\nاین سخنان بسیار شبیه چیزی است که تقریباً همین موقع در سال گذشته در ایران شنیدیم؛ زمانی که معترضان به خیابان‌های کشور آمده بودند و با گلوله جنگی روبه‌رو شدند. \n\nپس بار دیگر، رئیس‌جمهور ترامپ به فاکس نیوز گفته تمایل دارد عملیات رزمی گسترده علیه ایران را پس از سال نو از سر بگیرد.\nهنوز دقیقاً نمی‌دانیم این عملیات چه شکلی خواهد داشت، اما از آرایش کنونی نیروهای نظامی آمریکا در منطقه اطلاع داریم.\nدو گروه رزمی ناو هواپیمابر در حال فعالیت در دریای عرب هستند.\nهمچنین هواپیماهای سوخت‌رسان آمریکا اینجا در اسرائیل مستقرند و باز هم ایرانی‌ها دارند آزمایش می‌کنند که با حملاتشان در نزدیکی تنگه هرمز     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
