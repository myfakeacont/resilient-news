رونده را ندارد.»\n\nاو همچنین گفت: «ظاهرا سوگند برای بازگشت به شهرستان تحت فشار بوده است اما اینکه پس از بازگشت به خانه چه اتفاقاتی رخ داده، هنوز مشخص نیست. برای روشن شدن ابعاد ماجرا باید با پدر و نامادری این دانش‌آموز گفت‌وگو شود و تمام این موارد در دست بررسی است.»\n\nدر همین حال، در یک فایل صوتی که رکنا منتشر کرده، فردی که گفته می‌شود از دوستان سوگند است، می‌گوید او پیش از رفتن به خانه گفته بود: «اگر به خانه بروم، پدرم من را می‌کشد.»\n\nبه گزارش رکنا، «بر اساس اطلاعات دریافتی از منابع محلی، روز ۲۳ آبان‌ماه، از مدرسه موضوعی را با عنوان علت ارتباط شخصی به پدر سوگند اطلاع می‌دهند. گفته می‌شود پس از این اتفاق، پدر سوگند حدود ساعت ۸:۴۵ صبح به مدرسه مراجعه کرده و دخترش را با خود به خانه می‌برد.»\n\nگزارش رکنا می‌گوید: «پس از ورود به خانه میان پدر و دختر درگیری رخ می‌دهد و حدود ساعت ۹ صبح، پدر سوگند او را از پنجره طبقه پنجم ساختمان به پایین پرتاب می‌کند. این دختر نوجوان در پی این حادثه جان خود را از دست می‌دهد.»\n\nسازمان حقوق بشری هه‌نگاو هم این خبر را به نقل از منابع خودش منتشر کرده و نوشته است که سوگند صیادی «اهل روستای علیرضاوندی از توابع گیلانغرب و ساکن محله کیانشهر کرمانشاه» از «طبقه پنجم ساختمان مسکونی به پایین پرتاب شده و جان خود را از دست داده است.»\n\nپلیس کرمانشاه هنوز اظهار نظری نکرده است.\n@ VahidHeadline \nسوگند صیادی، دانش‌آموز ۱۶ ساله اهل گیلانغرب و ساکن کرمانشاه، یک‌شنبه ۲۴ آبان به دست پدرش کشته شد.\nسازمان حقوق بشری هه‌نگاو علت این قتل را مخالفت پدر با ارتباط سوگند با خواستگارش گزارش کرده، اما \nدر شبکه‌های اجتماعی روایت شده است که ماجرا پس از اطلاع مدرسه از ارتباط این نوجوان با دختر دیگری آغاز شد.\nبه گزارش هه‌نگاو، مدیریت دبیرستان دخترانه رضوان کرمانشاه یک روز پیش از قتل، پدر سوگند را به مدرسه فراخواند و او دخترش را در حضور همکلاسی‌ها و مسوولان مدرسه به‌شدت کتک زد.\nبر اساس این گزارش، سوگند به مسوولان مدرسه هشدار داده بود که پدرش او را خواهد کشت، اما بدون انجام اقدامات حمایتی، همراه پدرش به خانه بازگردانده شد.\nهه‌نگاو گزارش داد که کیومرث صیادی، پدر سوگند، پس از ادامه ضرب‌وشتم در خانه، او را از طبقه پنجم ساختمان به پایین پرتاب کرد. پیکر این نوجوان صبح یک‌شنبه در حیاط ساختمان پیدا شد.\nسوگند با پدر و نامادری خود زندگی می‌کرد و به گفته هه‌نگاو، پدرش طی سال‌های گذشته مانع ارتباط او با مادرش شده بود.\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-16T18:10:56+00:00", "published_epoch": 1794852656, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/Hg3Bo1RIT3XsaAS364f0ZaI6GyiHDcqpyNN7prxFugU1JewbJj3grw9H-0QykChQu1JCJXMgW0YzpazelBT55L87NZsf8rimAdo6R3WdwwnwEVImmVzlb1hn6NQFBP6P1z5G86rP0ZHijJP1SWe1gXEKcNrGGbrMGIc2en7BSumg7hmcjGIb_cToT2fgxHop1meTUz31kV5BQLm8K0nTr9uVJN4_YRH8uPctrk9LPlTg82kuUxY6x0x4pDBZ4SHpYOS_apj5aBPLXIavFMlUra18WDAnghbLdDOASz74PMyq7gRI9VxPTgOc64yDkM0EqYZ0p5IvJEyUOYq1gOleIA.jpg"], "local_media_path": "media/2026-11-16/6e26af9640d679db.jpg"}, {"hash": "62104f3561091b43", "title": "انتشار تیزر تبلیغاتی برنامه «صحنه» واکنش‌های زیادی را برانگیخته و انتقادهای بسیاری از آن کرده‌اند.", "link": "https://t.me/VahidOnline/79129", "summary": "انتشار تیزر تبلیغاتی برنامه «صحنه» واکنش‌های زیادی را برانگیخته و انتقادهای بسیاری از آن کرده‌اند. \nدر تیزر تبلیغاتی این برنامه حاضران یکی از آهنگ‌های ابی، خواننده معروف ایرانی را همخوانی می‌کنند.\n\nخبرگزاری تسنیم در یک گزارش با تیتر «عادی‌سازی همخوانی با لس‌آنجلسی‌ها» از این همخوانی انتقاد کرده است و با اشاره به مواضع سیاسی ابی، انتخاب ترانه‌ای از او را برای یک برنامه پرمخاطب، موردی دانسته که «نمی‌توان از کنار آن ساده گذشت.»\n\nمخالفان جمهوری اسلامی هم به این برنامه واکنش‌های مختلفی نشان داده‌اند و در شبکه اجتماعی ایکس نقطه نظرات مختلفی را مطرح کرده‌اند.\nاز «عادی‌سازی» زندگی سرشار از مشکلات مردم گرفته تا «سفیدشویی» کشتار معترضان در دی‌‌ماه ۱۴۰۴ توسط حکومت ایران.\nگروهی از مخالفان حکومت ایران می‌گویند جمهوری اسلامی با تهیه برنامه‌های نظیر صحنه «آخرین دست و پاهای خود را می‌زند»\n@ VahidHeadline \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلای     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
