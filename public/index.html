itedns/1917", "summary": "📌 اگر WARP محدود شد، چطور از WhiteAesther استفاده کنیم؟ ⚠️ \n\nطبق گزارش‌های دریافتی، ارتباط UDP با IPهای کلودفلر روی همراه اول محدود شده است. احتمال گسترش این محدودیت به اپراتورهای دیگر وجود دارد، اما هنوز نمی‌توان آن را قطعی دانست.\nاین محدودیت می‌تواند اتصال WireGuard و MASQUE H3 را مختل کند؛ با این حال، WhiteAesther مسیرهای دیگری هم دارد.\n\n ۱️⃣ ابتدا حالت خودکار را امتحان کنید \nدر تنظیمات برنامه:\n 🔹 Traffic → Coverage: گزینهٔ «کل دستگاه»\n 🔹 Routes → Carrier: گزینهٔ «خودکار»\nدر نسخه‌های دارای این قابلیت، برنامه مسیرهای Aether، Psiphon و Tor را بررسی می‌کند. \n\n ⚠️ اولین اتصال روی شبکهٔ محدود ممکن است چند دقیقه( تا پنج دقیقه ) زمان ببرد. ⚠️ \n\n ۲️⃣ برای اتصال مستقیم، MASQUE H2 را امتحان کنید \nاز مسیر زیر پروتکل را تغییر دهید:\n 🔹 Routes → Advanced → Preferred transport → MASQUE H2 \nH2 روی TCP کار می‌کند؛ بنابراین بسته‌شدن UDP به‌تنهایی آن را از کار نمی‌اندازد. البته اگر مسیر TCP هم فیلتر باشد، اتصال برقرار نمی‌شود.\n\n ۳️⃣ امکان استفاده از IPv6 را حفظ کنید \n 🔹 Traffic → Addresses → IPv4 + IPv6 \nاگر IPv6 روی اینترنت شما قابل‌دسترسی باشد، ممکن است مسیر اتصال باقی مانده باشد. انتخاب این گزینه داخل برنامه، به‌تنهایی روی خط فاقد IPv6 دسترسی ایجاد نمی‌کند.\n\n ۴️⃣ تکه‌تکه‌کردن دست‌دهی TLS را امتحان کنید \n 🔹 Traffic → Advanced → Split the TLS handshake → روشن \nاین گزینه ممکن است در برابر بعضی روش‌های فیلترینگ کمک کند، اما مسدودشدن کامل IP یا TCP را برطرف نمی‌کند.\n\n ۵️⃣ اگر اتصال مستقیم جواب نداد، حامل را تغییر دهید \nدر Routes → Carrier حالت دستی را انتخاب کرده و Psiphon را امتحان کنید. گزینهٔ دیگر، Tor با پل خصوصی obfs4 است؛ معمولاً کندتر است و ترافیک UDP را حمل نمی‌کند.\nنام و محل گزینه‌ها ممکن است در نسخه‌های مختلف متفاوت باشد.\n ⚠️ هیچ‌کدام از این روش‌ها اتصال را تضمین نمی‌کند. بسته‌شدن WARP لزوماً به معنی ازکارافتادن کل WhiteAesther نیست؛ نتیجه به مسیرهای باز روی اینترنت شما بستگی دارد.\n\nتشکر ویژه از @patt_channel_x \n\n @whitedns", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
