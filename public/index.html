 کنست را برای نخست‌وزیری به دست آورد، در حالی که ۴۶ نماینده از نتانیاهو حمایت کرده بودند.\n\nآیزنکوت پس از دریافت رسمی ماموریت، ۲۸ روز برای تشکیل دولت فرصت خواهد داشت. در صورتی که نتواند در این مدت دولت را تشکیل دهد، می‌تواند از هرتزوگ درخواست کند حداکثر ۱۴ روز دیگر به این مهلت اضافه کند.\n\nهم‌زمان با این تحولات، نتانیاهو از احزاب بلوک موسوم به «تغییر» خواسته است با احزاب ائتلاف کنونی او برای تشکیل یک دولت وحدت ملی همکاری کنند.\n\nنتانیاهو در اظهاراتی با هشدار درباره تشکیل دولت با مشارکت احزاب عرب، آن‌ها را «حامی تروریسم» خواند و گفت چنین دولتی کشور را نابود خواهد کرد.\n@ VahidHeadline \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-07T20:08:51+00:00", "published_epoch": 1794082131, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/FRLPd8QIpyxrj0ktfG7KrGwutTdbWUP_zDpbTILtYjO-KmaThNJfdKoi9JHza_t9NjHMEGm5yCHzQxtyZqKvJStgDDAb4ZcAtww6RRZWmG-lgzNyGkeh-bMEGVKNI6pUT8RP0AFDiJ1q-NP1ssWyTrYusmK0YFadRHIOXWKqCii0nFse7suxmP2P0-u33opkrUQSl3nlf54t34Ww76G0kWV9EDt4GM5woGjI01amx_AvWS5DzbMhKHrtxp6y2M0VIkn6vprBgiTqc3frPBi1BrOX4hVq29dxVSUbKlIy6eO_jVsJ5NoHUNCGkIefVvlWCXMbTDEFQtPYqZrkkWmSdQ.jpg"], "local_media_path": "media/2026-11-07/9a14d4c114f41024.jpg"}, {"hash": "3ab7bbe09813fc6a", "title": "امیرحسین زارع، بهترین آزادکار مسابقات جهانی ۲۰۲۶", "link": "https://www.iranintl.com/202611077120", "summary": "اتحادیه جهانی کشتی، عملکرد امیرحسین زارع در مسابقات قهرمانی جهان ۲۰۲۶ در آستانه را برترین عملکرد کشتی آزاد این رقابت‌ها معرفی کرد: «زارع در وزن ۱۲۵ کیلوگرم با چهار پیروزی و کسب ۴۲ امتیاز، بدون واگذاری حتی یک امتیاز، چهارمین طلای جهانی خود را به دست آورد.»", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-11-07T19:59:10+00:00", "published_epoch": 1794081550, "rtl": true, "raw_media_urls": ["https://i.iranintl.com/images/rdk9umy0/production/a917cc7a     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
