که مطرح شدن این اطلاعات در مقطع کنونی ظاهرا با انگیزه‌های سیاسی همراه است.\n\nبر اساس این گزارش، کاخ سفید از پنتاگون و جامعه اطلاعاتی آمریکا خواسته است واکنش احتمالی ایران به سناریوهای مختلف حمله نظامی، از جمله حمله به نیروگاه‌ها یا تاسیسات هسته‌ای، را ارزیابی کنند.\nکانال ۱۲ اسرائیل گزارش داد که حمله احتمالی آمریکا ممکن است با مشارکت اسرائیل انجام شود و اهداف آن می‌تواند تاسیسات هسته‌ای مستحکم، پل‌ها، نیروگاه‌ها و فرماندهان نظامی ایران باشد.\n\nبه گفته راوید، موضوع ایران قرار است در روزهای آینده بار دیگر در دستور کار ترامپ قرار گیرد و تصمیم او ممکن است پیش یا پس از اول ژانویه گرفته شود.\nخبرنگار کانال ۱۲ اسرائیل به نقل از دو منبع آگاه گزارش داد که رومن گوفمن، رییس موساد، هفته گذشته به آمریکا سفر کرد و با جان رتکلیف، رییس سازمان اطلاعات مرکزی آمریکا، و استیو ویتکاف، فرستاده کاخ سفید، دیدار کرد.\n\nبه گفته مقام‌های آمریکایی، گوفمن در این دیدارها اطلاعاتی درباره فعالیت‌های هسته‌ای ایران و ادعاهایی درباره توسعه سلاح‌های شیمیایی، از جمله انجام آزمایش‌هایی در این زمینه، ارائه کرد.\n\nیک منبع آگاه به راوید گفت که گوفمن هشدار داده است در صورت به تعویق افتادن اقدام نظامی، آمریکا و اسرائیل ممکن است در آینده ناچار شوند در شرایط دشوارتری دست به اقدام بزنند.\n\nیک مقام آمریکایی نیز اعلام کرد که ترامپ در جریان اطلاعات ارائه‌شده از سوی دستگاه‌های اطلاعاتی اسرائیل قرار گرفته است.\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-19T18:16:56+00:00", "published_epoch": 1795112216, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/hE5yvWSFDE-GeRLOWAZBmLlmD123KOD0Rm4OKt7tH9vRB8vowOMAMVw8AktgXVaCvVx27jT0ORJROHwevb1jBAcJEgUIYEPjbOQSGvvcExzc2T9cEwEbKQR3-7aKdCN8WosVIoEMmbVzzj0xPHcGssr0MvO2jzvHRqTuSGgTlimlJ3IfogRHqLczZyL0mYvYXeh_TknXj9PXP3a5rUK2j1gZf-CTSEZQYUobcT7nRwxx6CTtTGFUyu5zXrcaCIxvOzQ2ZpnkHLFG1qK73sJA1_XEdGg6_xYF5inlFLpIHvdYY_feh3gOQslpYnfWEdQ6XFJrAymwGk5O06LseQN2Rw.jpg"], "local_media_path": null}, {"hash": "d52ae57c7535ac07"     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
