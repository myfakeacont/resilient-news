 رد کرده است، و افزود احتمال تشدید حملات نظامی آمریکا علیه جمهوری اسلامی را منتفی نمی‌داند. این مصاحبه ۶ مهر در کاخ سفید انجام و روز پنجشنبه ۹ مهر منتشر شد.\n\nدونالد ترامپ در پاسخ به این پرسش که چرا درگیری نظامی با جمهوری اسلامی بر خلاف برآورد اولیه او وارد هفتمین ماه شده است، گفت پس از حمله بمب‌افکن‌های بی-۲ به تاسیسات هسته‌ای می‌توانست عملیات را متوقف کند، اما تصمیم گرفت «فراتر» برود تا حکومت ایران نتواند توانایی‌های خود را «به شکلی متفاوت» بازسازی کند.\nاو گفت: «توانایی هسته‌ای آنها را نابود کرده‌ام. نیروی دریایی‌شان را نابود کرده‌ام؛ ۱۵۹ کشتی در کف دریا هستند. نیروی هوایی‌شان را نابود کرده‌ام. همه هواپیماهایشان از بین رفته‌اند. رادارشان را نابود کرده‌ام.» رئیس جمهوری آمریکا همچنین گفت اقتصاد جمهوری اسلامی از بین رفته و تورم آن حدود ۳۰۰ درصد است.\n\nترامپ گفت آمریکا عملا کنترل تنگه هرمز را از جمهوری اسلامی گرفته است، و تاکید کرد شب پیش از مصاحبه حجم عبور نفت از این آبراه به بالاترین میزان تاریخی رسیده بود. داده‌های جدید نشان می‌دهد صادرات نفت خلیج فارس در روزهای اخیر به‌ شدت بهبود یافته و به سطوح متوسط سال ۲۰۲۵ بازگشته است.\n\nدر بخش دیگری از مصاحبه، خبرنگار تایم به اظهارات اخیر ترامپ درباره احتمال «نابودی ایران» اشاره کرد و پرسید آیا چنین اقدامی واقعا ممکن است. او پاسخ داد: «بله، این کار را خواهم کرد. ممکن است.»\n\nهنگامی که خبرنگار درباره مردم غیرنظامی ایران پرسید، رئیس جمهوری به سرکوب اعتراضات اشاره کرد و گفت حکومت ایران طی ماه‌های اخیر بین ۷۲ هزار تا ۷۵ هزار نفر را کشته است.\nترامپ همچنین گفت از تصمیم خود برای مداخله نکردن مستقیم در جریان اعتراضات دی‌ماه پشیمان نیست، و عملکرد دولتش در قبال جمهوری اسلامی را «باورنکردنی» توصیف کرد.\n\nاو گفت ایران کشوری بسیار بزرگ‌تر و دورتر از ونزوئلا است، اما «نتیجه همان خواهد بود» و افزود: «آنها می‌خواهند توافق کنند.»\n\nدر پاسخ به پرسشی درباره علت رد پیشنهاد اخیر جمهوری اسلامی برای آتش‌بس، ترامپ گفت رژیم ایران پیشنهاد بازگشایی تنگه هرمز را مطرح کرد، اما شرایط آن «حتی نزدیک به کافی هم نبود.»\n\nرویترز گزارش داده است پیشنهاد ارائه‌شده از طریق میانجی‌های قطری شامل پایان درگیری‌ها و بازگشایی تنگه هرمز در برابر رفع برخی فشارهای اقتصادی آمریکا و دسترسی رژیم ایران به دارایی‌های مسدودشده بود. مذاکرات غیرمستقیم همچنان ادامه دارد.\n\nخبرنگار تایم سپس پرسید آیا دولت آمریکا پس از انتخابات میان‌دوره‌ای حملات به جمهوری اسلامی را افزایش خواهد داد. ترامپ پاسخ داد: «ممکن است.»\n او از ارائه جزئیات خودداری کرد، اما گفت آمریکا طی شش ماه گذشته ذخایر تسلیحاتی خود را افزایش داده و شرکت‌های دفاعی با فعالیت شبانه‌روزی در حال گسترش تولید هستند.\n\nرئیس جمهوری آمریکا در پایان مصاحبه هدف اصلی سیاست خود در قبال جمهوری اسلامی را جلوگیری از دستیابی آن به سلاح هسته‌ای دانست و گفت: «موضوع اصلی که همیشه مطرح می‌کنم این است که ایران نمی‌تواند یک قدرت هسته‌ای باشد.»\n@ VahidHeadline \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-01T14:23:32+00:00", "published_epoch": 1790864612, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/llz3JOxKP-5wl9UMk7YIHtZcaGex1NDusu19Fn6djEnjyfSihmdU4b4ywqDSqFSrz64Dy6tQRmRzU0-NKg2p8OvIEJJTe2hYNQayc8c2qW01G4WrPdZ9IZhVw2M21PQcvnav6LhsoM3fQvr9GjlDYuAPhb4ifoylPh-MjlFts9drpBgwN9BZJzjd89LqJiTMnJcSpUAlvdzWnDinPSqPWFhN0x0ng_l0V1SY0RQfJbChPIZBJWUWvkJDLLP2HW0CchXopr3MPokx3cZtsQHqAr-g5d8owLUWC4ai5MHDmPtMcmAgsFIaBCv0HzMfbdw-pvnkVEe-LAbssJJNU8hMGw.jpg"], "local_media_path": "media/2026-10-01/c0b44336f2fc2630.jpg"}, {"hash": "6dfd197c5122ad89", "title": "ائتلافی علیه نادیده‌ماندن: پرادو و ریکسمیوزیم برای زنان در هنر هم‌پیمان شده‌اند", "link": "https://parsi.euronews.com/2026/10/01/an-alliance-against-invisibility-the-prado-and-the-rijksmuseum-join-forces-for-women-in-ar", "summary": "موزه پرادو و موزه ریکسموزیوم آمستردام در یک اتحاد راهبردی می‌کوشند نقش زنان در تاریخ را بررسی و میراث مشترک اسپانیا و هلند را بازنگری کنند.", "source_id": "euronews_persian", "source_name": "Euronews Persian", "source_name_fa": "یورونیوز فارسی", "category": "persian", "published_at": "2026-10-01T14:23:23+00:00", "published_epoch": 1790864603, "rtl": true, "raw_media_urls": [], "l d_epoch": 1790850096, "rtl": false, "raw_media_urls": [], "local_media_path": null}];
    let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
