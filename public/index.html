 بعد از امضای تفاهم‌نامه، نه اقدام خودسرانه بوده و نه بدون هماهنگی با مسئولان بالاتر.»\nبا توجه به اذعان اخیر سخنگوی سپاه به زدن سه کشتی در «هماهنگی با مسئولان بالاتر»، یادآوری بخشی از مقاله ۲۱ شهریور بی‌مناسبت نخواهد بود:\n\n«استدلال محوری فرضیه “آتش‌به‌اختیار” بودن حملات ۱۶ تیر، حمایت مقاماتی رسمی در جمهوری اسلامی از تداوم آتش‌بس بوده است. در این فرضیه، دفاع مقام‌هایی چون مسعود پزشکیان و محمدباقر قالیباف از تفاهم‌نامه اسلام‌آباد، به‌عنوان شواهد مخالفت “حکومت ایران” با از سرگیری درگیری در محدوده تنگه هرمز مورد اشاره قرار گرفته است. اما استناد به اظهاراتی از این نوع برای توضیح مواضع “نظام”، به معنی نادیده گرفتن ساختار واقعی قدرت در جمهوری اسلامی ایران خواهد بود، که تصمیم‌گیر اصلی آن نه افرادی چون رئیس دولت یا مجلس، که اصطلاحا “نهاد رهبری” است... صرف نظر از اینکه تصمیم‌گیران، اجراکنندگان و استقبال‌کنندگان از حملات سه‌گانه، بعدها به همان نتایجی که تصور می‌کردند رسیدند یا نه، آشکارا آنچه در ۱۶ تیر به وقوع پیوست، “آتش‌به‌اختیار” نبود.»\n@ HosseinBastaniChannel \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-15T12:56:17+00:00", "published_epoch": 1792068977, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/UPgSVU-bb76VPg579OAs2PVpW4NeHjxZRuABhY3S-GiK2bND8MDENGM_a4MZ8h7yidPSyBaaTaeAj_xICGaUlcW8cqm2HMtReGvGIzSTu9F67xysp8ysC0t9HEdYETKhtEUciPlHAJaZm5zKs8OJ5CC1_A5uE2I8fgT9Olb-cpJCXPvRA-zA0FlcPx8MG9-K6z08Z0niQcJ76I0-f0czSRTdueKloH_L55P8tbfZydwtgKUZVnEXqHbXcA-GLHg-k0EzKpKfAYVdKbLpPsKIpTG2iZZvuC1_HZaxcC9lMAjJ3P2IvQ5PXnGblLu6fWtFM9g385EZ5o-b5XyEvYJBlg.jpg"], "local_media_path": "media/2026-10-15/bba7d6a1379522bc.jpg"}, {"hash": "fc7d23531e747fa3", "title": "سازمان ملل درباره تأثیر توقف عبور کود شیمیایی از تنگه هرمز بر کشاورزی جهان هشدار داد", "link": "https://www.radiofarda.com/a/failure-to-activate-hormuz-fertilizer-plan-could-trigger-food-crisis/33877274.html", "summary": "معاون دبیرکل سازمان ملل خواستار توافق ایران و آمریکا درباره عب     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
