rangutan cheek pad skin, dark slate grey to almost black, thick and leathery, covered in a fine dense grid of tiny wrinkles and folds, a soft matte surface with slight oily patches, a few sparse fine hairs, even overcast light, texture fills the whole frame \n ۴. تکسچر روی مجسمه (Seedream 5.5؛ Image 1 = مجسمه، Image 2 = مو، Image 3 = پوست؛ نسبت 4:3 یا برای ریلز 9:16؛ کیفیت 2K)\n Use Image 1 as the exact base: same pose, same proportions, same huge face shape. Turn the clay figure into a real photograph of a living old male orangutan, real full size, heavy and massive. All its hair is the real reddish-brown auburn orangutan hair from Image 2: long loose clumps hanging from the arms and shoulders, thinner on the chest and belly. Its giant cheek pads, face, throat sac and hands are the real dark slate-grey wrinkled leathery skin from Image 3, with a slightly lighter grey area around the mouth and muzzle. Small warm amber-brown eyes with wet reflections. A calm, wise, slightly amused expression, mouth closed in a subtle smirk.\nScene: it is slumped back on a worn brown leather sofa with brass studs along the arm, its back against a big brown cushion, a crumpled light blue blanket beside it, both hands raised in front of its chest, eyes half closed, a smug knowing look.\nThe photo itself: a quick phone snapshot with direct on-camera flash in a dim living room, harsh frontal flash, a hard shadow on the sofa behind it, fast light falloff, slight grain, plain realistic colours, nothing cinematic. A real animal with loose hairs, dust and small imperfections. Not a sculpture, not clay, not plastic, not a toy, not a figurine, not a costume, not a person in a suit, not CG or 3D, no glow. Keep the pose unchanged. No text. \n ۵. ویدیو (Seedance 2.5، ۵ ثانیه، Quality: 4K؛ Image 1 = عکس مرحلهٔ ۴، Audio 1 = صدای مرحلهٔ ۵)\n @Image 1 is the orangutan and the scene; keep its face, body, hair and the sofa identical to @Image 1.\n\n @Audio 1 is the final, fixed dialogue track. Use it exactly as it is as the orangutan's voice: the same voice, the same words, the same timing, pitch, rhythm and intonation. Do not re-voice, re-generate, translate, speed up or change it in any way, and do not add any other speech. The orangutan lip-syncs precisely to @Audio 1: its lips and jaw open and close on every syllable, mouth still and closed in the silences. It says the first line from 0.7 s to 2.1 s, slowly and drawn out; silence from 2.1 s to 2.9 s; then the second, shorter line from 2.9 s to 3.8 s; then silence to the end.\n\nOne continuous 5-second shot, static handheld phone camera with a tiny natural shake, slightly low angle, the orangutan centred from the belly up.\n\nAction: the orangutan stays leaning back on the brown leather sofa and claps its big hands together fast and continuously, about three claps per second, quick light energetic claps the whole time, never stopping, like an excited sarcastic applause. Its head sways and bobs side to side in rhythm with the claps, chin up, eyes half closed, a smug knowing grin. While speaking it keeps clapping and keeps bobbing its head; during the pause it tilts its head further to one side and narrows its eyes. Real animal movement with weight: the belly bounces with the claps, long arm hair swings with every clap, the heavy cheek pads wobble with each head bob and each word, fingers spread and meet.\n\nSound: @Audio 1 as the only voice, plus fast light hand claps in a quiet living room, matched to every hand contact. No music, no other voices, no text on screen.", "source_id": "tg_MatinSenPaii", "source_name": "@MatinSenPaii", "source_name_fa": "@MatinSenPaii (متین سنپای (شبکه و فیلترشکن))", "category": "telegram", "published_at": "2026-11-22T21:11:26+00:00", "published_epoch": 1795381886, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "fa612fe8a0568c57", "title": "Order your Lion and Sun ribbon from 24 November. The order link will go live that day on https://t.co/Ltiqvkzd7L. #Light ت کردم.\n رئیس‌جمهور به فاکس نیوز گفت تمایل دارد حملات به ایران را اگر توافقی حاصل نشود، پس از سال نو از سر بگیرد. \nاو گفت گفت‌وگوها همچنان به‌صورت غیرمستقیم ادامه دارد، اما ایرانی‌ها را «رقاص‌های حرفه‌ایِ طفره‌رفتن» توصیف کرد و افزود که آن‌ها مدام حرف می‌زنند. تمام کارشان حرف‌زدن است، اما همه‌اش مزخرف است.\n\nدر حال حاضر تنش‌ها در تنگه هرمز بالا گرفته، چون ایرانی‌ها همچنان به نفتکش‌ها در این منطقه حمله می‌کنند و محاصره دریایی آمریکا علیه بنادر ایران همچنان برقرار است.\n\n این هفته رسانه‌های دولتی ایران اشاره کردند که شاید بخواهند محاصره دریایی آمریکا را به چالش بکشند.\n\nرئیس‌جمهور گفت امیدوار است این کار را بکنند، چون در آن صورت همه‌شان به قعر دریا خواهند رفت؛ مثل بقیه نیروی دریایی ایران. البته اگر این شناورها تلاش کنند از محاصره دریایی آمریکا عبور کنند. \n\nاین همان روشی است که ایرانی‌ها اکنون در پیش گرفته‌اند. دارند امتحان می‌کنند که با این تهاجم علیه کشورهای خلیج فارس تا کجا می‌توانند پیش بروند.\nدیشب هم شاهد حملاتی به نیروهای آمریکایی در بحرین بودیم.\n\n....\n بر اساس گفت‌وگویی که همین حالا با رئیس‌جمهور داشتم، هیچ نشانه‌ای دیده نمی‌شود که ایرانی‌ها در این مقطع حاضر به توافق باشند. \n\nو باز هم همان رفت‌وبرگشت‌هایی است که پیش‌تر شاهدشان بوده‌ایم.\n\nاین چرخه‌ای عجیب است که تمام دنیا نظاره‌گر آن است؛ چون بعضی روزها تیتر خبرها این است که ایرانی‌ها آماده توافق‌اند و می‌خواهند برای نوعی راه‌حلِ مورد مذاکره برای این درگیری گفت‌وگو کنند.\n\nاما وال‌استریت ژورنال گزارش داده هنوز حدود ۱۵۰۰ موشک بالستیک در زرادخانه‌شان دارند و همچنان می‌توانند هر ماه حدود ۵۰ موشک دیگر تولید کنند.\nبنابراین پرسش‌هایی مطرح می‌شود درباره تهدید موشک‌های بالستیک که هنوز برقرار است، آنچه از برنامه هسته‌ای این کشور باقی مانده، و اینکه این درگیری واقعاً چگونه می‌تواند پایان یابد.\n\nحالا نکته جالب دیگری هم در این میان وجود دارد: ما دوباره شاهد شکل‌گیری اعتراض‌ها در داخل ایران هستیم.\nامروز هم در ایران اعلام شد که قطعی‌های نوبتی برق در کشور اجرا خواهد شد.\n\n از رئیس‌جمهور پرسیدم آیا از این اعتراض‌ها خبر دارد.\nگفت بعضی از ویدیوها را دیده و از معترضان در ایران خواسته به اعتراض ادامه دهند.\nاین سخنان بسیار شبیه چیزی است که تقریباً همین موقع در سال گذشته در ایران شنیدیم؛ زمانی که معترضان به خیابان‌های کشور آمده بودند و با گلوله جنگی روبه‌رو شدند. \n\nپس بار دیگر، رئیس‌جمهور ترامپ به فاکس نیوز گفته تمایل دارد عملیات رزمی گسترده علیه ایران را پس از سال نو از سر بگیرد.\nهنوز دقیقاً نمی‌دانیم این عملیات چه شکلی خواهد داشت، اما از آرایش کنونی نیروهای نظامی آمریکا در منطقه اطلاع داریم.\nدو گروه رزمی ناو هواپیمابر در حال فعالیت در دریای عرب هستند.\nهمچنین هواپیماهای سوخت‌رسان آمریکا اینجا در اسرائیل مستقرند و باز هم ایرانی‌ها دارند آزمایش می‌کنند که با حملاتشان در نزدیکی تنگه هرمز تا کجا می‌توانند پیش بروند.\nحتی در یک ساعت گذشته نیز حملات بیشتری به نفتکش‌ها گزارش شده است.\n رئیس‌جمهور گفت اگر بخواهند این محاصره دریایی را به چالش بکشند، نیروهای آمریکایی به آن شناورها شلیک خواهند کرد. \n\n 🔺 مجری: متحدان دیگر آمریکا چطور؟\nمثلاً سعودی‌ها و اماراتی‌ها؛ آیا به دولت آمریکا فشار می‌آورند که تقریباً به هر قیمتی توافق کند تا سرانجام این وضعیت پایان یابد، یا خواهان واکنش قاطع‌تری از سوی آمریکا هستند؟\n\n 🔻 تری یینگست: ... نگران‌اند که اگر جنگ از سر گرفته شود، دو مشکل عمده پیش بیاید:\nایرانی‌ها در پاسخ به زیرساخت‌های انرژی کشورهای خلیج فارس حمله خواهند کرد.\n\nمسئله بزرگ‌تر دیگری هم مطرح است: اگر حملات علیه حکومت ایران از سر گرفته شود، چه تفاوتی با عملیات «خشم حماسی» خواهد داشت؟\nهمین یکی از دلایلی است که قطری‌ها تا این اندازه در این روند مشارکت دارند.\n...\nدر حال حاضر در چرخه‌ای از مذاکره و حمله هستیم و فعلاً پایانی برای آن دیده نمی‌شود.\n TreyYingst \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-22T17:44:36+00:00", "published_epoch": 1795369476, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/mtNBGRFgf2xDn-7QCqLoy8SAQDy8vEl-cPWrVp_OMWC5Wg24hSc4NpQT7vG76wNrArUxf6YJjNvPQwjHkfc8748lxxP_VS4X4oHemJXupIYQwP-NAhrbvaoa8CCjKHaT5vU91Xdpv8_p5Y1UdjJ1pZanXbSBLAMLwmDMWKhHUuWDrk80nDSqnLlYYUoXOBUc4IkHSAPAHbUdGIG1vISpF_NGm91bWCTaZ47yKtZGy3P     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
