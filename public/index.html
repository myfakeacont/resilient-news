ه‌ای (Chain Proxy) رفع گردیده است.\n 🔐 رقابت هوشمند پیش از جهش (Pre-mutation Races):\nرقابت موازی و هم‌زمان بین Direct TLS، اسپلیت ClientHello و پروتکل ECH پیش از ارسال هرگونه جهش داده، و لغو آنی فیوچرهای بازنده پس از تثبیت نخستین اتصال موفق.\n 🔒 قفل هماهنگ هویت (Identity File Lock):\nاستفاده از قفل اشتراکی در سطح سیستم‌عامل برای جلوگیری از تداخل فرآیندهای هم‌زمان دسکتاپ هنگام خواندن، بازسازی و ذخیرهٔ کلیدهای هویت.\n ⚙️ چندسکویی کامل و مستقل:\nنسخهٔ ویندوز به هیچ عنوان وابسته به پیش‌نیازهای مجزای Visual C++ نبوده و به شکل کاملاً مستقل (Static CRT) اجرا می‌شود.\n 💻 پلتفرم‌های قابل دریافت:\n• ویندوز: فایل نصاب (Setup.exe) و پکیج (MSI)\n• مک‌اواس: نسخهٔ Apple Silicon (M1/M2/M3/M4) و پردازنده‌های Intel\n• لینوکس: بسته‌های آمادهٔ AppImage، DEB و RPM\n 🔗 لینک دانلود مستقیم از گیت‌هاب:\n https://github.com/WhiteDNS/WhiteAesther/releases/tag/v1.10.1 \n 📖 راهنمای فارسی تنظیمات پیشرفته:\n https://github.com/WhiteDNS/WhiteAesther/blob/v1.10.1/docs/AETHER-2.3.fa.md \n @whitedns", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-22T13:41:07+00:00", "published_epoch": 1792676467, "rtl": true, "raw_media_urls": ["https://cdn5.telesco.pe/file/WdEOuQ2ZUloRT8_Tk7VXfFVZ4_tdP1bbKWZqK8G90tqCe1Rt9mhNcJT6S3TKAKwcOIRBFajht5vfkJabJ3V09YHLxzp7lfnhh5lhnfXE_hwTp3pjJ_EmJpJWeT_N5r5oUFUjlmxXmLtXLk9ZjSaZ9LPrepGbtfmRYA8Ga1le6pHw_oi2gZumgaRAAGIlRjDGhGIYZvj-a3L5nY3mogXkvVLbSxMbjUiinCOYeuxpeigmbO0kMz7z6LTiHI5kRPmXj2VupZpZ2xH9WMsLZhZD1Jqp_aWMVEtT9XIA368zoqq_OEzSdhhBck1tT9S4h-rBb6dQZ9n8oF3COvjXVSRSNw.jpg"], "local_media_path": "media/2026-10-22/451686e147b7863c.jpg"}, {"hash": "93318b577e8b8b7c", "title": "۳ روز پیش گواهی eMudhra که خودش صادر کننده گواهی TLS هست، به خاطر افشای کلید خصوصی باطل شده.", "link": "https://t.me/ircfspace/2685", "summary": "۳ روز پیش گواهی eMudhra که خودش صادر کننده گواهی TLS هست، به خاطر افشای کلید خصوصی باطل شده.\nبعد فکر میکنید کلید خصوصی چی بود؟ عدد ۴!\n\n     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
