در سفر این هفته خود به اسرائیل، درباره حملات تازه با بنیامین نتانیاهو، نخست‌وزیر این کشور، گفت‌وگو کرده است. منابع این گزارش به دلیل حساسیت برنامه‌ریزی‌های نظامی نخواسته‌اند نامشان فاش شود.\n\n ▪️ هدف احتمالی، فشار برای گرفتن امتیاز است \nبر اساس این گزارش، زیرساخت‌های انرژی، تاسیسات هسته‌ای و زرادخانه موشکی و پهپادی حکومت ایران از اهداف احتمالی عملیات خواهند بود. با این حال، برخی مقام‌ها گفته‌اند برای جلوگیری از افزایش بیشتر قیمت بنزین، پالایشگاه‌ها و زیرساخت‌های نفتی هدف قرار نخواهند گرفت.\n\nبرخی برنامه‌ریزان آمریکایی معتقدند یک عملیات شدید سه‌روزه می‌تواند خسارت اقتصادی کافی برای تغییر موضع تهران و وادار کردن آن به دادن امتیازهای دیپلماتیک ایجاد کند.\n\n این ارزیابی با تردیدهایی روبه‌روست.\n نیویورک‌تایمز یادآور شده که حملات پیشین، از اسفند تا اردیبهشت، به افزایش قیمت انرژی و تورم جهانی، کاهش امنیت منطقه و فشار شدید بر ذخایر موشک‌های رهگیر آمریکا انجامید، اما حکومت ایران در برابر فشارهای اقتصادی دوام آورد.\n\nدانا استرول، مقام پیشین پنتاگون در امور خاورمیانه، گفته است نه ترامپ و نه نتانیاهو توضیح قانع‌کننده‌ای ارائه نکرده‌اند که جنگ بیشتر چگونه می‌تواند بن‌بست راهبردی موجود را تغییر دهد.\n\n ▪️ ترامپ پیش‌تر حمله را در آخرین لحظه به تعویق انداخته است \nبه نوشته نیویورک‌تایمز، ترامپ امسال چند بار با بازگشت به عملیات عمده رزمی مخالفت کرده است. اوایل ماه جاری میلادی نیز، پس از تدارکات گسترده ارتش‌های آمریکا و اسرائیل و قرار گرفتن نیروهای هوایی آن‌ها در بالاترین سطح آماده‌باش، او اندکی پیش از آغاز عملیات تصمیم به تعویق حمله گرفت.\n\nمقام‌های آمریکایی گفته‌اند احتمال آغاز عملیات در ماه جاری میلادی اندک است و ملاحظات سیاسی، از جمله وعده ترامپ برای حمله نکردن پیش از رای‌گیری، انتظار تا پس از انتخابات میان‌دوره‌ای آمریکا را محتمل‌تر می‌کند.\n\nبر اساس این گزارش، استقرار کامل نیروها و تجهیزات مورد نظر آمریکا، شامل سه ناو هواپیمابر، هزاران تفنگدار دریایی، جنگنده‌ها و نیروهای عملیات ویژه، تا اوایل نوامبر تکمیل خواهد شد.\n\nیک مقام کاخ سفید از اظهارنظر درباره وجود یا نبود این طرح‌ها خودداری کرده و گفته است ترامپ برای جلوگیری از دستیابی حکومت ایران به سلاح هسته‌ای، همه گزینه‌ها را روی میز نگه داشته است.\n\nانتخابات اسرائیل نیز بر تصمیم‌گیری اثر می‌گذارد\nانتخابات ۲۷ اکتبر، برابر با ۵ آبان، اسرائیل می‌تواند اجرای طرح‌ها را پیچیده کند. کارشناسان به نیویورک‌تایمز گفته‌اند در صورت شکست نتانیاهو و ادامه کار او در مقام نخست‌وزیر دولت موقت، آغاز جنگ برایش دشوارتر خواهد شد.\n\nبرخی تحلیلگران نیز احتمال داده‌اند که نتانیاهو از چشم‌انداز حمله مشترک با آمریکا برای ترغیب رقبایش به تشکیل دولت وحدت یا دولت اضطراری استفاده کند؛ اقدامی که می‌تواند حضور او در قدرت را طولانی‌تر کند.\n...\n@ VahidOOnLine \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-22T00:23:12+00:00", "published_epoch": 1792628592, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/olkMO19gBMOVzLfsnnwwG46Kb4SOWM5_ddKkuzBqQ3JTEck8Tu8JcqlnWgFjbf7eaoB-b9uWUjm27Ic8S3Ljmc4tQMdPnvajqopIAuTWvi8edRTxv0a9675GI3JmlzVrRDlwLGH4Z00PHrZ99GPWHY4WbqmqpLL8_3ZvVzZ91dJ8dPzRF8SvUL-YbnHKvWA83uSipOQKaqjFNxgBmRE2WZaNMhjfwz7clPIDgaawMdKO5xyUdY_BUNEex2ae8g33gFQNB_axuEcH8nymKwIf134hNtXGlTw4IEAWwuhjON8S0C-_UIOAX_lUxXNauY6jHeDcbcwcq1KKnMSq4HnN-A.jpg"], "local_media_path": "media/2026-10-22/3c04e946da48e6ed.jpg"}, {"hash": "c23abc7dbbfed485", "title": "چرا روسیه دوباره به جنبش‌های جدایی‌طلب در اروپا علاقه‌مند شده است؟", "link": "https://www.bbc.com/persian/articles/c574pjzx13vgo?at_medium=RSS&at_campaign=rss", "summary": "برای کرملین، حمایت لفظی از جنبش‌های جدایی‌طلب در غرب موضوع تازه‌ای نیست. اما در ماه‌های اخیر، رسانه‌های دولتی روسیه توجه ویژه‌ای به جنبش‌های استقلال‌طلب در بریتانیا نشان داده‌اند؛ از راهپیمایی هواداران استقلال ولز گرفته تا نشست رهبران ملی‌گرای ولز، اسکاتلند و ایرلند شمالی. تحلیلگران می‌گویند این پوشش بخشی از تلاش روسیه برای نمایش اروپا به عنوان قاره‌ای دچار شکاف و بحران سیاسی است.", "source_id": "bbc_persian", "source_name": "BBC Persian", "source_name_fa": "بی‌بی‌سی فارسی", "category": "persian", "published_at": "2026-10-22T00:19:42+00:00", "published_epoc     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
