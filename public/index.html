g Suffix)، پکت‌ها را بدون تغییر در بایتهای پروتکل یا دستکاری TLS به بک‌اند مربوطه هدایت می‌کند.\n\n مفهوم و کارکرد CottenDNS: ابزار CottenDNS (که بر پایه پروژه StormDNS و MasterDnsVPN توسعه یافته) یک تونل DNS اختصاصی برای شبکه‌هایی است که پروکسی‌ها و VPNهای معمولی در آن‌ها کاملاً مسدود شده اما بستر DNS همچنان پاسخگوست .\nاین سیستم ترافیک برنامه‌ها را به فریم‌های کوچک خرد کرده، رمزنگاری می‌کند و از مسیر ریزالورهای DNS عبور می‌دهد.همچنین با بهره‌گیری از کنترل‌کننده مسیر آداپتیو (Unified Path Controller) ، شناسایی هوشمند MTU و پروتکل‌های ترمیم خطا مانند ARQ و Reed–Solomon FEC، افت پکت شدید و اختلالات مسیر را جبران می‌کند\n چگونه در قطعی سراسری اینترنت ارتباط حفظ شد؟ در زمان قطعی کامل یا اختلال شدید اینترنت بین‌الملل در ایران، پروتکل‌های استاندارد ارتباطی و پروتکل‌های رایج VPN به‌طور کامل مسدود شدند. با این حال، زیرساخت شبکه داخلی برای امکان استعلام دامنه‌ها ناچار به باز نگه‌داشتن پورت 53 روی ریزالورهای ISPها بود[5]. ابزارهای CottenDNS و CottenRouter دقیقاً از همین روزنه تنفسی شبکه استفاده کردند تا داده‌ها را در قالب درخواست‌های مشروع DNS به سرورهای خارج از کشور ارسال کنند و با وجود سرعت محدود و افت پکت بالا، امکان تبادل داده و حفظ ارتباطات حیاتی را فراهم سازند\n\n @whitedns", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-19T17:24:23+00:00", "published_epoch": 1792430663, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "547173652855ad9e", "title": "Evidence (YC S21) Is Hiring Software Engineers", "link": "https://evidence.dev/jobs", "summary": "Article URL: https://evidence.dev/jobs \n Comments URL: https://news.ycombinator.com/item?id=50155172 \n Points: 0 \n # Comments: 0", "source_id": "hacker_news", "source_name": "Hacker News", "source_name_fa": "هکر نیوز (تکنولوژی و امنیت)", "category": "tech", "published_at": "2026-10-19T17:21:33+00:00", "published_epoch": 1792430493, "rtl": false, "raw_media_urls": [], "local_media_pat     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
