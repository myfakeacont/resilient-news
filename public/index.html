 هستند.»\n\nرئیس‌جمهور آمریکا همچنین گفت واشینگتن در صورت ازسرگیری عملیات نظامی، زیرساخت‌هایی را در داخل ایران به‌عنوان هدف شناسایی کرده است؛ از جمله نیروگاه‌های برق و پل‌ها.\n\n ترامپ گفت: «ما ۳۸ پل را در فهرست اهداف خود داریم که می‌توانیم به معنای واقعی کلمه ظرف یک ساعت آن‌ها را منهدم کنیم. همه آن‌ها از بین خواهند رفت.»\n\nاو همچنین درباره وضعیت ذخایر موشکی و پهپادی ایران اعلام کرد جمهوری اسلامی تنها ۱۰ درصد از ظرفیت موشکی و ۱۵ درصد از توان پهپادی خود را حفظ کرده است.\n\nترامپ بار دیگر درباره احتمال ازسرگیری عملیات نظامی گفت: «به احتمال زیاد چنین اقدامی ضروری نخواهد بود. آن‌ها به‌شدت خواهان دستیابی به توافق هستند.» \n\nاین اظهارات در حالی مطرح شده که عباس عراقچی، وزیر خارجه ایران، روز یکشنبه در شبکه ایکس بار دیگر اعلام کرد «پیشنهاد دو روزه» ایران برای باز شدن تنگه هرمز و پایان محاصره دریایی آمریکا علیه ایران همچنان روی میز است و افزود کاخ سفید باید در این باره تصمیم بگیرد.\n@ VahidHeadline \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-08T18:07:07+00:00", "published_epoch": 1794161227, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/kfly_wPnUnzEhAv9OUFFeFNrQNWaRnTkc_hKs9wTbR6wuXTKxVVvfNn6gwC9m4NmKqe_9k82alNqMdWalhChaNFF6hJ2n3FyluDOJxIaaIhZDTz2xBXiFQOzCWu4AIQQIWU8itZQD9sxZH_mRTXPvETmviHSv7u0RbxmN2yOlApQIezeBQguqQpjz-G6XqCQVPa7VdrUcayRUr6hxmmtmpeL-LJImvCpYtHY9QhhUJ1BBQeazh9TeWoG8O98EpsV3iWFvH2BfWgDMOfPjizJX1wySs5t27k-f7T7fHPszpcMwbzCmXd-EykifcRiv_zswuuCHl25rLmU1TjxWaYD8g.jpg"], "local_media_path": null}, {"hash": "c65e14d97625c71b", "title": "مادر امیرحسین موسوی، زندانی سیاسی محکوم به اعدام: در دادگاه اجازه دفاع به پسرم ندادند", "link": "https://www.iranintl.com/202611086167", "summary": "ثریا طالبی، مادر امیرحسین موسوی، فعال فضای مجازی و زندانی سیاسی محکوم به اعدام که از آذر ۱۴۰۳ زندانی است، از نگهداری ۱۷۶ روزه فرزندش در سلول انفرادی، تهدید او در بازجویی‌ها و پخش اعترافات اجباری خبر داد و گفت حکم اعدام او بدون فراهم شدن     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
