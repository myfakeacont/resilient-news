نان را به‌جرم آزادی‌خواهی اعدام می‌کند، دیپلماسی کارساز نیست. چنین رژیمی تنها زمانی عقب‌نشینی می‌کند که با قدرت و قاطعیت روبه‌رو شود و بداند که جنایاتش بی‌هزینه نخواهد ماند.\n\nاز اینکه در برابر آنچه بر پرستو گذشت، سکوت نکردید، سپاسگزاریم. اما اکنون پرستو و میلیون‌ها ایرانی از شما انتظار دارند که این اعتراض را به اقدام عملی تبدیل کنید.\n\nرضا پهلوی\n\n @OfficialRezaPahlavi", "source_id": "tg_OfficialRezaPahlavi", "source_name": "@OfficialRezaPahlavi", "source_name_fa": "@OfficialRezaPahlavi (کانال رسمی شاهزاده رضا پهلوی)", "category": "telegram", "published_at": "2026-11-25T19:47:40+00:00", "published_epoch": 1795636060, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/IL_BC5tb3agQl6jqKRBuH2qBmoCSktT6T8Xnrwn5oHhFqj-tBnkR41akVW6KUfZKxl3NV-fdhJEMdVL9fLbIJ9-4q4pPpvIiTcIrdM0_DvyZ-HSgCQYImIKMel-FzOUXZvR2tzRq06JUrPuvJry4BVsxh8u4p8aoZMWPqrf47YPvDdtebdGJ9W4RdPgSaz5Pvqz74VSDAm9vTqIRop4EWTC0xZDaMQfJ_Z04x278m_gDm476InFjyuWCx8uDZA6tMHGZPzqCyW8wzYozVuauzRyPby03_iif7wB3NK5qagms4WxrOAwWoVAMIpAdgQt9lt7MckFSyTgq1ROJZf-aBw.jpg"], "local_media_path": "media/2026-11-25/595fc15ac4b0c9ac.jpg"}, {"hash": "e03f6da6cffad160", "title": "صباح ۱-۴ بارسلونا؛ پیروزی پرگل شاگردان فلیک در باکو با دبل گوردون", "link": "https://www.iranintl.com/202611259029", "summary": "تیم فوتبال بارسلونا در هفته پنجم مرحله لیگ رقابت‌های لیگ قهرمانان اروپا با نتیجه ۴-۱ برابر صباح جمهوری آذربایجان به پیروزی رسید. با این برد، بارسلونا ۱۲ امتیازی شد و در رده چهارم جدول باقی ماند.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-11-25T19:41:11+00:00", "published_epoch": 1795635671, "rtl": true, "raw_media_urls": ["https://i.iranintl.com/images/rdk9umy0/production/65e2b90171624562cf1a9ae265d5705652d3edc6-2683x1661.jpg?rect=0,129,2683,1404&w=1200&h=628&fm=jpg&q=85&fit=max&auto=format"], "local_media_path": null}, {"hash": "1c2736407b1b4265", "title": "S&P Global places Nvidia rating on 'CreditWatch Negative' o     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
