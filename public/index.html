.com/WhiteDNS/CottenDNS/main/server_linux_install.sh | sudo bash -s -- --upgrade \n\n ۳. اگر CottenDNS رو با CottenRouter نصب کرده‌اید \nآپدیت موتور رو از خود روتر انجام بدید تا مسیر اتصال و تنظیماتش حفظ بشه.\n\nدستور آپدیت موتور: sudo cottenrouter update --project cottendns \n\nاین دستور آخرین انتشار CottenDNS رو جدا از نسخهٔ خود روتر بررسی و نصب می‌کنه. اگر خود CottenRouter قدیمیه، اول با دستور رسمی زیر به‌روزش کنید و بعد دستور آپدیت موتور رو اجرا کنید.\n\nدستور آپدیت روتر: curl -fsSL https://raw.githubusercontent.com/TaJirax/CottenRouter/main/scripts/install.sh | sudo bash \n\n ✅ روی سرور سازگار و به‌روز، حالت‌های Normal و CottenMax کنار هم کار می‌کنن؛ برای تغییر حالت، ساخت کانفیگ، دامنه یا کلید جدید لازم نیست.\n\n 🔄 اگر وصل نشد: در همان بخش CottenDNS mode ، گزینهٔ Normal CottenDNS رو انتخاب کنید، ذخیره کنید و دوباره وصل بشید.\n\n ⚠️ حالت CottenMax هنوز Beta است؛ عملکردش به شبکه و ریزالورها بستگی داره. اگر فقط کاربر یک ساب هستید، برای به‌روزبودن سرور از مدیرش بپرسید؛ دستورهای بالا برای صاحب سروره.\n\n----------\n #آموزش #WhiteDNS #CottenDNS #CottenRouter #WhiteDNS_Panel \n\n 📱 دانلود آخرین نسخهٔ پایدار اندروید \n 🔗 پروژهٔ CottenDNS \n 🔗 پروژهٔ CottenRouter \nکانال: @WhiteDNS \n https://whitedns.online", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-24T16:02:43+00:00", "published_epoch": 1792857763, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "185ac33a47bd8b0c", "title": "انتخابات سرنوشت‌ساز اسرائیل؛ نتانیاهو در برابر رقبای خود و بن‌بست تشکیل دولت", "link": "https://parsi.euronews.com/2026/10/24/israel-election-2026-netanyahu-eisenkot-final-polls-coalition", "summary": "اسرائیل روز سه‌شنبه ۲۷ اکتبر انتخابات پارلمانی سرنوشت‌ساز خود را برگزار می‌کند. نظرسنجی‌ها نشان می‌دهد که رقابت میان ائتلاف بنیامین نتانیاهو و احزاب مخالف بسیار نزدیک است اما هیچ‌یک از دو اردوگاه اکثریت لازم را برای تشکیل دولت به دست نخواهند آورد.", "     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
