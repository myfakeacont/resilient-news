 ایکس تأکید کرد که دولت دونالد ترامپ مصمم است از دستیابی ایران به سلاح هسته‌ای جلوگیری کند.\nهگست گفت: «وقتی می‌گوییم ایران سلاح هسته‌ای نخواهد داشت، واقعاً منظورمان همین است. ما تحت رهبری رئیس‌جمهوری ترامپ، اقدامات دشوار لازم را برای تضمین این موضوع انجام خواهیم داد.»\nاو در ادامه افزود: «چون فارغ از اینکه مردم چه احساسی دربارهٔ جنگ دارند، من معتقدم این جنگ اقدامی شجاعانه و تاریخی است که تضمین خواهد کرد ایران هرگز به سلاح هسته‌ای دست پیدا نکند.»\nپیش از این، دونالد ترامپ، رئیس‌جمهوری آمریکا، گمانه‌زنی‌ها دربارهٔ برکناری پیت هگست، وزیر جنگ، را رد کرده و گفته بود که از عملکرد او رضایت دارد.\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-05T21:59:48+00:00", "published_epoch": 1793915988, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/K4S-4aK0-v69AyS99KyWGlwPvlzrliAOLlK2oxK3GTYKB6LrdUBADtMZWUsR5QHdNlHwHzNIQhRVEPxsL6xOSeov8rm8PBexX9xOPeRcLe_sXNBt92xp8nTUDF9eVt3P7kKzY-CYkTRXGpOf5IJlyHtrkggvfS_6c04rcjfOVhAdAosQY66rIxqOJzWZhQ4kYXrKht0u6WP1SBCuGruUHMxmEB26mWfx2zFfP-GYsqZATVaU8IYIfAZfsNYjshmYtZnTxvIsigxwsfuOYzrBIxmMD5PiNIagRS24GLtj5rY21MTPu_O97cwz3eRUKtznW3T9waUu1C48R4Vq-Rk6jw"], "local_media_path": "media/2026-11-05/6375d2378bc6a025.jpg"}, {"hash": "98fa35471b84c453", "title": "آلکمار ۱-۲ یوونتوس؛ بازگشت بانوی‌پیر به روند پیروزی در لیگ اروپا", "link": "https://www.iranintl.com/202611056252", "summary": "تیم فوتبال یوونتوس در هفته چهارم لیگ اروپا با نتیجه ۲-۱ آلکمار را در هلند شکست داد تا با ۱۰ امتیاز در رده پنجم جدول رده بندی لیگ اروپا قرار بگیرد.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-11-05T21:56:24+00:00", "published_epoch": 1793915784, "rtl": true, "raw_media_urls": ["https://i.iranintl.com/images/rdk9umy0/production/bfff673f1c0abe1d42b1c8ac24c4a0ecb5b310c9-3780x2586.jpg?rect=0,304,3780,1978&w=1200&h=6     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
