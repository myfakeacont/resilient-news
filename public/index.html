س زدم پیش میره و جنسن همین امروز \"استعفا\" داد! \n\nحالا ازینجا به بعدش یکمی جالب میشه و پیشبینی من میتونه ضریب خطا داشته باشه، ولی به هر حال دوست دارم مکتوبش کنم.\n\nجنسن توی واشنگتن خیلی مخالف داره ولی پشتش به کاخ سفید گرم هست، دشمنی واشنگتن با جنسن هم بحث مفصلی هست ولی در کل دلیلش اینه که جنسن طرفدار مدل های اپن سورس هست و چند سال اخیر مدام به واشنگتن فشار آورده که بذاره انویدیا به چین هم gpu بفروشه و چینی ها هم خیلی خیلی با جنسن میونه خوبی دارن و اصلا یه دلیلی که ما میتونیم از مدل های ارزون چینی استفاده کنیم، بخاطر همین جنسن هوانگ هست.\n\nدر واشنگتن، عده زیادی هستن که چین رو بزرگ ترین تهدید آمریکا میدونن و سال ها هست که دارن گلوی جنسن رو فشار میدن تا دست از فروش gpu به چین برداره ولی جنسن زیر بار نرفته و نخواهد رفت.\n\nحالا واشنگتن و سرویس های امنیتی آمریکا خیلی ناگهانی داستان \"جاسوس چینی\" به \"دستشون رسیده\" و بعد هم فهمیدن که جنسن با یکی از vp های انویدیا رابطه داشته؟ عجب :)))\n\nحالا یه چیزی ازونور واضح هست و اونم اینه که هیئت مدیره انویدیا و کاخ سفید پشت سر جنسن هستن، خب حالا فرض کن که شما جنسن هوانگ هستی و در این وضعیت که اذهان عمومی داره شمارو جاج میکنه و داخل واشنگتن هم اینهمه دشمن قدرتمند داری، بهترین استراتژی چیه؟ \n\nشما میای استعفا میدی و با خبر استعفا، اذهان عمومی یکم یخ میکنه و انویدیا از سر تیتر اخبار میاد پایین و اذهان عمومی منظورم سهامدارای انویدیا هستن و انویدیا یه کمپانی پابلیک هست و هرکسی میتونه سهامشو خرید و فروش کنه. \n\nپس اینجا از اذهان عمومی منظورم اصغرقلی نیست که یه گوشه نشسته و صبح تا شب توییتر رو بالا پایین میکنه چون نظر اصغرقلی روی قیمت سهام انویدیا تاثیری نداره ولی نظر مردم آمریکا نسبت به جنسن، روی قیمت سهام انویدیا خیلی اثر گذار هست.\n\nخب پس شما استعفا میدی و ملت یکم آروم میشن و تب و تاب این داستان یکم میخوابه، بعدش چی میشه؟ هیئت مدیره میره ریسرچ و تحقیق میکنه و میاد میگه ای ملت! این جاسوس چینی هیچ اطلاعاتی از انویدیا نتونسته بدزده و همه چیز امن و امان هست، بعدشم جنسن یه نامه عذرخواهی میزنه و بابت رفتار غیرحرفه ای خودش عذرخواهی میکنه و بعد هم هیئت مدیره میگه خب باشه اشکال نداره بیا برگرد سرکار عزیزدلم و قضیه ختم به خیر میشه.\n\n     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
