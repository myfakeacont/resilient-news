 اگر مجبور بودم دوباره آن کار را انجام دهم، باز هم انجامش می‌دادم، زیرا در بلندمدت این تنها راه‌حل است. شما نمی‌توانید اجازه دهید ایران به سلاح هسته‌ای دست یابد.»\n\nجی‌دی ونس پیش‌تر در پیامی در شبکهٔ اجتماعی ایکس، با اشاره به شکست نامزدهای جمهوری‌خواه در انتخابات میان‌دوره‌ای و از دست رفتن اکثریت سنا، جنگ ایران را عامل اصلی این شکست دانست و نوشت که بسیاری از رأی‌دهندگانی که در انتخابات ریاست‌جمهوری سال ۲۰۲۴ از ترامپ حمایت کرده بودند، این بار به نامزدهای دموکرات رأی داده‌اند.\n\nونس تأکید کرد که مشکل اصلی جمهوری‌خواهان کاهش مشارکت هوادارانشان نبوده، بلکه نارضایتی رأی‌دهندگان از سیاست‌های دولت بوده است. به گفتهٔ او، نظرسنجی‌ها نشان می‌دهد پایان دادن به جنگ ایران، رسیدگی به هزینه‌های زندگی و تورم، اجرای سیاست «اول آمریکا» و تغییر روابط با اسرائیل، چهار خواستهٔ اصلی رأی‌دهندگانی بوده که از جمهوری‌خواهان رویگردان شده‌اند.\n\nمعاون رئیس‌جمهوری آمریکا همچنین از تلاش برخی سیاستمداران تشکیلات حزب جمهوری‌خواه برای فرافکنی انتقاد کرد و گفت هرگونه گفتگوی صادقانه دربارهٔ آیندهٔ این حزب باید با پذیرش دلایل شکست انتخاباتی آغاز شود.\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-04T19:15:03+00:00", "published_epoch": 1793819703, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/jUnxsTxRqr4fBn3wRSus_gh34kQrLQ-IroOQxH6uO6H2J880tTp-cGyctCk57WL_QopiSbWnWZtb6I9SBFcaddJ4vUpQAES_7BDRE3H3Uv9qZXfYuPAgskbZyWKMKtsUb9me9CW-hi-XrjnS_akXiadxgv_Y-1dAEZe8kd97fDQzKCfaKTeiMPWo1180C5qpvMecEEW1sN9sDPUpw2uhxJ_hS308wVc_1LL_6UhzoWB5xk-sL63dZS1C6RnyRfrOmg4wxT3zIU8xGDR17dTd73jxU0GAzhPDxzW_hZo-DkghmCZLVa2mIssimIFYO5Uw0tUzfyHBLqbgY8YuPnyfig"], "local_media_path": "media/2026-11-04/7863b2cac343689c.jpg"}, {"hash": "42ae8a2c2bb26da2", "title": "US stocks surge, and the Dow soars 1,500 points as Brent oil's price drops below $95 per barrel - AP News", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPSEtETVdDVnpDVFhqVmpJNTdBUURHcFg0YkhsOVd     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
