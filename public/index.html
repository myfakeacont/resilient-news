faf1e", "title": "دونالد ترامپ، رییس‌جمهوری آمریکا، بار دیگر از احتمال حمله نظامی به جمهوری اسلامی یا دستیابی به توافق با تهران سخن گفت و ...", "link": "https://t.me/VahidOnline/78831", "summary": "دونالد ترامپ، رییس‌جمهوری آمریکا، بار دیگر از احتمال حمله نظامی به جمهوری اسلامی یا دستیابی به توافق با تهران سخن گفت و تاکید کرد هدف واشینگتن این است که مانع دستیابی ایران به سلاح هسته‌ای برای همیشه شود.\n\nترامپ روز شنبه دوم آبان در جمع خبرنگاران در فلوریدا، در پاسخ به پرسشی درباره میزان پیشرفت برنامه‌ریزی برای حمله احتمالی به ایران گفت: «داریم به انجامش فکر می‌کنیم، شاید فردا.» او بلافاصله افزود: «واقعا فکر می‌کنید به شما می‌گویم که قرار است این کار را بکنم یا نه؟»\n\nرییس‌جمهوری آمریکا بدون اعلام زمان مشخصی برای اقدام نظامی گفت: «این احتمال وجود دارد که انجامش بدهم. این احتمال هم هست که به یک توافق خوب، بزرگ و زیبا برسیم.»\n\nترامپ گفت مقام‌های جمهوری اسلامی خواهان توافق هستند، اما درباره پایبندی تهران به هر توافق احتمالی ابراز تردید کرد و گفت: «مشکل این است: آیا به توافق پایبند می‌مانند؟»\n\n او با اشاره به عملیات بمب‌افکن‌های بی‌۲ علیه ایران گفت می‌توانست یک سال پیش این عملیات را انجام دهد و به اقدام نظامی پایان دهد، اما به گفته او، جمهوری اسلامی ممکن بود ظرف یک تا دو سال راهی برای ساخت بمب هسته‌ای پیدا کند.\n\nترامپ تاکید کرد: «باید کاری کنم که این مساله برای همیشه حل شود. تنها دلیل اینکه این کار را این‌قدر ادامه داده‌ام، همین است.»\n\nاو درباره گزینه‌های پیش روی دولت آمریکا گفت: «سوال این است: کار را تمام کنیم، که دشوار هم نخواهد بود، یا با آنها توافق کنیم؟ و این به خودشان بستگی دارد.»\n\nرییس‌جمهوری آمریکا در بخش دیگری از سخنانش بار دیگر مدعی شد که تمامی جنگنده‌ها و کشتی‌های ایران در جریان عملیات نظامی آمریکا از بین رفته‌اند. او شمار کشتی‌های منهدم‌شده را ۲۵۹ فروند اعلام کرد و گفت همه آنها «در قعر دریا» هستند.\n\nترامپ همچنین مدعی شد سامانه‌های راداری ایران نابود شده‌اند و از عملکرد نیروی دریایی آمریکا تمجید کرد.\n\nاو با اشاره به وضعیت اقتصادی ایران گفت که صبح همان روز گزارشی درباره رسیدن تورم ایران به ۳۰۱ درصد خوانده است. ترامپ همچنین ادعا کرد که اکنون نفت بیشتری نسبت به پیش از آغاز جنگ از تنگه هرمز عبور می‌کند.\n\nترامپ در واکنش به پرسشی درباره گزارش‌های اطلاعاتی مربوط به افزایش تلاش‌های جمهوری اسلامی برای هدف قرار دادن نیروها و کارکنان آمریکایی در خاورمیانه، مقام‌های جمهوری اسلامی را «آدم‌های بد» با «رهبری بسیار بد» توصیف کرد.\n\nاو مدعی شد مقام‌های جمهوری اسلامی ۷۵ هزار معترض را کشته‌اند و خطاب به خبرنگاران گفت: «شما هیچ‌وقت درباره‌اش نمی‌نویسید.» ترامپ همچنین جمهوری اسلامی را به کشتن شمار زیادی از شهروندان آمریکایی متهم کرد.\n\nرییس‌جمهوری آمریکا در ادامه جمهوری اسلامی را «بزرگ‌ترین حامی دولتی تروریسم» خواند و با انتقاد از روسای‌جمهوری پیشین آمریکا گفت آنها باید زودتر اقدام مشابهی انجام می‌دادند، زیرا به گفته او، در آن زمان این کار آسان‌تر بود.\n\nترامپ در پایان بار دیگر احتمال ادامه عملیات نظامی یا دستیابی به توافق را مطرح کرد و گفت: «شاید مجبور شوم کار را تمام کنم، یا شاید آنها توافق کنند. اما مطمئن نیستم. در هر صورت، ما برنده‌ایم.»\n\nاین اظهارات در شرایطی مطرح می‌شود که گزارش‌هایی درباره افزایش نگرانی‌های اطلاعاتی آمریکا از تهدیدهای احتمالی جمهوری اسلامی علیه نیروهای آمریکایی و خروج شماری از کارکنان دیپلماتیک و نظامی آمریکا از بخش‌هایی از خاورمیانه منتشر شده است.\n@ VahidHeadline \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-24T22:28:05+00:00", "published_epoch": 1792880885, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/ALTJHKh8X4975KfCboKmW0pNnOZfv22XrScou3TBmBVypOsUrP1NWpMbdeaueH4wr71RDaaXbHMNSZD6UET1_8rS_vfJNuVr4344ABk7yvf3m2ptjJUVbxqy4Bhnrttr6mn4DaFyqrVflOzpPMvXmKQe71TNrbuSicFTmGItnna4U6we2Tuo7Lr3wnbF63EAfkpqB7Gn5rqRujXSVhkocBYG-y_y1RWCEJd9R2gzFAVmAH-3O4MHoByCFcir_xwfImwIerggFJJLqv9EaEmZH2V9sIrbgJZ2yt5TR5cI7LxGM7AXOxwIIpp-XSHwPsuRWF3lcIRGFjvWnihmrqcasA.jpg"], "local_media_path": "media/2026-10-24/e1dfb7a5b0b7d023.jpg"}, {"hash": "120daa53681b9571", "title": "مراد ویسی، تحلیل‌گر ارشد ایران‌اینترنشنال، گفت: «تصمیم‌گیری درباره اعدام‌ها فقط با دادگاه انقلاب یا فرمانده     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
