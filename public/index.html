V1dVZpVmIwbmNUVEI0ZFZaZUNNanpFTl8wbkxCNWlPWEVOS09KckdDdA?oc=5", "summary": "Abbas postpones Palestinian elections, sets presidential poll for September 2027    Reuters", "source_id": "reuters_wire", "source_name": "Reuters Wire", "source_name_fa": "خبرگزاری رویترز", "category": "wire", "published_at": "2026-10-10T16:31:01+00:00", "published_epoch": 1791649861, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "a9c6bcddb35d662e", "title": "در ادامهٔ حملات موشکی حوثی‌های یمن به عربستان سعودی، بعدازظهر شنبه ۱۸ مهر صدای انفجار مهیبی در فرودگاه بین‌المللی ریاض ش...", "link": "https://t.me/VahidOnline/78683", "summary": "در ادامهٔ حملات موشکی حوثی‌های یمن به عربستان سعودی، بعدازظهر شنبه ۱۸ مهر صدای انفجار مهیبی در فرودگاه بین‌المللی ریاض شنیده شد، بخش‌هایی از فرودگاه تخلیه و تمامی پروازهای ورودی به پایتخت عربستان لغو شدند.\n\nیک منبع دیپلماتیک به خبرگزاری فرانسه گفت که فرودگاه بین‌المللی ریاض هدف حملهٔ موشکی حوثی‌های یمن قرار گرفته و بر اساس گزارش‌های اولیه، ده‌ها نفر زخمی شده‌اند.\n\nروزنامهٔ وال‌استریت جورنال به‌نقل از مقام‌های سعودی گزارش داد که موشک‌های شلیک‌شده از سوی حوثی‌های یمن مستقیماً به ترمینال شمارهٔ سه فرودگاه بین‌المللی ملک خالد در ریاض اصابت کرده و این بخش از فرودگاه تخلیه شده است.\n\nیک منبع بیمارستانی هم به خبرگزاری فرانسه گفته است که پنج نفر از مجروحان در بخش مراقبت‌های ویژه بستری شده‌اند. یکی از شاهدان عینی گفته است هنگام حضور در گیت ۴۰۳ ترمینال پروازهای داخلی، شاهد اصابت موشک به محدودهٔ گیت ۴۰۱ و زخمی شدن مسافران بوده است.\n\nبه گفتهٔ منبع دیپلماتیک، حمله حدود ساعت سه بعدازظهر به وقت محلی رخ داده است. مقام‌های عربستان سعودی هنوز وقوع حملهٔ تازه را تأیید نکرده‌اند و حوثی‌ها نیز مسئولیت آن را بر عهده نگرفته‌اند.\n\nخبرگزاری رویترز نیز گزارش داد که پس از شنیده شدن صدای انفجار مهیب، بیش از دوازده آمبولانس در حال حرکت به‌سوی فرودگاه مشاهده شدند و مسافران از بخش‌هایی از آن تخلیه شدند. سه شاهد عینی نیز تخلیهٔ مسافران را برای خبرگزاری فرانسه تأیید کرده‌اند.\n\nبر اساس اطلاعات وب‌سایت ردیابی پرواز «فلایت‌رادار۲۴»، تمامی پروازهای ورودی به ریاض تغییر مسیر داده یا لغو شده‌اند و در مقطعی تنها یک بالگرد بر فراز فرودگاه دیده می‌شد.\n\nفرودگاه ملک خالد از مسافران خواسته است پیش از حرکت به‌سوی فرودگاه، وضعیت پرواز خود را از شرکت‌های هواپیمایی پیگیری کنند. شرکت‌های اتحاد و قطر ایرویز نیز چندین پرواز میان ریاض و مراکز اصلی فعالیت خود را لغو کرده‌اند و لغو برخی پروازها تا روز دوشنبه ادامه خواهد داشت.\n حملات روزهای گذشته به فرودگاه ریاض چهار کشته و چندین زخمی بر جای گذاشته و به هواپیماهای مسافربری، از جمله یک فروند هواپیمای شرکت سعودی، آسیب رسانده است.\n\nسه شهروند سعودی، از جمله یک خلبان، در حملات روز پنج‌شنبه و یک شهروند سودانی در حملهٔ چهارشنبه کشته شده‌اند. حوثی‌های مورد حمایت جمهوری اسلامی مسئولیت حملات پیشین به فرودگاه ریاض را پذیرفته‌اند.\n\nحملات اخیر در پی تشدید جنگ میان حوثی‌ها و نیروهای دولت مورد حمایت عربستان در یمن صورت گرفته است. حوثی‌ها که در هفته‌های گذشته بخش‌هایی از سواحل دریای سرخ را تصرف کرده بودند، با ضدحملهٔ نیروهای دولتی و حملات هوایی عربستان روبه‌رو شده‌اند.\n\nاین گروه تهدید کرده است که حریم هوایی عربستان، به‌جز مناطق بالای شهرهای مکه و مدینه، را منطقهٔ عملیات نظامی خود می‌داند و تأسیسات نفتی این کشور را نیز هدف قرار خواهد داد.\n\nائتلاف به رهبری عربستان نیز اعلام کرده که در حملات متقابل به مواضع حوثی‌ها در یمن، چند سکوی پرتاب موشک این گروه را منهدم کرده است.\n\nتشدید حملات به ریاض در آستانهٔ برگزاری دو نشست مهم بین‌المللی در این شهر رخ می‌دهد. برگزارکنندگان کنگرهٔ جهانی نفت و نشست «ابتکار سرمایه‌گذاری آینده» روز شنبه اعلام کردند که این رویدادها طبق برنامه برگزار خواهند شد و کوشیدند به شرکت‌کنندگان دربارهٔ امنیت آن‌ها اطمینان دهند.\n\nبا این حال، اختلال در پروازها و هشدارهای امنیتی سفر برخی شرکت‌کنندگان را با مشکل روبه‌رو کرده است.\n\nشرکت لوفت‌هانزا پروازهای خود به ریاض را تا ۱۶ اکتبر تعلیق کرده و بریتانیا، فرانسه و آلمان نیز به شهروندان خود دربارهٔ سفر به پایتخت عربستان هشدار داده‌اند.\n@ VahidHeadline \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-10T16: ر باید پشتیبانی کند.\n ✅ برای کاربران معمولی: حالت خودکار \n۱. اتصال را قطع کنید.\n۲. در مسیرها / Routes ، انتخاب مسیر را روی خودکار بگذارید.\n۳. وارد ترافیک / Traffic ← پیشرفته / Advanced شوید.\n۴. Split the TLS handshake را روشن و گزینهٔ خودکار زیر آن را انتخاب کنید.\n۵. برای ECH نیز Encrypted Client Hello را روشن و زیر آن خودکار را انتخاب کنید.\n۶. به خانه برگردید و وصل شوید. هیچ کادر سفارشی را پر نکنید.\n ⚠️ هر قابلیت کجا کار می‌کند؟ \n• تقسیم TLS: روی MASQUE H2 و تونل بیرونی WireGuard over MASQUE / WOM .\n• ECH: فعلاً فقط روی MASQUE H3 .\n• این گزینه‌ها تنظیمات داخلی Psiphon یا Tor را تغییر نمی‌دهند.\n 🛠 تنظیم دستی تقسیم TLS \nدر ترافیک ← پیشرفته ، تقسیم TLS را روشن کنید:\n• Records / پیش‌تنظیم رکوردهای TLS: الگوی آماده؛ عدد لازم ندارد.\n• Compact / پیش‌تنظیم فشرده: الگوی آمادهٔ دیگری است.\n• Custom / سفارشی: مقدارها را خودتان وارد می‌کنید.\nمقدارهای پیش‌فرض بخش سفارشی:\n ▫️ اندازهٔ قطعه: 16-32\n ▫️ تأخیر: 2-10\n ▫️ تقسیم در محل نام سرور: روشن\n16-32 یعنی اندازه از بازهٔ ۱۶ تا ۳۲ بایت انتخاب شود. 2-10 یعنی تأخیر بین قطعات از بازهٔ ۲ تا ۱۰ میلی‌ثانیه انتخاب شود.\nاندازهٔ مجاز: 1 تا 16384 \nتأخیر مجاز: 0 تا 100 \nفقط عدد یا بازه را با اعداد انگلیسی وارد کنید. این مقدارها تضمین اتصال نیستند؛ قطعات خیلی کوچک یا تأخیر زیاد می‌توانند اتصال را کند کنند.\nبرای انتخاب مشخصِ H2 یا WOM، در مسیرها ← خودم انتخاب می‌کنم ، مسیر شامل Aether را انتخاب کنید؛ سپس در پیشرفته ← پروتکل ، H2 یا WOM را بگذارید.\n 🔐 تنظیم ECH \nبرای بیشتر کاربران، خودکار کافی است؛ برنامه تلاش می‌کند تنظیمات لازم را دریافت کند.\n سفارشی / Custom را فقط وقتی انتخاب کنید که یک ECHConfigList معتبر و سازگار با سرور، با فرمت Base64 از پشتیبانی دریافت کرده‌اید. خود رشته را بدون عنوان ech= یا کوتیشن در کادر بچسبانید.\nآدرس IP، نام دامنه و کلید وایرگارد برای این کادر کاربرد ندارند. اگر رشته را ندارید، حالت خودکار را انتخاب کنید.\nبرای انتخاب دستی H3:\n مسیرها ← خودم انتخاب می‌کنم ← مسیر شامل Aether ← پیشرفته ← پروتکل ← MASQUE H3 \nH3 به عبور UDP نیاز دارد؛ ECH به‌تنهایی مسدودبودن UDP را حل نمی‌کند. همچنین روشن‌ ا بررسی می‌کند. مسیر موفق برای همان شبکه ذخیره می‌شود تا اتصال بعدی از آن شروع شود. آدرس ذخیره‌شدهٔ WARP هم پیش از انتظار برای دریافت دوباره از API امتحان می‌شود.\n\n 🔹 تنظیم دستی کنار حالت خودکار\nدر «ترافیک ← پیشرفته»:\n• «تکه‌تکه کردن دست‌دهی TLS»: پیام آغاز اتصال را به قطعات کوچک‌تر تقسیم می‌کند. حالت خودکار، Records، Compact یا تنظیم سفارشی دارد. در حالت سفارشی اندازهٔ قطعه، تأخیر و تقسیم نام سرور را تعیین کنید؛ مثلاً اندازهٔ 16-32 بایت و تأخیر 0-1 میلی‌ثانیه. این اعداد فقط نمونهٔ ورودی هستند.\n• «سلام اولیهٔ رمزگذاری‌شده / ECH»: نام سرور را در بخش رمزگذاری‌شدهٔ ClientHello قرار می‌دهد. دریافت خودکار یا واردکردن ECHConfigList با فرمت Base64 در دسترس است؛ این مقدار، نام دامنه یا SNI نیست.\n\nتقسیم TLS روی H2، از جمله تونل بیرونی WOM، اعمال می‌شود؛ ECH فعلاً مخصوص H3 است. تنظیمات سفارشی در تلاش‌های بازیابی حفظ می‌شوند و تغییرشان با اتصال بعدی اعمال می‌شود.\n\n 🔹 رفع باگ‌های اتصال و تغییر پروفایل\nتونلِ در حال آماده‌سازی پس از شکست یا لغو اتصال بسته می‌شود. هنگام تغییر پروفایل، موتور قبلی کامل متوقف می‌شود تا پاک‌سازی آن اتصال جدید را خراب نکند. خطای تنظیمات ناقص هم پیش از روشن‌شدن VPN بررسی می‌شود.\n\nاگر در Aether + Psiphon پیام «اشتراک یا نود اضافه کنید» می‌دید، در «مسیرها» گزینهٔ «فقط مسیرهای انتخاب‌شده / Use carriers only» را بزنید. این گزینه زنجیرهٔ خروجِ بدون نود را خاموش می‌کند و ترکیب انتخاب‌شدهٔ شما را نگه می‌دارد؛ خودِ Aether + Psiphon به اشتراک نود نیاز ندارد.\n\n 📥 دانلود نسخهٔ جدید:\n https://github.com/WhiteDNS/WhiteAestherMobile/releases/tag/v1.11.0 \nاگر معماری دستگاه را نمی‌دانید، APK نسخهٔ universal را انتخاب کنید.\n @whitedns", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-10T15:52:09+00:00", "published_epoch": 1791647529, "rtl": true, "raw_media_urls": ["https://cdn5.telesco.pe/file/Az_dYODop6PoOZwkecRUS7SKSsGRRGIwVb0Auiwbh952Zw8TvUy-uRwB0fSwdtTSGeKqzHJnxsqAOYW4sQAx4eYDwdL2WuxbJAaoj3XkhWw91lry7Z6npPJoMPUQuBbcZiTe0IBQqA_B5C         const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
