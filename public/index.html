 دهند که اساسا چرا جنگ را آغاز کردند و خود و دنیا را درگیر مشکل و گرفتاری کردند.»\nپزشکیان افزود: «ما می‌دانیم که جنگ نه به نفع ما، نه به نفع منطقه و جهان و نه حتی به نفع آمریکا است. برای هرگونه مذاکره، ابتدا باید فشارها، تهدیدها و تحریم‌ها را بردارند.»\nاو گفت: «ملت ما امروز به آمریکا اعتماد ندارد و معتقد است اگر مذاکره کنیم، دوباره به ما حمله خواهند کرد. مدام در رسانه‌ها تبلیغ می‌کنند که می‌خواهند به کشور ما حمله کنند تا مردم ما را بترسانند، در حالی که ملت ما از شهادت هراسی ندارد.»\nپزشکیان خطاب به فرمانده ارتش پاکستان افزود: «شما به عنوان برادران مسلمان ما باید به آنها بفهمانید که با مسلمانان این‌گونه برخورد نمی‌کنند. ما نمی‌خواهیم به کسی زور بگوییم، اما زیر بار زور نمی‌رویم.»\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-20T21:38:38+00:00", "published_epoch": 1792532318, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/uT7O5bZzOXgMm_MynKUJ7QGzo-4ztWS5-TjaBRbWhIkRoCiEFXSzffUy45YCuguutGauwYzNtFvKVB0uTrIkLjx3NtZAvvDtnj3Aixg4PeK6mnToJN86pbADxUELm9r4j9u_91CYD-Ra32GAGKXsqxfjg31vMAJ-qjw72UDhmxkETsceGzXFiMH6IXwfcn1DD5YA1UDWooD8d2ZRX_sJXto3VyDnLX9PqJC4uYWFF-sgOqpvvF9TLYbS3Dx4iHugx_vD9_OL25vjIICvTtg55ExzLeG5USeewAhJezCK2OvS9w7LcDDPHAqsUaTsVJeaw0npHeCp_SPxo0CWCp98bg.jpg"], "local_media_path": "media/2026-10-20/2a84996faf85c315.jpg"}, {"hash": "79561a8edf40ef3d", "title": "تقویت آرایش جنگی واشینگتن در برابر تهران؛ ناو هواپیمابر روزولت هم راهی منطقه شد", "link": "https://www.iranintl.com/202610206297", "summary": "فاکس‌نیوز به‌نقل از دو مقام آمریکایی گزارش داد که ناوگروه ناو هواپیمابر تئودور روزولت و یگان سیزدهم اعزامی تفنگداران دریایی راهی خاورمیانه شده‌اند و به این ترتیب بار دیگر شمار ناوهای هواپیمابر آمریکا در منطقه به سه فروند افزایش خواهد یافت.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-10-20T21:36:34+00:0         return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
