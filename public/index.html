نه قرار دارد.\nروبیو افزود: «در لبنان بی‌ثباتی وجود دارد، چون ایران از حزب‌الله حمایت می‌کند. عربستان سعودی هدف حمله قرار می‌گیرد، چون ایران از حوثی‌ها حمایت می‌کند. عراق نیز کشوری است که با چالش روبه‌روست، زیرا شبه‌نظامیان مورد حمایت ایران، حکومت این کشور را به چالش می‌کشند.»\nاو افزود: «به هر طرف که نگاه کنید، یکی از نیروهای نیابتی ایران را می‌بینید که صلح و ثبات خاورمیانه را تضعیف می‌کند.»\nروبیو همچنین با اشاره به سرکوب مردم در ایران گفت: «این رژیمی است که مردم خودش را قتل‌عام کرده است. فقط می‌توانید تصور کنید که اگر به سلاح‌های کشتار جمعی دست پیدا کند، با دیگران چه خواهد کرد.»\nوزیر خارجه آمریکاادامه داد: «جمهوری اسلامی در حال منفجر کردن کشتی‌هاست؛ از جمله کشتی‌هایی که برای مثال، ملوانان هندی در آن‌ها حضور دارند.»\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-31T17:24:52+00:00", "published_epoch": 1793467492, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/H1jT6_RBMKG8wOLzsSPHhBdHGQos16rLrVI7hG2PAWHNOfpDrnjvnk0Tqq6WBj8Qe4_h-L91Y3MgcR0yYtDyFKkFAbHuu1DfTD-Ydp6RRaJpi8TC7w1XTUyiL4XDCZxH_tCvgg3NJUxwIDxvt4itk8URAvKFbmgyiV4jeQIzsy_9FYsoNcKpEKTR8sMKZKhVol-C_aV96V42ibPj9xDaEWPb5VhhbfZuSx298m7pwhfKi-7C6Q0NmYvnxMsNjS8noud3gkRe2k4wEZk99jlel4SsIABBia4W6U2SLVgXwNnWp8rJx4oWgesYfdobBOlfHerFgME8-qj6tTdMOW0OAQ.jpg"], "local_media_path": null}, {"hash": "ca57b16a19508582", "title": "Binance says it has covered 90% of losses from $6.3 billion hack so far - Reuters", "link": "https://news.google.com/rss/articles/CBMimgFBVV95cUxQV05QRmVQbjJDUTZkNzRFaTA5VVp5RE9Bd2ctMkxITEVaZnNLZVVzdkx5aHBUUFZYOTJCb19YRFJRM2I1RW5QS0JJUmowaUtsVjlnaTExaWJDM2NsLVJINlJQZ0JHdlUyb05LS0kyRGdRMHlyVWdYRHFJOTNlbFRZc0plbkc2SE1nOHB1SklPVVNUVnhFY3lYdWtR?oc=5", "summary": "Binance says it has covered 90% of losses from $6.3 billion hack so far    Reuters", "source_id": "reuters_wire", "source_name": "Reuters Wire", "source_name_fa": "خبرگزاری رویترز", "     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
