, "title": "تقریبا هر روز کامنت‌هایی شبیه این می‌بینم؛ هم درباره ابزارهای WhiteDNS و هم درباره پروژه‌هایی که بقیه دارن روشون کار می‌...", "link": "https://t.me/whitedns/2017", "summary": "تقریبا هر روز کامنت‌هایی شبیه این می‌بینم؛ هم درباره ابزارهای WhiteDNS و هم درباره پروژه‌هایی که بقیه دارن روشون کار می‌کنن.\n\nمی‌خوام یه موضوع رو خیلی شفاف و قاطع بگم:\n\nبله، ما بخش زیادی از کد ابزارهای WhiteDNS رو با کمک هوش مصنوعی می‌نویسیم. نه از گفتنش خجالت می‌کشیم، نه دلیلی برای پنهان کردنش داریم.\n\nاما پشت این ابزارها فقط چند تا پرامپت و خروجی هوش مصنوعی نیست.\n\nپشتش سال‌ها تجربه مهندسی نرم‌افزار، دانش شبکه، ساعت‌ها تحقیق، آزمون و خطا، رفع باگ و تست با کمک آدم‌های مختلفه.\n\nهوش مصنوعی می‌تونه کد بنویسه، اما قرار نیست به‌جای ما تصمیم‌های فنی بگیره، مشکلات شبکه رو درک کنه یا مسئولیت نتیجه نهایی رو بپذیره. این مسئولیت با ماست.\n\nو حتی اگر تمام این کدها با هوش مصنوعی نوشته شده بودن، باز هم یه واقعیت تغییر نمی‌کرد:\n\n ‼️ این ابزارها دارن مشکل واقعی آدم‌های واقعی رو حل می‌کنن. \n\nما هیچ‌وقت ادعا نکردیم بهترین برنامه‌نویس‌های دنیا هستیم یا ابزارهایی که می‌سازیم بی‌نقصن. اتفاقا همیشه جا برای بهتر شدن هست.\n\nنقد فنی، گزارش باگ و پیشنهاد برای بهبود رو با آغوش باز می‌پذیریم. اما اینکه تنها معیار قضاوت درباره یه محصول این باشه که «با هوش مصنوعی ساخته شده»، نه نقد فنیه و نه نگاه درستی به نرم‌افزار.\n\nارزش یه ابزار رو کیفیت، کارایی و مشکلی که حل می‌کنه مشخص می‌کنه؛ نه اینکه چند درصد کدش رو انسان تایپ کرده.\n\nاز روز اول هدف ما توی WhiteDNS کمک کردن بوده و هنوز هم همینه. نه دنبال اثبات خودمون به کسی هستیم، نه دنبال گرفتن تایید از همه.\n\nتا وقتی این ابزارها به درد مردم می‌خورن، به توسعه و بهتر کردنشون ادامه می‌دیم.\n\nآخرش چیزی که برای ما اهمیت داره، نتیجه‌ایه که به دست مردم می‌رسه، نه قضاوت درباره ابزاری که باهاش اون نتیجه رو ساختیم.", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-17T07:56:24+00:00", "published_epoch": 1792223784, "rtl": true, "raw_media_url     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
