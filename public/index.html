https://t.me/IranintlTV/366215", "summary": "دونالد ترامپ پس از دیدار با نخست‌وزیر قطر در کاخ سفید اعلام کرد قطر، عربستان سعودی، امارات متحده عربی، بحرین، کویت و دیگر کشورهای منطقه خواهان ادامه محاصره دریایی تنگه هرمز و عملیات دروازه آهنین هستند.\n\nترامپ افزود این کشورها درباره جلوگیری از دستیابی جمهوری اسلامی به سلاح هسته‌ای اتفاق نظر دارند. او همچنین از پیشرفت در مسیر پایان جنگ خبر داد و گفت آمریکا همچنان برای اقدام نظامی آماده است، اما در شرایط کنونی احتمال آن را پایین می‌داند.\n\nگفت‌وگو با امیر گیتی، عضو تحریریه ایران‌اینترنشنال\n @iranintltv", "source_id": "tg_IranintlTV", "source_name": "@IranintlTV", "source_name_fa": "@IranintlTV (ایران اینترنشنال (تلگرام))", "category": "telegram", "published_at": "2026-11-09T23:55:47+00:00", "published_epoch": 1794268547, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/tz6yrhc6EO04pATa6GocyiBPOw4QgKgude0TIZewzmh0HiZRJiDjjt2ECKyX78ow6B8oIHRnj8qWPhipHDLVGMj1QcbyGjPeebI3LVtrkkTGqULwAXxgX63R_yLdlRgd9BiJHL3Q3KNyAD_hiCY3QDiuvfpzlByjwT5IQfQsLPrggO4MrdeCfqHjDpdfMNz-hjmhUg54JjOTfJ_PQ0p5LB_HF6pX--4LSUkdDAaE1rP6r4jGYM-fL5_Oq3u6pOJhb0gpFNTGf0B05vEJTD_b81icgfFt02LsjvgcB7qTMafpAxfVAt75kDwRU8KVrAu9_ODIxru-302mfZszJsun5A"], "local_media_path": "media/2026-11-10/6c12acd9a1b78c67.jpg"}, {"hash": "c5dfe39b51c7b3c8", "title": "بخش‌های مربوط به ایران در سخنان ترامپ", "link": "https://t.me/VahidOnline/79052", "summary": "بخش‌های مربوط به ایران در سخنان ترامپ\nبا تشخیص و ترجمه ماشین\n\n 🔻 ترامپ: عملاً از بین رفته‌اند. توان تولیدی‌شان به‌شدت کاهش یافته؛ البته هنوز می‌توانند تعداد محدودی موشک و پهپاد بسازند، اما حدود ۸۵ درصد این توان از بین رفته است.\n\nو دارند با ما گفت‌وگو می‌کنند؛ آن هم با لحنی بسیار مؤدبانه. ببینیم چه می‌شود، اما احتمال زیادی هست که این درگیری پایان پیدا کند.\n\nپس در پایان این عملیات نظامی، مردم آمریکا و مردم جهان بسیار امن‌تر از آن چیزی خواهند بود که در سال‌های طولانی گذشته بوده‌اند؛ چون ایران افراد زیادی را می‌کشت.\n\nمی‌دانید، آن جنگ در سال ۱۹۷۹ آغاز شد. ما جنگ را شروع نکردیم؛ آن‌ها شروع کردند. حتی اگر به ماجرای ناو کول برگردید، آن هم کار خودشان بود و افراد زیادی در آن ماجرا و موارد دیگر کشته شدند.\n\nآمریکایی‌های زیادی کشته شدند. آدم‌های زیادی در سراسر جهان کشته شدند.\n\nو اگر فقط هفت یا هشت ماه اخیر را در نظر بگیرید، دست‌کم ۷۵ هزار معترض کشته شده‌اند.\n\nپس جای وحشتناکی است؛ اما ما فکر می‌کنیم اوضاع نسبتاً خوب پیش می‌رود. ببینیم چه اتفاقی می‌افتد.\n\nهیچ تضمینی نمی‌دهم، اما اگر مجبور شویم دوباره وارد عمل شویم، کاملاً مسلح و آمادهٔ اقدام هستیم.\n\n 🔺 خبرنگار: \nآقای رئیس‌جمهور، شما در جریان کارزار انتخاباتی گفته بودید که جلوی ایران را برای دستیابی به سلاح هسته‌ای گرفته‌اید. پس چرا رسماً پایان درگیری را اعلام نمی‌کنید و آن را تمام نمی‌کنید؟\n\n 🔻 ترامپ: چون ما متحدان بسیار خوبی در آن منطقه داریم و باید مطمئن شویم آسیبی نمی‌بینند. وگرنه آسیب خواهند دید.\n\nآن‌ها اکنون بسیار امن‌تر از شش ماه پیش هستند، چون ساختار رهبری ایران تا حد زیادی از هم پاشیده است.\n\nاما ایران هنوز هم تا حدودی گردن‌کلفتِ خاورمیانه است و من این را می‌بینم.\n\nمی‌خواهیم مطمئن شویم متحدانمان در امان‌اند. می‌خواهیم مطمئن شویم این راه‌حل بلندمدت است، نه فقط کوتاه‌مدت.\n\nآن‌ها هرگز سلاح هسته‌ای نخواهند داشت؛ اما باید مطمئن شویم این وضعیت در بلندمدت برقرار می‌ماند.\n\nپس جنگ به‌سرعت رو به پایان است، اما می‌خواهیم مراقب کسانی باشیم که طی سال‌ها با ما بسیار خوب رفتار کرده‌اند.\n\n 🔺 خبرنگار: \nآقای رئیس‌جمهور، شما می‌گویید جنگ با ایران به‌زودی پایان می‌یابد.\nاین ادعا را در هشت ماه گذشته ده‌ها بار مطرح کرده‌اید. چرا آمریکایی‌ها باید این بار باور کنند که جنگ تمام می‌شود؟\n\n 🔻 ترامپ: نه، من گفتم که آن‌ها سلاح هسته‌ای نخواهند داشت. و سلاح هسته‌ای هم نخواهند داشت.\n\nوقتی یک سال پیش آن‌ها را از پا درآوردیم، همان کاری بود که گفته بودم انجام می‌دهم؛ و من به قولم عمل کردم.\n\nحالا کاری که انجام می‌دهیم این است که... در واقع وضعیت را به همین شکل نگه داشته‌ایم. داریم همین روند را ادامه می‌دهیم.\n\nبزرگ‌ترین محاصرهٔ نظامی تاریخ را برقرار کرده‌ایم. عملیات جدید «دروازهٔ آهنین» را هم داریم.\n\nدروازهٔ آهنین مربوط به مسیرهای زمینی است؛ پس هم از خشکی و هم از دریا اقدام می‌کنیم و کار را یکسره خواهیم کرد.\n\nببینید، امیدوارم بتوانیم با ایران به توافق برسیم، اما فعلاً اتفاقی نمی‌افتد.\n\nو اگر لازم شود، اقدامات بسیار جدی انجام خواهیم داد.\n\nما از نظر تجهیزات کاملاً آماده‌ایم. یک ناو هواپیمابر دیگر هم داریم. این ناو تا خرخره پر است از تجهیزات زیبا و کاملاً نو.\n\nاکنون بیش از هر زمان دیگری در تاریخ کشورمان تجهیزات و مهمات نظامی تولید می‌کنیم. کارخانه‌های بیشتری ساخته‌ایم و در حال ساختن هستیم.\n\nسامانه‌های پاتریوت جدید می‌سازیم. موشک‌های تاماهاوک و سامانه‌های تاد جدید می‌سازیم و اکنون بیش از هر زمان دیگری در حال ساخت تجهیزات نظامی هستیم.\n...\n\n 🔻 ترامپ: ... \nاما واقعاً هگست چه کرده؟ او در جنگ پیروز شده. فرماندهی را بر عهده داشته.\n\nدر جنگ ونزوئلا پیروز شده. همان‌طور که گفتم، در ۴۸ دقیقه. عملیات بی‌نقص بود؛ هیچ‌کس کشته نشد.\n\nو قطعاً، فکر می‌کنم در جنگ ایران هم پیروز شده؛ دست‌کم دارد در جنگ پیروز می‌شود.\n...\n\nحالا می‌گویند: «بیایید استیضاحش کنیم!»\n\nپس استیضاح دیگران چه می‌شود؟\n\nآن فرد دولت بایدن را چه می‌گویید؛ کسی که دو هفته ناپدید شد و هیچ‌کس نمی‌دانست کجاست؟\n\nچرا کسانی را استیضاح نمی‌کنید که جنگ ویتنام را اداره کردند؟\n...\nبیشتر در ویدیوی بالا\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-09T23:51:54+00:00", "published_epoch": 1794268314, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/QtzddKl5Y1-wfsJVmk2PO9enMBmwJ7s9iRWRQE8c8MDIg-V9tt70G5k5nmAqXwli098ummyCWTT8OSKMQ2QhAZPp9fvdq1gK0UtbX4F1UM-tinzgzY5tefChPZrD5rwk4qbIjVc9zOujMG8eZfUI5jez0JzRwiiAQR0noFHzu_tm0CxUZPWufy30rJqrk3hQvEW9f--df_136nMvqo-C1I7MyCBbieq9kfUo3jUR6hK6qbI5OOgg3HcSPOZBzuRXxuHrVZYGQ4YDmXOuolNVMpwi9BbChtPCRLJ7rGOo7gfi5ydZOD6O9R9M7iz1-ltuy9LQYRbHNZJoXlzLRjtnvQ"], "local_media_path": "media/2026-11-10/e522d1974a634a9e.jpg"}, {"hash": "335abff423fd1a98", "title": "خبرگزاری دولتی عراق گزارش داد که این کشور از روز جمعه گذرگاه مرزی مندلی با ایران (در مجاورت سومار کرمانشاه) را به‌طور مو...", "link": "https://t.me/IranintlTV/366214", "summary": "خبرگزاری دولتی عراق گ     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
