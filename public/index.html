پوشاک، تولیدی‌ها و مزون‌ها شد و دستور داد واحدهای فاقد مجوز به‌سرعت شناسایی و با آنها برخورد قانونی شود.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-10-30T12:00:00+00:00", "published_epoch": 1793361600, "rtl": true, "raw_media_urls": ["https://i.iranintl.com/images/rdk9umy0/production/648be200ebd8608ddc27aeedb7f6e97300f4453c-450x291.png?rect=0,28,450,236&w=1200&h=628&fm=jpg&q=85&fit=max&auto=format"], "local_media_path": "media/2026-10-30/73344fa512eda3c4.jpg"}, {"hash": "1f72f91e2071307d", "title": "گروه مالی پاسارگاد هم‌زمان با روز کوروش: یا پوشش اسلامی موردپسند مدیرعامل یا اخراج", "link": "https://t.me/VahidOnline/78907", "summary": "گروه مالی پاسارگاد هم‌زمان با روز کوروش: یا پوشش اسلامی موردپسند مدیرعامل یا اخراج \n\nپانزده کارمند شرکت «پاد» سه‌شنبه پنجم آبان در جریان بازدید مجید قاسمی، مدیرعامل بانک پاسارگاد، شغل‌شان را از دست دادند؛ چهارده زن به‌دلیل رعایت نکردن حجاب اجباری و یک مرد به‌دلیل پوشیدن شلوار جین.\n\nقاسمی همان‌جا دستور اخراج آن‌ها را صادر کرد و همان روز مدیرعامل شرکت را نیز برکنار کرد. \nچند ساعت بعد، پیام به کارکنان شرکت‌های دیگر مجموعه رسید: فردا با پوشش تعیین‌شده بیایید، وگرنه اجازه ورود ندارید.\n\nبرای کارکنانی که تا روز قبل بدون مانتو و حجاب اجباری در محل کار حاضر می‌شدند، این پیام به معنای تغییر ناگهانی شرایط کار بود. حالا باید مقنعه و لباس اداری تهیه می‌کردند، کفش‌هایشان را تغییر می‌دادند و خود را با دستور تازه تطبیق می‌دادند؛ یا صبح پشت در شرکت می‌ماندند.\n\nایران‌وایر همچنین مطلع شده است که به کارکنان برخی شرکت‌های مجموعه، از جمله پاد، ده میلیون تومان برای خرید لباس مورد نظر هلدینگ پرداخت شده است. وعده کمک‌هزینه‌ای که در تصویر دستورالعمل دیده می‌شود، در برخی شرکت‌ها به پرداخت رسیده؛ همراه با الزامی که ورود به محل کار را به پوشش کارکنان گره می‌زند.\n\nروایت پاسارگاد، نشانه‌ای از گسترش فشار برای تحمیل پوشش حکومتی به محل تامین معاش است. در این سازوکار، مدیریت و حراست شرکت‌ها می‌توانند با جلوگیری از ورود، اجبار به گرفتن مرخصی و تهدید به اخراج، هزینه انتخاب پوشش را به درآمد و امنیت شغلی پیوند بزنند.\n\n هزاران کارمند زیر سایه یک تصمیم \nپاسارگاد فقط یک بانک با تعدادی شعبه نیست. گروه مالی پاسارگاد، شبکه‌ای از شرکت‌ها و هلدینگ‌های فعال در بانکداری، بیمه، فناوری اطلاعات، معدن، انرژی و ساختمان است. فناپ، میدکو و گسترش انرژی پاسارگاد از اعضای این گروه‌اند و خود نیز شرکت‌های زیرمجموعه دارند.\nآمار تجمیعی و به‌روز کارکنان تمام گروه در منابع بررسی‌شده روشن نیست؛ اما در اسفند۱۴۰۱، تفاهم‌نامه‌ای برای بیمه تکمیلی بازنشستگی چهل هزار نفر از کارکنان گروه مالی پاسارگاد امضا شده است. این عدد، شمار کارکنان امروز مجموعه نیست، اما مقیاس چندده‌هزارنفری اشتغال در آن را نشان می‌دهد. ...\n iranwire \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-30T11:59:38+00:00", "published_epoch": 1793361578, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/Ik7uiCBeiUpijnfgtpFcFnZ1Ra0LuoQ4ps5xSVw8gvKUfwq9CA9PEPMQ-u8h3fzl7ACN6Va5aqeOQ5mueT0MzqB03BqWECsHe_1Awx8GbLXBTSpMLYuIVZxiYTcLVh8mjB7dmNnH9ok3jZZ3Dj1zlnCrAVHTh3ZJ6lMjlwE2E9ZxdpKqHTtanC4uL8D3jzr1eLx-12Alc2zHp50AxWYi0O7srHlRn5uHouoOqNQw8_sbcr1OebHYjMoUH_2MI0QNp6tiS9aQjiGY2Dqf9h5JEY1DIxymTmY3U3wCBkpTdXVnrjofSK9nkHK3gW5EKvO1nbu-tie19OCwqXgnyOeH0g.jpg"], "local_media_path": "media/2026-10-30/6ae2b333572618be.jpg"}, {"hash": "41abb90d4c3a61a3", "title": "حمله هکرها به بزرگ‌ترین صرافی رمزارز جهان؛ پای ۶ میلیارد دلار در میان است", "link": "https://www.bbc.com/persian/articles/c9kgjp54pyxgo?at_medium=RSS&at_campaign=rss", "summary": "بایننس، بزرگ‌ترین صرافی رمزارز جهان، اعلام کرده است که در بررسی حمله سایبری گسترده به سامانه‌های این شرکت، چندین راه نفوذ هکرها را شناسایی کرده است. در این حمله که احتمال می‌رود بزرگ‌ترین سرقت رمزارز در تاریخ باشد، دارایی‌هایی به ارزش شش میلیارد و ۳۰۰ میلیون دلار تحت تأثیر قرار گرفته‌اند. بایننس می‌گوید تاکنون حدود سه میلیارد دلار از دارایی‌های مرتبط با حمله را مسدود کرده، بازیابی بخشی از آنها را ...", "source_id": "bbc_per la-agents setup\nnpx bla-agents harden .\n\nبحث‌های پیرامونش چیه؟ \n1- خود ریپوی BLA متن‌بازه، پس می‌شه دادش به یه AI تا تله‌هاش رو یاد بگیره؛ و 2- اگه کسی مدل لوکال اجرا کنه، سوختن توکن دیگه هزینه‌ای نداره و عملاً فقط GPU طرف بیشتر کار می‌کنه؛ یعنی جلوی مهندسی معکوس رو نمی‌گیره، فقط کند و گرونش می‌کنه. یه عده هم کلا بدبینن و می‌گن همچین ابزاری بیشتر به درد فروشنده‌های نرم‌افزار می‌خوره تا کاربرها.\n\nپروژه: github.com/qybaihe/bla \n 🔗 منبع \n\n ✉️ t.me/MatinSenPaii", "source_id": "tg_MatinSenPaii", "source_name": "@MatinSenPaii", "source_name_fa": "@MatinSenPaii (متین سنپای (شبکه و فیلترشکن))", "category": "telegram", "published_at": "2026-10-30T10:11:02+00:00", "published_epoch": 1793355062, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "6b0e866f82f6ffb2", "title": "جنگ مشترک، پایان متفاوت؛ چرا اسرائیل از توافق سریع ترامپ با ایران نگران است؟", "link": "https://parsi.euronews.com/2026/10/30/trump-netanyahu-iran-war-different-goals-israel-fears-quick-us-deal-with-tehran", "summary": "برای اسرائیل، نگرانی از دور تازه جنگ با ایران فقط به زمان آغاز حملات یا پاسخ تهران محدود نمی‌شود؛ پایان سریع عملیات با توافقی میان واشنگتن و تهران نیز می‌تواند مسئله‌ساز باشد.", "source_id": "euronews_persian", "source_name": "Euronews Persian", "source_name_fa": "یورونیوز فارسی", "category": "persian", "published_at": "2026-10-30T10:07:16+00:00", "published_epoch": 1793354836, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "8afa7059506d4950", "title": "Azure's Weakest Link – Five Full Cross-Tenant Compromises", "link": "https://www.binarysecurity.no/posts/2026/10/one-root-case", "summary": "Article URL: https://www.binarysecurity.no/posts/2026/10/one-root-case \n Comments URL: https://news.ycombinator.com/item?id=50301854 \n Points: 19 \n # Comments: 0", "source_id": "hacker_news", "source_name": "Hacker News", "source_name_fa": "هکر نیوز (تکنولوژی و امنیت)", "category": "tech", "published_at": "2026-10-30T10:06:15+00:00", "published_epo     }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
