شبهات جدی در مورد تحقیقات، توسط شعبه رسیدگی‌کننده در دیوان عالی کشور نقض شده بود؛ ولی شعبه مذکور بدون انجام تحقیقات مورد نظر دیوان عالی، صرفا با تغییر عنوان اتهامی، خانم مرادی را مجددا به اتهام عضویت در گروه باغی به اعدام محکوم کرد.\n\nامیر سجادی با بیان اینکه «به باور وکلا دلایل کافی و متقن برای انتساب چنین اتهامی به وریشه مرادی وجود ندارد» تاکید کرد: «خانم مرادی مطلقا در هیچ عملیاتی علیه جمهوری اسلامی مداخله نداشته و فعالیت‌های او صرفا مربوط به مبارزات نامبرده علیه داعش در شمال سوریه بوده است.»\n\nکیوان عزیزی هم با تاکید بر فرجام‌خواهی وکلای وریشه مرادی در مهلت قانونی ابراز امیدواری کرد «دیوان عالی کشور، همچون مرتبه‌ی پیشین، به دفاعیات و ایرادات، توجه کافی داشته باشد.»\n\nوریشه مرادی که در حال‌حاضر در زندان اوین محبوس است، ۱۰ مرداد ۱۴۰۲ در حومه سنندج بازداشت شد، و در تاریخ ۵ دی همان سال با اتمام مراحل بازجویی از بازداشتگاه وزارت اطلاعات موسوم به بند ۲۰۹ زندان اوین به بند زنان این زندان منتقل شد.\n\nاو ۲۰ آبان ۱۴۰۳ توسط شعبه ۱۵ دادگاه انقلاب تهران به اتهام «بغی» (قیام مسلحانه علیه حکومت) به اعدام محکوم شد. وی در نامه‌ای سرگشاده از زندان فاش کرد که در طول بازداشت تحت شکنجه‌های جسمی و روانی، تهدید به اعدام، و خشونت‌های جنسیتی قرار گرفته است.\n@ VahidHeadline \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-14T20:45:28+00:00", "published_epoch": 1792010728, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/VyJWJ7DH1aFVqwogzBZ-uf9vx8dHUTQhloyRDAwdCn2q8-zqQy6Iad8uC2FyBtuWoIIJvkzx82O6Qk8Bdwt1vi_K159yiyiHEjLe7djWC5qqNdQyGACyKYZsupulBc7vdMbVpUsVHQTxpim1tVbnnCAuAQu7-QawyZsAaXI6li8vubk9NMRSFwKb8GvOF0GvD5czz7Y4E1oSD4CIvdm8xn7viinglrviCWuMkmH9EnMhBlW4NnIRwA6wo92tXBvwd0oUEZ0Ai5W_RHOxD-WHVcu_or4e9UJxakfhSUn1g-L--HGMKv7SWLsfhndoihR-1hdr_eP2P-V8uDsilDgLMw.jpg"], "local_media_path": null}, {"hash": "9c5b4ee39cb5a9ac", "title": "Eight US states sue OpenAI, claiming ChatGPT harms young users - Reuters", "link": "https://news.google.com/rss/arti     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
