 «طرد اقتصادی» نیز هیچ نفتی در کشتی‌ها بارگیری نشده است، رژیم تلاش می‌کند میلیاردها دلار از درآمدهای نفتی خود را از این امین‌های نفتی پس بگیرد.\n\nدر بسیاری از موارد، این امین‌های فاسد درآمد حاصل از فروش نفت را برای منافع شخصی خود نگه داشته‌اند. \n USTreasury \nآپدیت: ویدیوی بالا:\n«برای نخستین بار در تاریخ، از زمانی که ایران تولید نفت را آغاز کرده، دیگر هیچ نفتی روی آب [در نفتکش‌ها] ندارد... آنچه شاهدش بوده‌ایم این است که جهان می‌تواند بدون نفت خام ایران به زندگی ادامه دهد...\n\nاجماع میان آمریکا، روسیه و چین در شنژن این است که ایران هرگز نباید به سلاح هسته‌ای دست پیدا کند و آزادی کشتیرانی در تنگه هرمز از اهمیت فوق‌العاده‌ای برخوردار است.»\n USTreasury \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-20T21:16:06+00:00", "published_epoch": 1795209366, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/DpHr-8zkXpx0DbxS3euI_m9wVWs3JG5CxbcdhPgd_LIProgHWjgpuq9bRbRF-oklhEjcSO_kjG6oulEDzeZiMRQNKNzdu3M2UVBnMHDHfstAZoO8zSZipsxr9PWdcS2fgYB1JE9r4F_mKajwZ-Jxp3imvDJpWN2HzyUyspfyYMuEtbZ6z5YpDKLXcBEK1-P-k2ow18RXvhpPqnvR-gdvcMVgg28mPHS4W0cZ2NZje0p1CXt98gV6CTVr7HgS4HotFkgis7zvlf93M1BLJ_Hgq52VzSUK8dycD6e60IOx0HcIX1JGxDV_pMXDHW0yciNjvwoEhb2bEeIuOgoXyzgnng"], "local_media_path": "media/2026-11-21/736bfa2ce4aca743.jpg"}, {"hash": "0b2d5c894d69900f", "title": "علیرضا فیروزجا، قهرمان نخستین دوره مسابقات توتال چس بوداپست شد", "link": "https://www.iranintl.com/202611208278", "summary": "علیرضا فیروزجا، شطرنج‌باز ایرانی‌تبار فرانسه با تساوی مقابل آنیش گیری در بازی تعیین‌کننده آرماگدون، قهرمان نخستین دوره آزمایشی مسابقات توتال چس بوداپست شد. فیروزجا با مهره‌های سیاه بازی می‌کرد و طبق قوانین آرماگدون، تساوی برای قهرمانی او کافی بود.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-11-20T21:15:45+00:00", "published_epoch": 1795209345, "rtl": true, "raw_med 3U2Tpb2zDsx233h4jVvn3eRCC3hCc8fx6vB4sdw_mFFVIeru-G_KhSP1XvgzVFu_7ITTukQiKaYtqGcTjTvMSGRIBFb5NwnMyLABPY_dalFjxI7iyyVrTf31XUANU9O2C2iGj9Mrgr7NKPqvD9P0haF_2JyvsBSVaWOMxHro7664eaZCZXAwcmGbCzgbOMtHh7WxlhIMJuHqX3LTjwwAs8Xef6ozrJE0GvwEgns6Yyxo5QJKvbN8pA.jpg"], "local_media_path": null}, {"hash": "37344ccd647fa0cb", "title": "دونالد ترامپ، رئیس‌جمهور آمریکا، روز جمعه ۲۹ آبان بار دیگر گفت جمهوری اسلامی خواهان توافق برای پایان جنگ با ایالات متحده...", "link": "https://t.me/VahidOnline/79189", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، روز جمعه ۲۹ آبان بار دیگر گفت جمهوری اسلامی خواهان توافق برای پایان جنگ با ایالات متحده است، اما حاضر نیست توافقی را امضا کند که برای او قابل قبول باشد.\n\nاو با تأکید بر اینکه واشینگتن به دنبال «توافقی واقعی» با تهران است، نه «توافقی ساختگی»، مقام‌های جمهوری اسلامی را متهم کرد که طی ۵۱ سال گذشته طرف‌های مقابل خود را فریب داده‌اند.\n\nاین در حالی است که او روز پنجشنبه در در سه مصاحبهٔ جداگانه اعلام کرد که برای تصمیم‌گیری دربارهٔ انجام حملات نظامی جدید علیه ایران عجله‌ای ندارد و به آغاز سال میلادی آینده به‌عنوان زمان احتمالی تصمیم‌گیری اشاره کرد.\n\nدونالد ترامپ در بخش دیگری از نشست خبری روز جمعه بار دیگر تأکید کرد که آمریکا به جمهوری اسلامی اجازه دستیابی به سلاح هسته‌ای نخواهد داد.\nاو گفت: «ما اجازه نمی‌دهیم آن‌ها سلاح هسته‌ای داشته باشند. ایران هرگز سلاح هسته‌ای نخواهد داشت؛ هرگز».\n\nرئیس‌جمهور آمریکا همچنین دربارۀ دیدار اخیر خود با ولادیمیر پوتین، رئیس‌جمهور روسیه، و شی جین‌پینگ، رئیس‌جمهور چین، گفت که موضوع جلوگیری از دستیابی ایران به سلاح هسته‌ای به‌طور مفصل در مذاکرات سه‌جانبه مطرح شده است.\nترامپ گفت: «به‌ویژه دربارۀ اطمینان از اینکه ایران هرگز سلاح هسته‌ای نخواهد داشت، به‌تفصیل گفت‌وگو کردیم».\n\nرئیس‌جمهور آمریکا در پاسخ به پرسشی دربارۀ اختلاف‌نظر احتمالی با جی‌دی ونس، معاون خود، بر سر پیامدهای جنگ ایران و تأثیر آن بر انتخابات اخیر آمریکا، از تصمیمش برای آغاز عملیات نظامی علیه جمهوری اسلامی دفاع کرد.\nاو گفت جنگ با ایران اجتناب‌ناپذیر بوده و اگر بار دیگر در موقعیت تصمیم‌گیری قرار بگیرد، همان اقدام را تکرار خواهد کرد.\n\nترامپ با ستای     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
