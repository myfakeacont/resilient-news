ت تایید برآوردهای اولیه، این حمله می‌تواند بزرگ‌ترین سرقت رمزارزی ثبت‌شده تاکنون باشد.\n«تتر» نزدیک به ۱.۵۷ میلیارد دلار و «سیرکل» بیش از ۸۰۰ میلیون دلار دارایی مرتبط با این حادثه را مسدود کرده‌اند. شرکت «ورلد لیبرتی فایننشال»، مرتبط با دونالد ترامپ و خانواده‌اش، نیز اعلام کرد برای مسدودکردن دارایی‌های سرقت‌شده با شرکت نگهداری رمزارز بیت‌گو همکاری کرده است. به گفته یی هه، ۲۷ میلیون دلار استیبل‌کوین و حدود دو میلیون دلار توکن ورلد لیبرتی مسدود شده است. شرکت ریپل نیز حدود ۲۰۰ میلیون دلار دارایی را مسدود کرد.\nبایننس اعلام کرد با نهادهای مجری قانون، صادرکنندگان توکن و شرکت‌های تحلیل بلاک‌چین برای ردیابی و مسدودکردن دارایی‌های بیشتر همکاری می‌کند و احتمال افزایش رقم سه میلیارد دلاری دارایی‌های مسدودشده وجود دارد.\nخبر رخنه امنیتی احتمالی بازار رمزارزها را نیز تحت تاثیر قرار داد. بیت‌کوین در معاملات اولیه روز جمعه حدود دو درصد کاهش یافت و به ۷۷ هزار و ۶۴۶ دلار، پایین‌ترین سطح شش هفته اخیر، رسید. اتریوم نیز حدود دو درصد افت کرد و به ۲ هزار و ۲۳۸ دلار رسید. ارزش توکن BNB نیز طی ۲۴ ساعت بیش از هشت درصد کاهش یافت.\nرویترز به نقل از میگل مورل، مدیرعامل شرکت تحلیل بلاک‌چین آرکام، گزارش داد داده‌ها نشان می‌دهند احتمالا میلیاردها دلار دارایی بایننس به دست یک عامل ناشناس سرقت شده است، هرچند علت دقیق حادثه هنوز تایید نشده است.\nبایننس بیش از ۳۳۵ میلیون کاربر ثبت‌شده در سراسر جهان دارد و بر اساس گزارش سالانه این شرکت، در سال ۲۰۲۴ حدود ۱۶۰ میلیارد دلار دارایی تحت نگهداری داشت. بایننس آمریکا، که یک صرافی جداگانه است، اعلام کرد تحت تاثیر این حادثه قرار نگرفته است.\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-30T01:10:01+00:00", "published_epoch": 1793322601, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/jNw-VzoIBaCxn3pNfwchinKRTeXIKxZsu_rVJu8RTNG0vtui_oqA6JtBoryzW87An86liF7eK4hwy1PhKnVOx7lpyEGRediypl3Ng8vmQRnnP56Iq5Rsy66h-9csFUBL6pJtt3q2RnteUlPezxhoRA9GwUybUBsAall6HJiFLebgXcHf_kBUZcL3R9-CUXCxEj38QbD7dq64SapUCJrMJAxP-82l     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
