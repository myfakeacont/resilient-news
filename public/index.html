لام شد که طی آن تصاویر طراحی ورزشگاه جدید هم رونمایی شد. پروژه با هدایت مالکان دو باشگاه پیش می‌رود؛ ردبرد کپیتال پارتنرز، مالک میلان، و اوک‌تری، مالک اینتر.\n\n 🔹️ ️️️️️طراحی ورزشگاه حاصل همکاری نورمن فاستر و دیوید مانیکا است؛ این دو معمار پیش از این نیز در طراحی ورزشگاه ومبلی لندن با یکدیگر همکاری کرده بودند.\n\n 🔹️ ️️️️️این پروژه اکنون وارد مرحله طراحی و برنامه‌ریزی خواهد شد. انتظار می‌رود عملیات ساخت در سال ۲۰۲۸ آغاز شود و در صورت دریافت مجوزهای لازم، نخستین مسابقه در فصل ۳۲-۲۰۳۱ در آن برگزار شود.\n\n @iranintltvsport", "source_id": "tg_IranintlTV", "source_name": "@IranintlTV", "source_name_fa": "@IranintlTV (ایران اینترنشنال (تلگرام))", "category": "telegram", "published_at": "2026-10-29T22:30:50+00:00", "published_epoch": 1793313050, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/jn8o7WLZPyv9JpAtvaUKeHP1PbzM36EIPYV8Zr-gsilwP8gqarRywOx1G3svCzjfuccBlqfh6gfmVt7QDcbUlIjBrNhwg1SwXJQfvRZJZLGmLUt67yHRA0tmkrtUbyt1MF7T_baKCwuGjpOJ6w0AOnIqXtAsSakd33KIRun1hJkjdAmG54Q9l6bjre17eAxvunvGZOpsh76lGMyngmvWtUZRVdoJlWriJoDag5JEbdvbNgxyMo5k85ClBSYAeqCimFpLMXDTSeWosv_cV9_FGDHcYrecmVZug95GxOfaNvDcWPSWnBzjvh7p9ymQU3WyvJv5hfVO1Luivi24YT2tQg.jpg"], "local_media_path": "media/2026-10-29/64595549458911a0.jpg"}, {"hash": "f4034736217cf01c", "title": "A Pig, the State, and War: Porco Rosso (Kurenai No Buta) (2014)", "link": "https://journal.animationstudies.org/article/id/66/", "summary": "Article URL: https://journal.animationstudies.org/article/id/66/ \n Comments URL: https://news.ycombinator.com/item?id=50297089 \n Points: 5 \n # Comments: 0", "source_id": "hacker_news", "source_name": "Hacker News", "source_name_fa": "هکر نیوز (تکنولوژی و امنیت)", "category": "tech", "published_at": "2026-10-29T22:26:38+00:00", "published_epoch": 1793312798, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "ac0b3471ad245ee9", "title": "بارسلونا پس از ثبت ۱۷ تخلف در ال‌کلاسیکو، جایگاه هواداران را تعطیل کرد", "link": "https://www.iranintl.com/202610292288", "summary ‌ای رسمی به کنفدراسیون فوتبال آسیا اعلام کرده است در صورت صادر نشدن اجازه پرواز به عمان برای بازی نفتچی ازبکستان در لیگ نخبگان آسیا، از حضور در این دیدار انصراف خواهد داد.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-10-29T20:49:12+00:00", "published_epoch": 1793306952, "rtl": true, "raw_media_urls": ["https://i.iranintl.com/images/rdk9umy0/production/7027dba35b117d526360278e08c5cbc200dd05d5-1280x1280.jpg?rect=0,455,1280,670&w=1200&h=628&fm=jpg&q=85&fit=max&auto=format"], "local_media_path": "media/2026-10-29/1e1d370729a9b114.jpg"}, {"hash": "630200d03cdf12be", "title": "Trump says Canada has been treating the US very nicely - Reuters", "link": "https://news.google.com/rss/articles/CBMiowFBVV95cUxNRXhEblVFMVZhRnB0UFN5Wk5LYkJtT0ZBeDV0R3lNMUF5Z1pjSUpxT3RYRUNROXN4Zk9XREN4SjkyWFdqVXF2WFMyZG45T3pZV2xuM2JveG52S3duUENqUXJTNno5RkdUWjk5Mjl2YWdLZlh4YjRSRkdJa2p3ZUNqQVJhRkVTcTk4U20tNHhUMHVoVlRKNVBVZGZJMjRTOTdScEtJ?oc=5", "summary": "Trump says Canada has been treating the US very nicely    Reuters", "source_id": "reuters_wire", "source_name": "Reuters Wire", "source_name_fa": "خبرگزاری رویترز", "category": "wire", "published_at": "2026-10-29T20:45:07+00:00", "published_epoch": 1793306707, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "9baad7a8e693b731", "title": "A tiny world model running games on a Raspberry Pi Pico 2 W", "link": "https://github.com/SheepSeb/tinyworldformer", "summary": "Article URL: https://github.com/SheepSeb/tinyworldformer \n Comments URL: https://news.ycombinator.com/item?id=50295450 \n Points: 67 \n # Comments: 7", "source_id": "hacker_news", "source_name": "Hacker News", "source_name_fa": "هکر نیوز (تکنولوژی و امنیت)", "category": "tech", "published_at": "2026-10-29T20:32:28+00:00", "published_epoch": 1793305948, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "1525a7630ec16150", "title": "روزنامه وال‌استریت ژورنال روز پنجشنبه هفتم آبان‌ماه گزارش داد که دریاسالار برد کوپر، فرمانده ستاد فرماندهی مرکزی ارتش آم...", "link": "https://t.me/VahidOnline/78901", "summary": "روزنامه وال‌استریت ژورنال روز پنجشنبه هفتم آبان‌ماه گزارش داد که دریاسالار برد کوپر، فرمانده ستاد فرماندهی مرکزی ارتش آمریکا (سنتکام)، در نشستی کم‌سابقه در کاخ سفید، گزینه‌های نظامی حمله به ایران را به دونالد ترامپ ارائه کرده است.\n\nبه گفته مقام‌های آمریکایی و افراد آگاه از جزئیات این نشست، پیت هگست، وزیر جنگ آمریکا، و ژنرال دن کین، رئیس ستاد مشترک نیروهای مسلح، نیز در جلسه حضور داشتند. این دیدار یک روز پس از نشست فرماندهان ارشد نظامی با جی‌دی ونس، معاون رئیس‌جمهوری آمریکا، برگزار شد.\n\nمقام‌های دولت ترامپ پیش‌تر به کشورهای عربی حاشیه خلیج فارس هشدار داده بودند که برای یک عملیات نظامی کوتاه اما شدید پس از انتخابات میان‌دوره‌ای آمریکا آماده باشند. ترامپ نیز هفته گذشته با اشاره به حملات گسترده آمریکا و اسرائیل در بهار گذشته گفت: «ممکن است یک خشم حماسی کوچک دیگر اجرا کنیم، یا آن‌ها توافق خواهند کرد.»\n\nهمزمان، پنتاگون طی هفته‌های اخیر سامانه‌های پدافند هوایی، مهمات و تجهیزات بیشتری به خاورمیانه اعزام کرده و برخی نیروهای آمریکایی را از پایگاه‌های آسیب‌پذیر خارج کرده است. ارتش آمریکا همچنین در حال انتقال یک آتشبار دیگر سامانه پاتریوت به اسرائیل برای تقویت توان دفاع موشکی این کشور است.\n@ VahidOOnLine \nآپدیت: \nگزارش مشابه اکسیوس، ترجمه ماشین:\n فرمانده ارشد نیروهای آمریکا در خاورمیانه ترامپ را در جریان محاصره دریایی ایران قرار داد\n\nبه گفته دو مقام آمریکایی، دریاسالار برد کوپر، فرمانده ستاد فرماندهی مرکزی آمریکا (سنتکام) و فرمانده نیروهای آمریکایی در خاورمیانه، روز پنجشنبه گزارشی از وضعیت جنگ ایران به دونالد ترامپ، رئیس‌جمهوری آمریکا، ارائه کرد که تمرکز آن بر محاصره دریایی جاری ایران بود.\n\n چرا مهم است: \nترامپ، همان‌طور که پیش از عملیات «چکش نیمه‌شب» در ژوئن ۲۰۲۵ و عملیات «خشم حماسی» در ماه فوریه انجام داد، اکنون نیز دو مسیر موازی را دنبال می‌کند؛ از یک سو تلاش برای دستیابی به توافقی به‌منظور ازسرگیری مذاکرات صلح و از سوی دیگر، آماده شدن برای ازسرگیری احتمالی عملیات نظامی گسترده پس از انتخابات میان‌دوره‌ای آمریکا.\n\n پشت پرده: \nبه گفته مقام‌های آمریکایی، ترامپ می‌خواست مستقیماً از فرمانده سنتکام بشنود که آیا محاصره دریایی مؤثر بوده است یا نه.\n ▪️ کوپر همچنین ترامپ را در جریان عملیات نظامی برای هدایت نفتکش‌ها به خارج از تنگه هرمز و به‌سوی بازارهای جهانی انرژی قرار داد.\n ▪️ او همچنین تازه‌ترین اطلاعات را درباره کارزار فشار اقتصادی که ارتش آمریکا با همکاری وزارت خزانه‌داری اجرا می‌کند، به ترامپ ارائه کرد.\n ▪️ به گفته این مقام‌ها، پیت هگست، وزیر دفاع، اسکات بسنت، وزیر خزانه‌داری، ژنرال دن کین، رئیس ستاد مشترک نیروهای مسلح، استیو ویتکاف، فرستاده کاخ سفید، و شماری دیگر از مقام‌های ارشد نیز در این نشست حضور داشتند.\n ▪️ کاخ سفید و سنتکام از اظهارنظر خودداری کردند.\n ▪️ روزنامه وال‌استریت ژورنال نخستین رسانه‌ای بود که خبر این نشست را منتشر کرد.\n\n تحولات اصلی: \nگروهی از میانجی‌های منطقه‌ای به رهبری قطر تلاش می‌کنند آمریکا و ایران را متقاعد کنند که به‌جای ازسرگیری جنگ پس از انتخابات میان‌دوره‌ای، مسیر مذاکره را در پیش بگیرند.\n ▪️ یک منبع منطقه‌ای گفت: «میانجی‌گری در مرحله بسیار حساسی قرار دارد.»\n ▪️ میانجی‌های قطری اخیراً نامه‌ای از جی‌دی ونس، معاون رئیس‌جمهوری آمریکا، به ژنرال محسن رضایی، دبیر شورای عالی امنیت ملی ایران، تحویل داده‌اند.\n ▪️ ونس در این نامه پیشنهاد ازسرگیری مذاکرات را مطرح کرده، اما تأکید کرده است که هرگونه مذاکره باید به برنامه هسته‌ای ایران بپردازد.\n ▪️ به گفته یک منبع آگاه، ترامپ و ونس روز چهارشنبه دیدار کردند تا درباره اقدامی احتمالی برای نشان دادن حسن نیت به ایران، مانند ارسال کالاهای بشردوستانه از جمله مواد غذایی و دارو، گفت‌وگو کنند. ترامپ ساعاتی بعد به‌طور علنی از این ایده حمایت کرد.\n\n اظهارات مقام‌ها: \nتام باراک، سفیر آمریکا در ترکیه، روز پنجشنبه به شبکه سی‌ان‌ان گفت آمریکا و ایران برای دستیابی به توافقی جهت کاهش تنش‌ها «بسیار نزدیک» هستند.\n ▪️ او گفت: «فکر می‌کنم بسیار نزدیک شده‌ایم به اینکه سرانجام به نقطه‌ای برسیم که بتوانیم بگوییم: بیایید فعلاً یک وقفه ایجاد کنیم.»\nاو افزود: «قرار نیست فوراً به یک راه‌حل جامع برسیم، اما می‌توانیم اجازه دهیم منطقه با سرعت و آهنگ خودش پیش برود.»\n\n موضع طرف مقابل: \nمقام‌های ایرانی روز پنجش     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
