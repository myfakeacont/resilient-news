رویارویی با ایالات متحده است.\n\nلورن بیس، سخنگوی کاخ سفید، در واکنش به این گزارش گفت: «ما تمامی تهدیدهای احتمالی را زیر نظر داریم، اما در حال حاضر هیچ تهدید معتبری علیه خاک آمریکا وجود ندارد.» یکی از منابع اطلاعاتی به سی‌ان‌ان گفت هنوز مشخص نیست جمهوری اسلامی نیروهای لازم برای اجرای چنین عملیاتی را در اختیار دارد یا خیر.\n\nبا این حال، مقام‌های آمریکایی معتقدند افزایش فشارهای نظامی و محاصره اقتصادی جمهوری اسلامی ممکن است انگیزه رژیم ایران برای اجرای عملیات در خاک آمریکا را افزایش داده باشد.\n\nبه گفته یکی از منابع، دستگاه‌های اطلاعاتی آمریکا ارتباطاتی را شناسایی کرده‌اند که در آنها ادعا شده رژیم ایران پیش‌تر مواد مورد نیاز برای ساخت بمب را در داخل ایالات متحده مخفی کرده است. اعتبار این اطلاعات همچنان مورد اختلاف مقام‌های آمریکایی است.\n\nبرخی مسئولان امنیت ملی احتمال می‌دهند مواد رادیواکتیو یا عوامل شیمیایی از سال‌ها پیش در خاک آمریکا قرار داده شده باشند، هرچند شواهد قطعی درباره این موضوع ارائه نشده است.\n\nسی‌ان‌ان توضیح می‌دهد که «بمب کثیف» بر خلاف بمب هسته‌ای از انفجار متعارف برای پراکنده کردن مواد رادیواکتیو استفاده می‌کند. چنین سلاحی می‌تواند مناطق وسیعی را آلوده کند و موجب وحشت عمومی شود، اما قدرت تخریبی آن با انفجار هسته‌ای قابل مقایسه نیست.\n\nیکی از منابع اطلاعاتی این نوع سلاح را «ابزار ایجاد وحشت و نه سلاحی دقیق» توصیف کرد و هشدار داد که استفاده از آن می‌تواند افراد را به‌ شدت بیمار و برخی مناطق را غیرقابل سکونت کند.\n\nاین گزارش در حالی منتشر می‌شود که تهدیدهای منتسب به جمهوری اسلامی هفته پیش موجب انتقال اسکات بسنت، وزیر خزانه‌داری آمریکا، به محل اقامت نظامی تحت حفاظت شد.\n\nهمزمان، دو مقام آمریکایی اعلام کردند اطلاعات دیگری نیز از احتمال استفاده جمهوری اسلامی از سلاح‌های شیمیایی علیه نیروهای آمریکایی مستقر در خاورمیانه حکایت دارد.\n\nبه گفته منابع سی‌ان‌ان، برخی نیروهای آمریکایی در منطقه تجهیزات حفاظتی و آموزش کافی برای مقابله با چنین حملاتی ندارند. این نگرانی‌ها به برنامه‌ریزی جداگانه برای حفاظت از کارکنان دیپلماتیک و اطلاعاتی آمریکا منجر شده است.\n@ VahidHeadline \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
