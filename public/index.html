۱۴ در کوارتر نخست، کنترل کامل بازی را در دست گرفت.\nآستین ریوز، گارد آماده لیکرز، در غیاب دانچیچ رهبری تیم را بر عهده گرفت و با به ثمر رساندن ۴۳ امتیاز (شامل ۱۴ شوت موفق از ۲۷ تلاش)، ۵ ریبوند و ۴ پاس گل، شب درخشانی داشت.\n\n 🔹 این نخستین بار در فصل جاری است که ریوز مرز ۴۰ امتیاز را رد می‌کند؛ بازیکنی که ۲۴ امتیاز از مجموع امتیازات خود را در نیمه دوم به دست آورد.\n\n 🔹 پیستونز که تا پیش از این جایگاه سوم کنفرانس شرق را در اختیار داشت، در نیمه دوم تلاش زیادی برای جبران اختلاف امتیاز انجام داد و حتی در کوارتر پایانی اختلاف را به حداقل رساند (۹۶-۹۷)، اما در لحظات حساس پایانی، عملکرد درخشان واکر کسرلر زیر سبد با ۱۲ امتیاز، ۱۶ ریبوند و ۳ بلاک‌شات، پیروزی ۱۲۱-۱۱۶ را برای لیکرز قطعی کرد.\n\n 🔹 با این پیروزی ارزشمند، لیکرز با ۹ پیروزی و ۲ شکست، جایگاه خود را در صدر کنفرانس غرب محکم‌تر کرد.\n\n @iranintltvsport", "source_id": "tg_IranintlTV", "source_name": "@IranintlTV", "source_name_fa": "@IranintlTV (ایران اینترنشنال (تلگرام))", "category": "telegram", "published_at": "2026-11-09T07:54:19+00:00", "published_epoch": 1794210859, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/iv5V_bGHKE8fDtMjBFXDnZvxkD8xzd9Ke5p_gn-eeuySDEP5gwraRsq294C9Pvyl5PDi8o3PhHM5tYxmlKTQRhOWVfj3fVEvxUkvwu6Q9rCXBaq3K_36TqnzEg8DbbHx132aFR55aG5rQlAG0d__MaTXHTFJL4mVS7lOqHxKK5W488WKLUx4e-ua0uDXfXREI-5YpSYnxEpFntiJciWZzdwJAGfbg3KAluBker1leo2jQCzRaN-TZMEvdpFhY7fSB61REvJq04YhviHOi3nKncdgWpXbVLf8J2BG9WdpntvPsPEezc8xHrA2ozE_T_5v-aw2edx__t3LKRutCLEhyw.jpg"], "local_media_path": "media/2026-11-09/d3cc5328d678ebce.jpg"}, {"hash": "25ca5f46ca9d9f5c", "title": "Le Pen and Melenchon ahead in 2027 French presidential race, poll shows - Reuters", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxPTmpVSHREZHRBQm03SDNnTUYydDB1UHJQRThqb1NwT0ZDYTdyRFZnSWpkNlZ3NnNhb0hOMUxYYUNsb2dCUFlwdl8zSklMNGN3SDdiQXZqTTZCeDVsb2JiVUI4bk9CODY3S3g2U2MzUWtvSllwZW01ZkxsdVBNZHpOVHk5R3hWU0dfQ0Y5ZU1JXzJUUnUzUVBFVDZNNnA4dFc2T3JuRlJBM3c?oc=5", "summary": "Le Pen and Melenchon ahead in 2027 French presidential race, poll show ه؛ برخلاف روندِ مبهم و بعضا پوچِ چندماه‌ی اخیرِ «دوحه!»\nآخرین پیشنهاد مطرح شده قطر این است که «غنی‌سازیِ ۳.۶۷ ٪ ایران» (که توسط عاصم منیر قول داده شد) پذیرفته شود، «۴۰۰ کیلوگرم اورانیومِ ۶۰٪ ایران در داخل رقیق گردد»، «محاصره دریایی ایران توسط آمریکا رفع گردد»، «بخشی از دارایی‌های ایران آزاد گردد» _رقمی بین ۶ تا ۱۰ میلیارد دلار_، «ایران میانجیِ عربستان و انصارللهِ یمن گردد»، و «پس از ورود بازرسان آژانس به خاکِ کشور»، «ایران تنگه را باز کند!»\nبا توجه به «اصرار ۱۸ ماهِ اخیر آمریکا مبنی بر خروج اورانیومِ ۶۰٪ ایران به مقصد آمریکا» و «غنی سازی صفر»، این طرح در صورت اجرا شدن، «عقب نشینی واضحِ آمریکا»، در مقابل «عقب نشینیِ نسبی تهران» (خاصه هسته‌ای) را نشان می‌دهد؛ اگرچه کماکان تهران اصرار بر عملی شدن ۷ شرطِ خود دارد.\nولی اگر آمریکا قرار است به سمتِ تعامل پیش رود، چرا فازِ جدید محاصره ایران را با عنوان «دروازه آهنین»، شروع کرده؟!\"\n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-09T03:18:49+00:00", "published_epoch": 1794194329, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/IzvEw1hUdSeToLfvAIwj6yQSJoszAdQ6A7O9SWB5SPYM7C7AcNGfS9A23y4NdmWA1ADliE646dARdgaZpm4hW7xLKpi61z6KqX2s_GcH3HF_teduHHYv2f3snlQggmR-pOViMrRaNil_he7qJA0vzWXg8Ejuwktzn_SkdcpJtsnOkAxDxK3Feq9Eu23BB9VG30hZYt9neZ1Z_ckSKILiNTDby1V8WFPJltpUMUWYQSkST-AIk2TYb8m3J6be5Qi7lh0c2nC4dS0NvTdNd1juaP8-CK74ZgO5TPPHhRJqzWxlaFph6TSTuERKLCgSYGOv-QcJL-92dBpaWhK_XQO44g.jpg"], "local_media_path": null}, {"hash": "6c1b9d917e416010", "title": "The Qlobe: Rotating Quine (2010)", "link": "http://mamememo.blogspot.com/2010/09/qlobe.html", "summary": "Article URL: http://mamememo.blogspot.com/2010/09/qlobe.html \n Comments URL: https://news.ycombinator.com/item?id=50420599 \n Points: 27 \n # Comments: 0", "source_id": "hacker_news", "source_name": "Hacker News", "source_name_fa": "هکر نیوز (تکنولوژی و امنیت)", "category": "tech", "published_at": "2026-11-09T03:15:17+00:00", "published_epoch": 1794194117, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "db624a724986f78a", "title": "بخش‌های مربوط به ایران در مصاحبه ترامپ با برنامه ۶۰ دقیقه CBS درباره انتخابات", "link": "https://t.me/VahidOnline/79044", "summary": "بخش‌های مربوط به ایران در مصاحبه ترامپ با برنامه ۶۰ دقیقه CBS درباره انتخابات\n\n 🔺 خبرنگار: دو سال پیش، شما به پیروزی بزرگی رسیدید؛ به قول بعضی‌ها، پیروزی‌ای تاریخی. اما حالا حزب جمهوری‌خواه در انتخابات میان‌دوره‌ای شکست بزرگی خورد؛ به قول بعضی‌ها، شکستی تاریخی. تحلیل سیاسی‌تان را از آنچه رخ داد بگویید.\n\n 🔻 ترامپ: خب، اول از همه، نام من در برگه رأی نبود، اما خیلی تلاش کردم تا از بعضی‌ها حمایت کنم. فکر می‌کنم اگر نام من در برگه رأی بود، اوضاع خیلی متفاوت می‌شد. چون دیدید چقدر محبوبیت و علاقه وجود داشت. واقعاً علاقه بود. تجمع‌های انتخاباتی عظیمی داشتیم. اما باید آن رأی‌دهندگان را به سمت نامزدهایی می‌بردید که دوستشان نداشتند.\n\nولی مسئله دیگری هم هست. مردم جنگ را دوست نداشتند. از این هم ناراضی بودند که قیمت بنزین بالا رفت، چون من قیمتش را پایین آورده بودم. و به‌طرز باورنکردنی، نارضایتی شدیدی از اسرائیل وجود دارد.\n....\n 🔺 خبرنگار: چند روز پیش، معاون شما، جی‌دی ونس، پستی در شبکه‌های اجتماعی منتشر کرد و نوشت: «دلیل شکست ما جنگ بود؛ منظورم جنگ ایران است.» و در آن پست درباره موضوعات دیگری هم نوشت...\n\n 🔻 ترامپ: من مخالفتی ندارم.\n\nخبرنگار: درباره اسرائیل.\n\nترامپ: بله.\n\nخبرنگار: پس با تحلیل او موافقید؟\n\nترامپ: با آن مخالفتی ندارم.\n\nخبرنگار: خبر داشتید که قرار است چنین پستی بنویسد؟\n\nترامپ: از من پرسید: «نظرت چیست؟» گفتم: «بنویس، آنچه را احساس می‌کنی بنویس.» راستی، می‌خواهی چه بنویسی؟\n\nتنها چیزی که دلم می‌خواست او هم آنجا می‌گفت، البته اگر چنین اعتقادی داشت، و باید این را از خودش بپرسید، این بود: اگر دوباره قرار بود این کار را بکنی، باز هم می‌کردی؟\n\nمی‌دانید، او هم بخشی از فرایند تصمیم‌گیری است.\n\nو پاسخ من قاطعانه «بله» است؛ چون نباید گذاشت ایران سلاح هسته‌ای داشته باشد.\n\nفکر می‌کنم از نظر تاریخی این تصمیم بسیار خوبی خواهد بود. آیا این تصمیم برای امروز و فردا هم خوب است؟ شاید نه.\n\nاما می‌دانید، من باید کاری را بکنم که برای کشورمان درست است.\n\nاگر آن‌ها در دوران من سلاح هسته‌ای داشتند، به‌شدت نکوهش می‌شدم؛ خیلی بیشتر از آنچه تا حالا اتفاق افتاده.\n\nپس بگذارید خلاصه کنم: من مانع دستیابی آن‌ها به سلاح هسته‌ای شده‌ام. این دستاورد بزرگی است.\n\n....\n 🔻 گزارشگر CBS: در هفته گذشته، هگست پیام ویدیویی بلندی منتشر کرد و در آن از عملکرد خودش و نحوه پیشبرد جنگ ایران دفاع کرد؛ جنگی که رئیس‌جمهور مدعی است عملاً به پایان رسیده است.\n\n 🔻 خبرنگار: پس حالا که انتخابات میان‌دوره‌ای تمام شده، قصد تشدید جنگ را ندارید؟\n\n 🔺 ترامپ: نه، چنین قصدی ندارم. فکر نمی‌کنم دلیلی داشته باشد. فکر نمی‌کنم اصلاً دلیلی برای این کار باشد.\n\nخبرنگار: آن‌ها هنوز مواد هسته‌ای دارند. درست است؟\n\nترامپ: آن‌ها هیچ‌چیز ندارند. همه‌اش زیر هزاران تُن سنگ مدفون شده است.\n\nخبرنگار: پس در نهایت چه توافقی با آن‌ها می‌کنید که تنگه را باز کند؟ چون این مسئله مهم است.\n\nترامپ: مهم است که تأکید کنیم... تنگه باز است. کشتی‌ها از آن عبور می‌کنند.\n\nخبرنگار: اما کشتی‌هایی که عبور می‌کنند، با حضور گسترده نیروهای نظامی آمریکا تحت حفاظت هستند. پس چطور به توافقی برسیم که این حضور نظامی را پایان دهد؟\n\nترامپ: هزینه چندانی ندارد. می‌توانیم آن‌ها را برای همیشه آنجا نگه داریم.\n\nاگر کل این ماجرا را کنار بگذاریم، کشورهایی که از آن‌ها محافظت کرده‌ایم، تمام هزینه‌هایی را که برای جنگ کرده‌ایم به ما پس خواهند داد، چون بدون ما اصلاً وجود نداشتند.\n\nبدون ما اسرائیل هم وجود نداشت. \nاسرائیل اگر دونالد ترامپ نبود وجود نداشت، چون ما با آن بمب‌افکن‌های زیبای بی-۲ بیش از یک سال پیش وارد عمل شدیم و آن سه تأسیسات را هدف قرار دادیم.\n\n 🔺 خبرنگار: اما درباره اسرائیل؛ آیا از تصمیمتان برای کمک به اسرائیلی‌ها در حملات برای حذف رهبران ایران پشیمانید؟\nچون آن حملات رژیم ایران را تغییر داد و ظاهراً باعث تشدید اقداماتشان شد.\nمی‌توانستید فقط به حمله به تأسیسات هسته‌ای ادامه دهید، درست است؟\n\n 🔻 ترامپ: نه، می‌شد آن کار را کرد، اما افرادی بودند که می‌خواستند فراتر بروند.\n\nما ضربه‌ای مهلک به زرادخانه هسته‌ای‌شان زدیم.\n\nببینید، من با این آدم‌ها سروکار دارم. با خیلی‌ها سروکار دارم و این همان کاری است که تمام عمرم انجام داده‌ام.\n\nمن معامله می‌کنم و روشن است که معامله‌های خوبی هم می‌کنم، چون پول زیادی به دست آورده‌ام و رئیس‌جمهور شده‌ام.\n CBS \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-09T03:04:10+00:00", "published_epoch": 1794193450, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/OvPu0SR6WSHkrx69KQOmTGiXjXlntrn9r58FrAmMfRSNnRKeAonyJbZ4-O_Fmid8jRrCj2TzmIBgfLIVjax-aNU68b9fqJbgr1Gy9FHe4w_58pObzEe7wzNTSb6W7Pk9ynM5oXhOzDNw3-yVc71hBPsiPYT-etha_352Kx-SLpHa9JNqpYdt6dp_TR1LoDGOEzFmjBfzTBRh5bDEwzfjIi1CUaXkxdTWkbKlmkLRY8Pzkw_iR381V0X3hF1XadpW8E81VItLCNJshprfdUJIUQMU8aSX5cjIZW1UZgziW2LpDcRJpRyCNAbr3W9wsALwMTJ2phvlM6Gocw4_Y6Jffw"], "local_media_path": null}, {"hash": "ee97c75e21226bfd", "title": "مارکو روبیو، وزیر امور خارجه آمریکا، روز یکشنبه به خبرنگاران درباره روند مذاکرات با جمهوری اسلامی ایران گفت: «پیشرفتی بر...", "link": "https://t.me/VahidOnline/79043", "summary": "مارکو روبیو، وزیر امور خارجه آمریکا، روز یکشنبه به خبرنگاران درباره روند مذاکرات با جمهوری اسلامی ایران گفت: «پیشرفتی برای گزارش دادن ندارم و نمی‌توانم بگویم در آستانه یک گشایش هستیم. هرچند شماری از کشورها با ایده‌های مختلف به تعامل با آنها ادامه می‌دهند.»\nاو با تأکید بر رویکرد واشنگتن افزود: «ترامپ همواره ترجیح می‌دهد این موضوع و هر مسئله دیگری را از راه دیپلماتیک حل کند، هرچند متأسفانه گاهی این کار شدنی نیست، اما اگر فرصتی باشد آن را بررسی خواهیم کرد.»\nوزیر خارجه آمریکا در ادامه تصریح کرد: «در حال حاضر این مسیر چندان ثمربخش نبوده است، زیرا خواسته‌های ایران نه فقط غیرقابل قبول، بلکه در مواردی زیاده‌خواهانه، مضحک و واقعاً نامعقول است.»\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-09T03:03:56+00:00", "published_epoch": 1794193436, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/XkmkV2byTSXZOoGH21KuDkcXJxXqJrJZD5V9MjSUrIHdXplc4L0p     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
