"070532b372c9fc00", "title": "آغاز به کار کنست با اعضای جدید؛ آیزنکوت از طرح برچیدن میراث نتانیاهو رونمایی کرد", "link": "https://parsi.euronews.com/2026/11/10/knesset-eisenkot-unveils-plan-to-dismantle-netanyahus-legacy", "summary": "گادی آیزنکوت، مأمور تشکیل کابینه جدید اسرائیل روز سه‌شنبه هم‌زمان با برگزاری مراسم تحلیف نمایندگان دوره جدید کنست (پارلمان این کشور) متعهد شد که بخش عمده‌ای از سیاست‌های بنیامین نتانیاهو را لغو و روند اجرای آنها را معکوس کند.", "source_id": "euronews_persian", "source_name": "Euronews Persian", "source_name_fa": "یورونیوز فارسی", "category": "persian", "published_at": "2026-11-10T20:41:12+00:00", "published_epoch": 1794343272, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "cc9f08920fac5e34", "title": "روزنامه «جروزالم پست» به نقل از منابع دیپلماتیک گزارش داد شیخ محمد بن عبدالرحمن آل ثانی، نخست‌وزیر قطر، روز سه‌شنبه ۱۹ آ...", "link": "https://t.me/VahidOnline/79063", "summary": "روزنامه «جروزالم پست» به نقل از منابع دیپلماتیک گزارش داد شیخ محمد بن عبدالرحمن آل ثانی، نخست‌وزیر قطر، روز سه‌شنبه ۱۹ آبان در دیدار با وزیران خارجه گروه هفت در پاریس گفت دوحه توانسته است دست‌کم دو هفته فرصت برای ادامه تلاش‌های دیپلماتیک با هدف دستیابی به تفاهم میان تهران و واشنگتن و جلوگیری از حمله احتمالی آمریکا به ایران به دست آورد.\n\nبر اساس این گزارش، آل ثانی در نشست پاریس تاکید کرد که اختلاف‌های مهمی میان تهران و واشنگتن همچنان باقی است و چند موضوع کلیدی حل‌نشده است.\nبه گفته نخست‌وزیر قطر، دو طرف بر سر ترتیب اجرای اقدامات، از جمله رفع محاصره دریایی، مساله هسته‌ای و آزادسازی دارایی‌های مسدود شده ایران اختلاف‌نظر دارند.\n@ VahidHeadline \n ابراهیم بن سلطان الهاشمی، مدیر اداره رسانه و ارتباطات وزارت خارجه قطر، روز سه‌شنبه ۱۹ آبان اعلام کرد تلاش‌های میانجی‌گرانه دوحه برای کاهش اختلاف‌های آمریکا و ایران ادامه دارد و این تلاش‌ها طی هفته‌ها و روزهای اخیر با هماهنگی شرکای منطقه‌ای و بین‌المللی شتاب گرفته است.\n\nالهاشمی گفت محمد بن عبدالرحمن آل ثانی، نخست‌وزیر و وزیر خارجه قطر، روز دوشنبه در واشنگتن با جی‌دی ونس، معاون رئیس‌جمهوری آمریکا، دیدار کرد و سپس در کاخ سفید با دونالد ترامپ جلسه‌ای پشت درهای بسته داشت. به گفته او، در این دیدارها درباره تحولات منطقه و راه‌های پیشبرد مذاکرات آمریکا و ایران گفت‌وگو شد و جلسه با ترامپ «مثبت» بود.\n\nاو افزود: «در مذاکرات پیشرفت حاصل شده است و میانجی به‌طور مستمر و هماهنگ برای کاهش اختلاف‌ها تلاش می‌کند.» \nالهاشمی گفت جزئیات بیشتر تا زمان نهایی‌شدن شکل و چارچوب توافق احتمالی اعلام نخواهد شد.\n\nاین مقام قطری همچنین گفت مقام‌های دوحه در چارچوب این میانجیگری به تهران سفر کرده‌اند و با کشورهای منطقه و دیگر طرف‌های مرتبط رایزنی داشته‌اند. او تأکید کرد با وجود گزارش‌های منفی رسانه‌ای در روزهای اخیر، هر دو طرف همچنان درباره دستیابی به راه‌حلی دیپلماتیک «مثبت» سخن می‌گویند.\n\nالهاشمی درباره ادامه بسته‌ماندن تنگه هرمز نیز هشدار داد که با نزدیک‌شدن زمستان، هزینه این وضعیت برای کشورهای جهان، به‌ویژه در شرایط بحران انرژی، افزایش می‌یابد و خواستار تلاش برای پایان‌دادن به بحران و برقراری دوباره آزادی کشتیرانی در این تنگه در سریع‌ترین زمان ممکن شد.\n\nاو همچنین گزارش‌های رسانه‌ای درباره مفاد توافق احتمالی را رد کرد و گفت میانجیگران برای پایان‌دادن به وضعیت «نه جنگ و نه صلح» و بازگرداندن ثبات به منطقه تلاش می‌کنند.\n@ VahidOOnLine \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-10T20:35:25+00:00", "published_epoch": 1794342925, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/MLNN5Hu4LSKA68I-H48AwwuM5QWlbA2W7m5thkrv7KE4Xzs_nftL7LkwV9zCw4qdG5ZiU3ru2ZAYMByENKlUePIlCLRtCTEhgz6HLNUoeKwARWd4KqAGGUcYdpBUeMStQKPWeJzjDIw9MZ1G6UZUtfQ64QnNbRy7o1pOtPihHxLK-PDVDGRgxVU7ef66hBqRhpfAFqP0tN4KraS7qKJqiiaYzlruYpRkP4-N8zjT3OreiY6FSxbeLVyp92wNfhX6lS5g8QAGS3QILMyCNDyIrzvIdt_i-5GhsqtN3fPphbE2sxQVcdS8H3Vd743deQutCFhKi6Ac0XNPZF_8IYwBNQ.jpg"], "local_media_path": "media/2026-11-11/a2f5e468b1cc7afe.jpg"}, {"hash": "38071ac1aa67484f", "title": "طوفان «چارلز»؛ روز دوم همایش فناوری وب‌سامیت لیسبون لغو شد", "link": "https://parsi.euronews.com/2026/11/10/web-summi     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
