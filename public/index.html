یش از ۱۲ ساعت در تهران مذاکره کردند تا به توافقی برای ازسرگیری مذاکرات مستقیم میان آمریکا و ایران دست یابند و از آغاز جنگ پس از انتخابات میان‌دوره‌ای آمریکا جلوگیری کنند.\n\n ▪️ این گفت‌وگوها روز شنبه در دوحه، پایتخت قطر، ادامه خواهد یافت.\n\n 🔻 چرا مهم است: \nآمریکا اکنون تنها چند روز با عملیات نظامی احتمالی فاصله دارد که می‌تواند خسارات عظیمی به ایران وارد کند و احتمالاً به حملات تلافی‌جویانه علیه اسرائیل و شماری از کشورهای حاشیه خلیج فارس منجر شود.\n\n 🔻 تحولات اصلی: \nیک منبع دیپلماتیک گفت میانجی‌های قطری در جریان مذاکرات طولانی روز جمعه، به‌طور منظم با کاخ سفید در تماس بودند.\n\n ▪️ این منبع گفت: «پیشرفت مثبتی حاصل شد. مذاکرات همچنان ادامه دارد و تلاش‌ها برای گشودن گره توافق میان آمریکا و ایران در جریان است.»\n\n ▪️ قطری‌ها آمریکا و ایران را ترغیب می‌کنند بر سر مجموعه‌ای از اقدامات متقابل به توافق برسند که طی چند روز اجرا شود و دو طرف را به مذاکرات مستقیم درباره برنامه هسته‌ای ایران و دیگر مسائل بازگرداند.\n\n ▪️ یک مقام آمریکایی گفت دو خواسته متعارض تاکنون مانع پیشرفت مذاکرات شده است: اصرار دولت ترامپ بر اینکه ایران باید به‌عنوان بخشی از روند ازسرگیری مذاکرات، امتیازهایی در زمینه هسته‌ای بدهد؛ و شرط ایران مبنی بر اینکه آمریکا ابتدا محاصره دریایی را لغو کند، دارایی‌های مسدودشده را آزاد کند و اجازه فروش نفت به ایران بدهد.\n\n ▪️ قطری‌ها تلاش می‌کنند ایران را متقاعد کنند که به‌عنوان اقدامی اعتمادساز، به بازرسان سازمان ملل اجازه بازدید از تأسیسات هسته‌ای بمباران‌شده خود را بدهد؛ اقدامی که آمریکا در مقابل آن، بخشی از تحریم‌ها را کاهش خواهد داد.\n\n 🔻 اختلاف‌نظرها در پشت پرده: \nدر حلقه نزدیکان ترامپ، دیدگاه‌های متفاوتی درباره اینکه او باید چه اقدامی انجام دهد، وجود دارد.\n\n ▪️ به گفته یک مقام آمریکایی، پیت هگست، وزیر دفاع، و مارکو روبیو، وزیر امور خارجه، به‌شدت تردید دارند که بتوان با حکومت کنونی ایران به توافقی هسته‌ای دست یافت. آن‌ها معتقدند میراث ترامپ باید تضعیف هرچه بیشتر حکومت ایران باشد؛ از جمله از طریق حملات نظامی بیشتر.\n\n ▪️ این مقام گفت در حالی که جی‌دی ونس، معاون رئیس‌جمهوری، و استیو ویتکاف و جرد کوشنر، فرستادگان ترامپ، خواهان ازسرگیری مذاکرات هستند،     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
