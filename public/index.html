فعال می‌شود.\nاگر نتیجه بهتر نشد، تیک را بردار. این گزینه رمزگذاری یا بررسی گواهی سرور را خاموش نمی‌کند.\n\n ➕ WARP registration address\nکادر پایین این سه گزینه، مقصد درخواست‌های ثبت‌نام و مدیریت حساب WARP را تغییر می‌دهد. معمولاً خالی بماند. فقط آدرس سازگار و آزموده‌شدهٔ سرویس ثبت‌نام را با قالب IP:port یا host:port وارد کن؛ بدون پورت یعنی 443. این کادر با Endpoint تونل فرق دارد. لینک اشتراک، کانفیگ نود، https:// یا مسیر سایت در آن وارد نکن. اگر ثبت‌نام بعد از تغییر شکست خورد، کادر را خالی کن.\n\n 🧪 چطور درست آزمایش کنیم؟\n• در Routes → Carrier، حالت Manual و سپس Aether را انتخاب کن؛ TLS داخلی سایفون و تور با این کادرها تغییر نمی‌کند.\n• برای مقایسه روی یک روش مشخص، در Routes → Advanced → Protocol، H2 یا H3 را انتخاب کن.\n• هر بار فقط یک گزینه را تغییر بده، قطع و دوباره وصل شو. Check the connection works روشن بماند.\n• اگر خطای --tls-ciphers، --tls-groups یا --enroll-address دیدی، کادر همان گزینه را خالی کن و دوباره امتحان کن.\n\n ✨ چه چیزهای دیگری تازه شده؟\nالان ECH روی H2 هم کار می‌کند و در اتصال خودکار هم امتحان می‌شود. با روشن کردن Encrypted ClientHello، کادرهای ECH resolver و ECH key domain را می‌بینی؛ ابتدا هر دو را خالی بگذار. پیش‌فرض اندروید برای دریافت کلید، https://1.1.1.1/dns-query و دامنهٔ پیش‌فرض cloudflare-ech.com است. این resolver فقط کلید ECH را می‌گیرد؛ DNS ترافیک اپ‌ها را عوض نمی‌کند. تلاش دارای ECH بدون کلید قابل استفاده ادامه پیدا نمی‌کند؛ حالت Automatic برنامه ممکن است روش دیگری را امتحان کند.\n\nحالت Verified edges هم در Routes → Advanced → Discovery depth اضافه شده است؛ گیت‌وی‌های شناخته‌شده را در اولویت می‌گذارد و همچنان مسیر را آزمایش می‌کند. هشت سابقهٔ گیت‌وی موفق و انتخاب بهتر بین IPv4/IPv6 هم به بازیابی اتصال کمک می‌کنند.\n\nمشکل تایپ در کادرهای تازه و خطای نبودن libc++_shared.so هم در نسخهٔ جدید اصلاح شده‌اند. \n\n 📥 دریافت نسخهٔ 1.12.0:\n https://github.com/WhiteDNS/WhiteAestherMobile/releases/tag/v1.12.0 \n\n 📖 آموزش کامل و روش برگشت به تنظیمات قبلی:\n https://github.com/WhiteDNS/WhiteAestherMobile/blob/main/docs/GUIDE.fa.md#aether-     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
