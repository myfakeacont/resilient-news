"https://t.me/VahidOnline/78876", "summary": "خبرنگار: آیا شما به ونس دستور دادید که برای آغاز مذاکرات صلح با ایران گفت‌وگو کند؟\n\nترامپ: نه. ایران به کمک برای تأمین تجهیزات پزشکی نیاز دارد. اساساً موضوع، رساندن تجهیزات و اقلام مورد نیاز برای کمک به افرادی است که حالشان خوب نیست.\n\n دونالد ترامپ، رئیس‌جمهوری آمریکا، به یک گزارش روز چهارشنبه ۶ آبان وال استریت ژورنال که می‌گوید جی‌دی ونس، معاون رئیس‌جمهوری، با هدف از سرگیری مذاکرات صلح با جمهوری اسلامی، نامه‌ای به محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، ارسال کرده است، واکنش نشان داد.\n\nاین گزارش می‌گوید که این نامه با رهنمود آقای ترامپ ارسال شد.\n\nعصر چهارشنبه خبرنگاری از آقای ترامپ پرسید که آیا به ونس دستور دادید که برای آغاز مذاکرات صلح با جمهوری اسلامی گفت‌وگو کند؟\n\nآقای ترامپ پاسخ داد «نه، موضوع این است که آنها به کمک‌هایی از جمله تجهیزات پزشکی و اقلام مختلف دیگر نیاز دارند.»\n\nرئيس‌‌جمهوری آمریکا افزود: «او نظر مرا پرسید و من گفتم اگر می‌خواهی این کار را انجام بدهی، اشکالی ندارد. اساساً هدف، رساندن تجهیزات و اقلام مورد نیاز برای کمک به افرادی است که وضعیت جسمی مناسبی ندارند.»\n\nبر اساس این گزارش، ونس در حال سنجش این موضوع است که آیا جمهوری اسلامی و واشنگتن می‌توانند به اندازه کافی نقاط مشترک پیدا کنند تا آقای ترامپ را متقاعد سازند که در هفته‌های پیش رو، دستور نهایی برای انجام یک حمله کوتاه و شدید علیه جمهوری اسلامی را صادر نکند.\n\nرئیس‌جمهوری آمریکا این هفته آتش‌بس موقت با جمهوری اسلامی را «اتلاف وقت» خواند و به رای‌دهندگان آمریکایی گفت که وضعیت جمهوری اسلامی در هفته‌های آینده را ببیننند. او همچنین پیشتر گفته است که باید کار آمریکا با جمهوری اسلامی به‌طور کامل و درست تمام شود تا هرگز نتواند به سلاح هسته‌ای دست یابد.\n\nچند روز پیش از این نیز وال‌استریت ژورنال در گزارشی ویدیویی از ارسال مهمات بیشتر به کشتی‌های جنگی آمریکایی در آب‌های نزدیک ایران خبر داده بود.\n@ VahidHeadline \n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-28T21:48:45+00:00", "published_epoch": 1     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
