ارشنبه ۲۲ مهر در آب‌های جنوبی تنگه هرمز با مین دریایی برخورد ...", "link": "https://t.me/VahidOnline/78728", "summary": "نیروی دریایی سپاه پاسداران می‌گوید یک کشتی کانتینربر صبح چهارشنبه ۲۲ مهر در آب‌های جنوبی تنگه هرمز با مین دریایی برخورد کرد، آتش گرفت و غرق شد.\nروابط عمومی این نهاد نظامی در بیانیه‌ای کشتی را «متخلف» خواند و گفت قصد داشته از «مسیر غیرمجاز و پرخطر» تنگه عبور کند. سپاه همچنین اعلام کرد کشتی بیش از ۲۵۰۰ کانتینر بار داشته است.\n@ VahidHeadline \nمنابع امنیت دریایی چهارشنبه ۲۲ مهر به رویترز گفتند یک کشتی کانتینربر پس هدف قرار گرفتن در نزدیکی تنگه هرمز غرق شده و یک کشتی فله‌بر دیگر که در حمله‌ای پیشین آسیب دیده بود، در حال غرق شدن است.\n\nبه گفته این منابع، کشتی کانتینربر «جی‌اف‌اس پراید» با پرچم سنگاپور و ظرفیت حمل دو هزار و ۸۲۴ کانتینر ۲۰ فوتی غرق شده است.\nسازمان آب‌نگاری پاکستان در هشداری دریانوردی اعلام کرد: «گزارش شده کشتی تجاری جی‌اف‌اس پراید غرق شده و کانتینرهای آن روی آب شناور هستند.» این سازمان به کشتی‌های عبوری درباره خطرات احتمالی هشدار داد.\n\nبر اساس داده‌های سازمان بین‌المللی دریانوردی وابسته به سازمان ملل متحد، جی‌اف‌اس پراید دومین کشتی است که از زمان آغاز جنگ آمریکا و جمهوری اسلامی غرق شده است.\n در حادثه‌ای جداگانه، منابع امنیت دریایی اعلام کردند کشتی فله‌بر «کیپ دائو» با پرچم آنتیگوا و باربودا که اول مهر هدف اصابت پرتابه قرار گرفته بود، در نزدیکی تنگه هرمز در حال غرق شدن است.\nشرکت بریتانیایی مدیریت ریسک دریایی «ونگارد» نیز اعلام کرد تلاش‌ها برای نجات این کشتی موفقیت‌آمیز نبوده است.\nرویترز همچنین به نقل از دو مقام ارشد جمهوری اسلامی گزارش داد که حکومت ایران برای هدف قرار دادن کشتی‌های عبوری از تنگه هرمز «از تاکتیک‌های جدید استفاده می‌کند تا قیمت نفت را بالا نگه دارد و بر انتخابات میان‌دوره‌ای آمریکا تاثیر بگذارد».\n@ VahidOnLive \nمرکز عملیات تجارت دریایی بریتانیا، یوکی‌ام‌تی‌او، روز چهارشنبه ۲۲ مهر اعلام کرد یک کشتی کانتینربر ۵۰ هزار تنی و یک شناور ۱۹ هزار تنی با «پرتابه‌ای ناشناس» هدف قرار گرفتند، اما پس از وارد آمدن خسارت جزئی به مسیر خود ادامه دادند.\nاین نهاد پیشتر از حمله به یک نفتکش و یک کشتی کانتینربر دیگر در روز سه‌شنبه خبر ش دهید.\nهر بار فقط یک گزینه را تغییر دهید، Save profile بزنید و دوباره اتصال را آزمایش کنید. خالی بودن فیلدهای TLS یعنی استفاده از پیش‌فرض هسته.\n 🧭 در Verified edges گیت‌وی‌های شناخته‌شده را در اولویت می‌گذارد و مسیر را بررسی می‌کند؛ تضمین اتصال نیست.\n 📦 این نسخه prerelease است. بسته‌های پنج پلتفرم ساخته و هستهٔ داخل هر ۱۰ نصب‌کننده بررسی شده است.\nپیش از حذف یا نصب مجدد، از Identity → Save a backup بکاپ بگیرید. اگر Core executable به هستهٔ قدیمی اشاره می‌کند، آن را خالی کنید تا هستهٔ همراه برنامه اجرا شود. \n\n ⬇️ دانلود نسخهٔ جدید \n 📚 راهنمای کامل فارسی", "source_id": "tg_whitedns", "source_name": "@whitedns", "source_name_fa": "@whitedns (وایت دی‌ان‌اس (DNS و ضدسانسور))", "category": "telegram", "published_at": "2026-10-14T09:28:12+00:00", "published_epoch": 1791970092, "rtl": true, "raw_media_urls": ["https://cdn5.telesco.pe/file/TirSXZD-qBgVGUBJmhAU5-HC6qgPOQfgJFihE5mGpwWOPlM58zEzndq01mWxf44Nq2C0Wb9u6vnLDnaMiuTTzHn5FSw38c0K1mMm6NZkB3xkXmrwNyA8Waf-rfWoIrQosVeHdtD_fY-P2u5i43Lt_M41rE5s6talAOKAvY4umHkohXHA9m-5BOtPiIFA0UJaOnHelku1bq4rqQIvzvb5jwPqkmshLoOHkPKiBckYpYigdr5hcFZGdtjNnFWWliInXDYHZ-dS1PwQzrfLn3BCrvFf-82mkeCpYV2yjxjqpbvNq7CDDOlDN666toOXBVQyt6MzBk0SfpNhVsAJQmwjrg.jpg"], "local_media_path": null}, {"hash": "98038e3281f9a557", "title": "Nine ways the Trump administration could interfere with the midterms - Reuters", "link": "https://news.google.com/rss/articles/CBMijAFBVV95cUxOdTJERWh3UV90cVhMS01kYVY1TzFKSGFndGROSDlWNnpLaWhhUXp6VkJSQ3VwZHJWb1NyeEpVX2dJYzBIaXFtb0dmc19KM1cyemlRVzA4NWxGeHRLRHRTZDdPMVdmRExwMmtvc0tqcjRnRzAzLTlBVURZV2J4VnJxbTJnX3dEdTFad2RvZA?oc=5", "summary": "Nine ways the Trump administration could interfere with the midterms    Reuters", "source_id": "reuters_wire", "source_name": "Reuters Wire", "source_name_fa": "خبرگزاری رویترز", "category": "wire", "published_at": "2026-10-14T06:00:00+00:00", "published_epoch": 1791957600, "rtl": false, "raw_media_urls": [], "local_media_path": null}];
    let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
