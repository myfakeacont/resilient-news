ست؛ جنگی که فرانسه در آن مشارکت نداشت.\nاین نارضایتی در دیگر پایتخت‌های اروپا نیز ابراز می‌شود. کارهای زیادی هست که می‌توانیم انجام دهیم تا در زمینه تأمین سوخت خود و تأثیرگذاری بر قیمت آن اختیار بیشتری داشته باشیم.\nاز فردا صبح، برای گفت‌وگو به نمایندگی از فرانسه عازم کشورهای حوزه خلیج فارس خواهم شد.\nنخست‌وزیر و دولت نیز همراه با تأمین‌کنندگان سوخت در سراسر کشور تصمیماتی گرفته‌اند تا راهکارهایی برای مقابله با افزایش قیمت سوخت پیدا کنند.\n FRANCE 24 \n رویترز گزارش داد شهرهای مختلف فرانسه شنبه ۲۴ مهر شاهد تظاهرات گسترده علیه افزایش هزینه‌های زندگی و افت کیفیت خدمات عمومی بودند که در برخی مناطق به خشونت، آتش‌سوزی و غارت کشیده شد.\nسباستین لکورنو، نخست‌وزیر فرانسه، مسئولیت خشونت‌ها را متوجه «چپ افراطی» و مجرمان دانست و گفت دولت مرعوب نخواهد شد.\nامانوئل مکرون، رییس‌جمهوری فرانسه، نیز وعده داد عاملان حملات تحت پیگرد قرار گیرند.\nاعتراضات ماه گذشته با نارضایتی از کمبود معلم و وضعیت مدارس آغاز شد و به جنبشی گسترده‌تر درباره نابرابری، هزینه‌های عمومی و سطح زندگی تبدیل شد.\n@ VahidOOnLine \nدر پی وقوع موارد زیادی از غارت، تخریب و آتش‌سوزی در جریان اعتراضات گسترده شامگاه شنبه در پاریس و دیگر شهرهای بزرگ فرانسه، امانوئل مکرون، رئیس‌جمهوری فرانسه، در پیامی تأکید کرد هیچ‌چیز خشونت «افسارگسیخته» را توجیه نمی‌کند.\nمکرون یکشنبه ۲۶ مهر ماه با انتشار پیامی ویدیویی گفت: «امشب همه ما احساس خشم و شرم می‌کنیم.» او تأکید کرد باید میان معترضان دارای «مطالبات مشروع» و کسانی که دست به تخریب، شکستن اموال و غارت زده‌اند، تفاوت قائل شد.\nرئیس‌جمهوری فرانسه گفت کسانی که دست به تخریب زده‌اند باید هزینهٔ اقدامات خود را بپردازند و افزود دولت در برخورد با عاملان ناآرامی‌ها «هیچ‌گونه مماشاتی» نخواهد کرد. او این خشونت‌ها را «بی‌سابقه» و «افسارگسیخته» توصیف کرد.\nمکرون همچنین وعده داد مقام‌های ارشد دولت با هماهنگی شهرداران، تصمیم‌های لازم را برای حفاظت از شهرها، ساختمان‌های عمومی و کسب‌وکارها اتخاذ کنند. او تخریب خیابان‌های شهرهای فرانسه را «غیرقابل تحمل» خواند و بر حمایت از کسب‌وکارهای آسیب‌دیده تأکید کرد.\nرئیس‌جمهوری فرانسه روز یکشنبه و پس از این اعتراضات خشونت‌آمیز، نشست اضطراری با وزیران دولت ب )", "category": "tech", "published_at": "2026-10-18T16:20:27+00:00", "published_epoch": 1792340427, "rtl": false, "raw_media_urls": [], "local_media_path": null}];
    let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
