و نیست؛ فقط به‌دنبال مسخره‌بازی‌ان. صدای اذان تو مدرسه بلند می‌کنن، ما رو به نماز خوندن مجبور می‌کنن و اگه انجام ندیم، از انضباط‌مون کم می‌کنن.\n\n 🔹 پدرم سکته کرده و دکتر براش قرص یاسنال تجویز کرده. بعد از حسابی گشتن تو‌ حداقل ۱۰-۱۲ داروخانه، یه بسته ۲۷ عددی خریدم ۷۸۰ هزار تومن. قرص وستولوکس رو که اصلا پیدا نکردم.\n\n 🔹 دیشب صف پمپ‌بنزین‌ها کیلومتری شده بود. پمپ‌بنزین خاوران تا ۵ تا کوچه قبل‌تر، تا ته کوچه، صف بود. پمپ‌بنزین میدان شهدا بنزین کم آوردن، از بس شلوغه.\n\n 🔹 از تهران پیام می‌دم. گوشت گوساله کیلویی دو میلیون و ۳۰۰ هزار تومان ولی حقوق روزانه یک کارگر ۶۰۰ هزار تومان است. با یک روز کار حتی نمی‌شود نیم کیلو گوشت خرید. دو ساله نمی‌تونیم گوشت بخوریم.", "source_id": "tg_IranintlTV", "source_name": "@IranintlTV", "source_name_fa": "@IranintlTV (ایران اینترنشنال (تلگرام))", "category": "telegram", "published_at": "2026-10-20T09:46:55+00:00", "published_epoch": 1792489615, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "fa635498b8b57b53", "title": "Amazon to invest over €16 billion in Germany next year - Reuters", "link": "https://news.google.com/rss/articles/CBMirAFBVV95cUxQX1ljLXJEWXRnVXhfTW9Qb0FSd1VITXZIemhtY2U1amxEQ09zMnJHQzVMQzFSc3RSNjRZS0puaE1FWW00QVF3NTcyZmJYQVVQMjlHYnFfSWN0R3hFMVBlTFBaVm9QblJNTmxJcVlTZ3ZaZjZTMW1fWDVsc2RFREl1cEpsaEhYZkVfd01KSUFVcGc2TEhSdzJLM2x0RzZwUkU3V3NDV0RhczFHR0R0?oc=5", "summary": "Amazon to invest over €16 billion in Germany next year    Reuters", "source_id": "reuters_wire", "source_name": "Reuters Wire", "source_name_fa": "خبرگزاری رویترز", "category": "wire", "published_at": "2026-10-20T09:41:43+00:00", "published_epoch": 1792489303, "rtl": false, "raw_media_urls": [], "local_media_path": null}, {"hash": "4bafff19692bbd22", "title": "AfD Leak: What 421,179 Hacked Emails Show about the German Far Right", "link": "https://www.heistberlin.com/news/afd-leak-what-421-179-hacked-emails-show-about-the-german-far-right/", "summary": "Article URL: https://www.heistberlin.com/news/afd-leak-what-421-179-hacked-emails-s     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
