ه تاکید کرد: «ما بسیار قوی‌تر از آن چیزی هستیم که تصور می‌کنید. ما را دست‌کم نگیرید و آزمایش نکنید.»\n\nاین اظهارات در حالی مطرح می‌شود که شبکه ۱۳ اسراییل هفته گذشته گزارش داده بود ایال زمیر، رییس ستاد کل ارتش اسراییل، در نشستی غیرعلنی گفته است که در حال حاضر ضرورتی عملیاتی برای حمله به ایران پیش از انتخابات نمی‌بیند.\n@ VahidHeadline \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-25T17:02:28+00:00", "published_epoch": 1792947748, "rtl": true, "raw_media_urls": ["https://cdn4.telesco.pe/file/mr1b_kj3qJ7kh2_nCFAVPTgQTSAzzl_OnZUPrU4xw2B6PT6Shqn6ffQAwac4VyPZRLNi4Hbxtnl4qjrxCDlf0ALENBV67iWAgNPiSzHVzbnx4V_IZRFQnCgE2QIxF3EOyrsyMg-K9JzoYx0PS5nIUZzVDLwg5rlSoV7SUsLM9Q41SwQw1KE4lKN_cVnNM3XuWbxK5ZiSdxL5TVBqUKD1Hszvn5yT76VrZGvWUHVGfLiVwMPBOFzTD8DuYJ49o6ii5xHXegHgzpX0oDaR03ha1WCLmzjjTvWO-trOQ_YuqRipmOpY3UM86LKCXH6jisdb8ruaq0HDQeU_4uRT_L52XQ.jpg"], "local_media_path": null}, {"hash": "e6e110758013d611", "title": "مجله خبری| ۳ آبان ۱۴۰۵ (۲۵ اکتبر ۲۰۲۶) - شامگاهی", "link": "https://parsi.euronews.com/video/2026/10/25/mglh-khbri-aban-aktbr-shamgahi", "summary": "آخرین تحولات اروپا و جهان را دنبال کنید ۳ آبان ۱۴۰۵ (۲۵ اکتبر ۲۰۲۶). با یورونیوز در جریان آخرین اخبار و رویدادهای سیاسی، اقتصادی، فرهنگی و سرگرمی قرار بگیرید.", "source_id": "euronews_persian", "source_name": "Euronews Persian", "source_name_fa": "یورونیوز فارسی", "category": "persian", "published_at": "2026-10-25T17:00:30+00:00", "published_epoch": 1792947630, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "cfaeec32e2f65d0c", "title": "هزاران گوسفند خیابان‌های مادرید را در جشن کوچ دام‌ها پر کردند", "link": "https://parsi.euronews.com/video/2026/10/25/thousands-of-sheep-take-over-the-streets-of-madrid-for-the-transhumance-festival", "summary": "بیش از ۱۴۰۰ گوسفند و بز روز یکشنبه خیابان‌های مادرید را پر کردند و تماشاگران جشن سالانه سی‌وسوم کوچ دام را شاد کردند؛ مسیر امسا       grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
