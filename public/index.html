ی و آپدیت سرور \n\nدوستان، حالت CottenMax (Beta) داخل CottenDNS در دسترسه؛ یک حالت آزمایشی برای اتصال روی مسیرهای محدود و ناپایدار. نتیجه روی هر اینترنت می‌تونه متفاوت باشه و لزوماً از حالت معمول بهتر نیست.\n\n 📱 فعال‌سازی در اندروید \n\nاول برنامهٔ WhiteDNS رو به‌روز کنید، بعد:\n۱. وارد بخش Profiles بشید.\n۲. روی سه‌نقطهٔ کنار کانفیگ CottenDNS بزنید.\n۳. گزینهٔ Edit profile رو انتخاب کنید.\n۴. در قسمت CottenDNS mode ، گزینهٔ CottenMax (beta) رو انتخاب کنید.\n۵. روی Save بزنید، اتصال قبلی رو قطع کنید و دوباره وصل بشید.\n\n 🖥 سمت سرور چی لازم داریم؟ \n\nسرور هم باید از CottenMax پشتیبانی کنه. مسیر آپدیت به روش نصب شما بستگی داره:\n\n ۱. اگر از پنل WhiteDNS استفاده می‌کنید \nآخرین نسخهٔ CottenDNS همراه پنل نصب شده و نیازی به نصب یا آپدیت جداگانهٔ اون ندارید. اگر پنل‌تون قدیمیه، اول خود پنل رو به‌روز کنید؛ دستورهای پایین مخصوص نصب مستقل و CottenRouter هستن، نه موتور داخلی پنل.\n\n ۲. اگر CottenDNS رو مستقیم نصب کرده‌اید \nبا SSH وارد سرور بشید و قبل از آپدیت از تنظیمات و کلیدتون بکاپ بگیرید.\n\nاگر مسیر نصب شما همین پوشه‌ست، دستورهای ورود و آپدیت رو اجرا کنید: cd /opt/cottendns && curl -fsSL https://raw.githubusercontent.com/WhiteDNS/CottenDNS/main/server_linux_install.sh | sudo bash -s -- --upgrade \n\n ۳. اگر CottenDNS رو با CottenRouter نصب کرده‌اید \nآپدیت موتور رو از خود روتر انجام بدید تا مسیر اتصال و تنظیماتش حفظ بشه.\n\nدستور آپدیت موتور: sudo cottenrouter update --project cottendns \n\nاین دستور آخرین انتشار CottenDNS رو جدا از نسخهٔ خود روتر بررسی و نصب می‌کنه. اگر خود CottenRouter قدیمیه، اول با دستور رسمی زیر به‌روزش کنید و بعد دستور آپدیت موتور رو اجرا کنید.\n\nدستور آپدیت روتر: curl -fsSL https://raw.githubusercontent.com/TaJirax/CottenRouter/main/scripts/install.sh | sudo bash \n\n ✅ روی سرور سازگار و به‌روز، حالت‌های Normal و CottenMax کنار هم کار می‌کنن؛ برای تغییر حالت، ساخت کانفیگ، دامنه یا کلید جدید لازم نیست.\n\n 🔄 اگر وصل نشد: در همان بخش CottenDNS mode ، گزینهٔ Normal CottenDNS رو انتخاب کنید، ذخیره کنید و دوباره وصل بشید.\n\n ⚠️ حالت CottenMax ه         const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
