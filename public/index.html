نده استان گلستان، ورودی شهر ایست بازرسی گذاشتن که فقط هدفشون اذیت و آزار مردمه. الکی به همه گیر می‌دن.\n\n 🔹 از اهواز: در مدرسه سمپاد درس می‌خونم. شهریه به طرز عجیبی افزایش پیدا کرده و از ۱۵ میلیون تومان رسیده به ۳۰ میلیون تومان. امکانات که نداریم، درس خوندن هم شده آرزو.\n\n 🔹 از تهران: سال‌ها به فقرا و زاغه‌نشین‌ها کمک می‌کردم، اما فکرش رو نمی‌کردم یه روزی مجبور بشم غذای قسطی بخرم. مرگ بر جمهوری اسلامی که کرامت انسانی برای ما نذاشته.", "source_id": "tg_IranintlTV", "source_name": "@IranintlTV", "source_name_fa": "@IranintlTV (ایران اینترنشنال (تلگرام))", "category": "telegram", "published_at": "2026-10-21T18:49:42+00:00", "published_epoch": 1792608582, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "644d1cf899ab01a4", "title": "نتانیاهو سرنگونی جمهوری اسلامی را تنها راه پایان تهدیدها خواند؛ ایران از تغییر دکترین دفاعی به تهاجمی خبر داد", "link": "https://parsi.euronews.com/2026/10/21/netanyahu-calls-overthrowing-the-islamic-republic-the-only-way-to-end-threats", "summary": "نخست‌وزیر اسرائیل روز چهارشنبه ۲۱ اکتبر (۲۹ مهر ۱۴۰۵) گفت تنها راه از میان برداشتن آنچه وی تهدید ناشی از ایران خواند، سرنگونی حکومت است.", "source_id": "euronews_persian", "source_name": "Euronews Persian", "source_name_fa": "یورونیوز فارسی", "category": "persian", "published_at": "2026-10-21T18:48:16+00:00", "published_epoch": 1792608496, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "6dc8bf9663c0d9ce", "title": "🔻 کومو در ورزشگاه سینیگالیا با نتیجه ۴ بر یک منچستریونایتد را در هفته سوم لیگ قهرمانان اروپا شکست داد. تیم سسک فابرگاس د...", "link": "https://t.me/IranintlTV/363323", "summary": "🔻 کومو در ورزشگاه سینیگالیا با نتیجه ۴ بر یک منچستریونایتد را در هفته سوم لیگ قهرمانان اروپا شکست داد. تیم سسک فابرگاس در این مسابقه کاملا بر حریف مسلط بود و منچستریونایتد در تمام ۹۰ دقیقه نتوانست وارد جریان بازی شود.\n\n 🔹 دوویکاس با گل دوم کومو مسیر پیروزی میزبان را هموار کرد و سپس نیکو پاز با گلزنی برتری تیمش را افزایش داد. رامون نیز گل چهارم را به ثمر رساند     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
