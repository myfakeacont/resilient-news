, "link": "https://t.me/OfficialRezaPahlavi/1898", "summary": "‏نزدیک به نیم قرن است که ایرانیان آمریکا با نقش‌آفرینی در حوزه‌های تجارت، پزشکی، علم و آموزش، به پیشرفت و تقویت این کشور کمک کرده‌اند.\n\n‏امروز از هم‌میهنان ایرانی‌ام در آمریکا و از هر آمریکایی که برای آزادی، صلح، ثبات و امنیت اقتصادی ارزش قائل است، می‌خواهم در انتخابات ماه نوامبر، با حضور پای صندوق‌های رای صدای خود را به گوش برسانند و هنگام رای دادن، آزادی ایران را به عنوان یک موضوع اصلی مد نظر قرار دهند.\n\n‏زیرا ایران آزاد به سود همه است.\n\n‏به سود مردم ایران است، مردمی که شایسته‌اند با کرامت زندگی کنند، آزادانه سخن بگویند و رهبران خود را بی‌هراس انتخاب کنند.\n\n‏به سود جهان است، چرا که برای بیش از چهار دهه، جمهوری اسلامی شبه‌نظامیان را مسلح و تروریسم را تأمین مالی کرده و کشورهای همسایه را بی‌ثبات ساخته است. اقدامات این رژیم، جان انسانهای بی‌گناه بیشماری را گرفته و خشونت، هرج‌ومرج و ناامنی را در سراسر خاورمیانه، اروپا و فراتر از آن گسترش داده است.\n\n‏ایران آزاد همچنین به سود مردم آمریکا است. امروز، اخلال‌گریهای جمهوری اسلامی در تنگه هرمز، فشار اقتصادی را تا پمپ‌بنزین‌ها و فروشگاه‌های مواد غذایی آمریکا رسانده است. ایران آزاد به معنای مسیرهای کشتیرانی امن و باز، بازارهای انرژی باثبات‌تر و ملتی ۹۰ میلیونی است که به‌جای تهدید آمریکا، آماده تجارت و همکاری با آن خواهد بود. با رژیمی که رهبرانش شعار «مرگ بر آمریکا» سر می‌دهند، صلح و ثبات پایدار ممکن نیست.\n\n‏به همین دلیل، از شما می‌خواهم رای بدهید و خانواده و دوستان خود را نیز به این کار تشویق کنید. از هر نامزد، چه جمهوری‌خواه و چه دموکرات، بپرسید آیا درک می‌کند که مشکل، خودِ رژیم جمهوری اسلامی است.\n\n‏هنگام رای دادن، در نظر بگیرید که هر نامزد در کدام سو ایستاده است: در کنار مردم ایران یا در کنار سرکوبگران آنان.\n\n‏جمهوری اسلامی راه‌حل این بحران نیست، خود، ریشه بحران است. تنها راه‌حل پایدار، از بین بردن این ریشه، یعنی خودِ رژیم است.\n\n‏رضا پهلوی\n\nFor nearly half a century, Iranian Americans have helped build and strengthen this country through their contributions to business, medicine, science, and education.\n\nToday, I call on my fellow Iranians in America, and on every American who values freedom, peace, stability, and economic security, to make your voices heard at the ballot box this November, and to consider the freedom of Iran as an important issue when casting your vote.\n\nBecause a free Iran is better for everyone.\n\nIt is better for the people of Iran, who deserve to live with dignity, speak freely, and choose their own leaders without fear.\n\nIt is better for the world. For more than four decades, the Islamic Republic has armed militias, financed terrorism, and destabilized its neighbors. Its actions have claimed countless innocent lives and spread violence, chaos, and insecurity across the Middle East, Europe, and beyond.\n\nAnd it is better for the American people. Today, the Islamic Republic’s disruption of the Strait of Hormuz is driving economic pressure all the way to American gas pumps and grocery stores. A free Iran means secure and open shipping lanes, more stable energy markets, and a nation of 90 million people ready to trade and cooperate with America instead of threatening it. There can be no lasting peace or stability with a regime whose leaders chant “Death to America.”\n\nThat is why I urge you to vote and to encourage your family and friends to do the same. Ask every candidate, Republican or Democrat, whether they understand that the problem is the regime itself.\n\nAs you cast your vote, consider where each candidate stands: with the Iranian people or with those who oppress them.\n\nThe Islamic Republic is not the solution to the crisis. It is the root of the crisis. And the only lasting solution is to remove that root, the regime itself.\n\nReza Pahlavi\n\n @OfficialRezaPahlavi", "source_id": "tg_OfficialRezaPahlavi", "source_name": "@OfficialRezaPahlavi", "source_name_fa": "@OfficialRezaPahlavi (کانال رسمی شاهزاده رضا پهلوی)", "category": "telegram", "published_at": "2026-10-18T15:47:32+00:00", "published_epoch": 1792338452, "rtl": true, "raw_media_urls": ["https://cdn4.telesco چک و شیطان بزرگ را نابود خواهیم کرد.»\n\nوقتی اجازه داده می‌شود چنین حرف‌هایی زده شود، کدام کشور می‌تواند دوام بیاورد؟ چرا که این حرف‌ها در نهایت همیشه به واقعیت تبدیل می‌شوند.\n\nاین فقط مسئله زمان بود که ایران آن عبارت شوم را عملی کند، اما آن‌ها هم از نظر نظامی و هم از نظر مالی به‌طور نظام‌مند نابود شده‌اند و اگر به‌سرعت رفتار خود را تغییر ندهند، به‌زودی کار را تمام خواهیم کرد.\n\nاگر اسرائیل رهبر نامناسبی داشته باشد، یعنی هر کسی غیر از بی‌بی، آمریکا مجبور خواهد شد خودش این کار را انجام دهد و من هیچ تمایلی به این کار ندارم.\n\nبی‌بی نتانیاهو در برابر مخالفت‌های شدید، از جمله مخالفت‌هایی که حتی از داخل خود اسرائیل سرچشمه می‌گیرند، قدرتمند، شجاع و درخشان ظاهر شده است. با وجود همه این‌ها، نه‌تنها دوام آورده، بلکه در واقع موفق‌تر و قدرتمندتر هم شده است!\n\nمن بی‌بی را در دشوارترین شرایط زیر نظر داشته‌ام. مردان یا زنان معمولی در چنین شرایطی زیر فشار از پا درمی‌آمدند، اما بی‌بی از پا درنیامد؛ در واقع قوی‌تر شد و امروز هم همان قدرت را حفظ کرده است.\n\nایالات متحده آمریکا از اسرائیل، کشوری که این‌همه برایش کار کرده، دقیقاً چنین شریکی را می‌خواهد.\n\nلطفاً این نامه را به منزله حمایت کامل و بی‌قیدوشرط من از بی‌بی نتانیاهو در رقابت انتخاباتی پیش‌روی او برای انتخاب مجدد به‌عنوان نخست‌وزیر اسرائیل تلقی کنید.\nبی‌بی نتانیاهو هرگز شما را ناامید نخواهد کرد!\n\nاز توجه شما به این موضوع سپاسگزارم.\"\n realDonaldTrump \nواکنش نتانیاهو:\n\"از شما، رئیس‌جمهور ترامپ، بابت حمایت فوق‌العاده و همکاری مشترک‌مان سپاسگزارم.\nبا هم مأموریت را به پایان خواهیم رساند!\"\n netanyahu \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-10-18T14:53:44+00:00", "published_epoch": 1792335224, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/Q1X6nWS4PM57ijYgpJg0Nsd3F4GGeH3BZQ1fzAE4MWNvHi92K_tElKrHzWG-8-30Ftb4-ugHVxLDlVEfcGs0VJbs4DzWIGSNR-QfWKv6t5XhYN3kLb4rQf44Y9Vy37AhnDWRShA-dFvXH6Y1rFlhMi4Ob0Ac59jDreTf_YdCermniw-i_rmgIDvRMnNmKkqedI6_ymWpyoYlseMEP3pOxsyN-ZHB64p-RopqW     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
