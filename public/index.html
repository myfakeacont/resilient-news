ue, "raw_media_urls": [], "local_media_path": null}, {"hash": "9b101d14750177ab", "title": "گسترش محاصره ایران از دریا و هوا به مرزهای زمینی؛ سنتکام از تشکیل «دروازه آهنین» خبر داد", "link": "https://www.iranintl.com/202611076908", "summary": "ارتش آمریکا شنبه ۱۶ آبان از تشکیل کارگروه ویژه‌ای برای جلوگیری از انتقال تسلیحات پیشرفته، فناوری‌های دارای کاربرد دوگانه و کالاهای تحریم‌شده از مرزهای زمینی و دریای خزر به ایران خبر داد. این اقدام در ادامه محاصره دریایی و تحریم خطوط هوایی و راه‌آهن ایران صورت می‌گیرد.", "source_id": "iran_intl", "source_name": "Iran International", "source_name_fa": "ایران اینترنشنال", "category": "persian", "published_at": "2026-11-07T14:19:42+00:00", "published_epoch": 1794061182, "rtl": true, "raw_media_urls": ["https://i.iranintl.com/images/rdk9umy0/production/787f6913a516cf2a402d5fce1231389074cd36d7-799x553.png?rect=0,68,799,418&w=1200&h=628&fm=jpg&q=85&fit=max&auto=format"], "local_media_path": null}, {"hash": "f2f0c4feb3a8bb0d", "title": "\"سنتکام کارگروهی برای مختل کردن مسیرهای ترانزیت زمینی ایران در حمایت از محموله‌های غیرقانونی تشکیل می‌دهد\"", "link": "https://t.me/VahidOnline/79026", "summary": "\"سنتکام کارگروهی برای مختل کردن مسیرهای ترانزیت زمینی ایران در حمایت از محموله‌های غیرقانونی تشکیل می‌دهد\" \n\nترجمه ماشین:\nتامپا، فلوریدا — روز ۷ نوامبر، فرمانده ستاد فرماندهی مرکزی ایالات متحده (سنتکام) دستور تشکیل کارگروهی را صادر کرد که از تلاش‌های جاری دولت آمریکا برای جلوگیری از استفاده ایران از مسیرهای زمینی به‌منظور انتقال تسلیحات پیشرفته و سایر اقلام پشتیبانی خواهد کرد.\n\nدریاسالار برد کوپر دستور تشکیل «کارگروه دروازه آهنین» (Task Force Iron Gate) را صادر کرده است؛ یک گروه داخلی متشکل از حدود ۲۰ نیروی غیرنظامی و نظامی که در تامپا، فلوریدا مستقر خواهند بود.\n\nتیم جدید سنتکام با دیگر نهادهای دولت آمریکا برای جلوگیری از انتقال سامانه‌های تسلیحاتی پیشرفته، فناوری‌های دارای کاربرد دوگانه، اقلام مشمول تحریم و جریان‌های درآمدی غیرقانونی از طریق مرزهای زمینی ایران و دریای خزر هماهنگی خواهد کرد.\n\nکوپر گفت: «تشکیل کارگروه دروازه آهنین، موفقیت محاصره دریایی نفوذناپذیر ما علیه ایران را تقویت می‌کند. تقویت همکاری سنتکام با نهادهای مختلف دولت آمریکا، توانایی ایران برای تأمین مالی تروریسم، بازسازی کارخانه‌های تسلیحاتی و تجدید قوای نظامی خود را بیش از پیش محدود خواهد کرد.»\n\nدر ماه‌های اخیر، محاصره دریایی آمریکا مانع از صادرات بیش از ۲۵ میلیارد دلار نفت خام توسط ایران شده است. اجرای سخت‌گیرانه این محاصره در دریا همچنان علیه تمامی کشتی‌هایی که وارد بنادر ایران می‌شوند یا از آن‌ها خارج می‌شوند، ادامه دارد.\n CENTCOM \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-07T13:49:18+00:00", "published_epoch": 1794059358, "rtl": true, "raw_media_urls": ["https://cdn1.telesco.pe/file/DNmwrcQvx-AemwLNmVYlSb34zPPyFhi72_UUU2k9NR49AvW0CPSTja_lGRQRHgRZPdmiN4ZZxdVSAm5IFEnRVaNqfKhfXhjdA4ss8vVKkiOzdI50sbxxImGEdg1DNe_rd4bH8B_x3vLyc-J7KJthBCWosEOtwuQ80yPBbEW3gH1yxbLYtysIibfk3aY4Wvmgm8oKiOfxjKx3rgEAkNxkLRX4MUV8ph6G_M4EZd1S330PTug0sZ0PvYMvBHdkriy1sACPdDx5hKJRxCsxhU60gzBoIUSV-9omqz9LUo8lqgyFB-3cAFK_uPQ7KNeBDYkN76KQmrxPPP4nWX7-HCz7iQ.jpg"], "local_media_path": null}, {"hash": "6bc6aacb4e47a1fd", "title": "حسین محبی، سخنگوی سپاه پاسداران انقلاب اسلامی، روز شنبه ۱۶ آبان در نشست خبری به مناسبت هفته هوافضای سپاه از برداشته شدن ...", "link": "https://t.me/VahidOnline/79025", "summary": "حسین محبی، سخنگوی سپاه پاسداران انقلاب اسلامی، روز شنبه ۱۶ آبان در نشست خبری به مناسبت هفته هوافضای سپاه از برداشته شدن محدودیت برد موشک‌های ایران خبر داد و هشدار داد که در صورت آغاز دور تازه‌ای از درگیری‌ها با آمریکا و اسرائیل، نیروی هوافضای سپاه تسلیحات و توانمندی‌هایی را به میدان خواهد آورد که به گفته او، موجب شگفتی جهان خواهد شد. \n\nمحبی در پاسخ به پرسشی درباره اظهارات اخیر رهبر جمهوری اسلامی مبنی بر ضرورت پاسخ فوری و بدون محدودیت جغرافیایی به تهدیدهای «دشمن»، گفت: این محدودیت برای ما برداشته شده است، اما باید در عمل از این قابلیت‌ها رونمایی کنیم و پیش از آن نباید صرفاً شعار بدهیم، چراکه وظیفه ما این است که توانم     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
