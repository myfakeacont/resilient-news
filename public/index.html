رار دارند، از بودنشان در آنجا راضی نیستم.\n@ VahidOOnLine \nرییس‌جمهوری آمریکا گفت: «به نظر می‌رسد داریم به هر آنچه می‌خواهیم، دست پیدا می‌کنیم.»\n\nترامپ به فایننشال تایمز گفت که اکنون نفت بیشتری نسبت به پیش از جنگ از تنگه هرمز، گذرگاه حیاتی انتقال نفت خام از خلیج فارس، عبور می‌کند و محاصره بنادر ایران از سوی آمریکا نیز با موفقیت در حال تضعیف اقتصاد تهران است.\n\nاو با «فوق‌العاده» خواندن وضعیت، افزود که آمریکا «در واقع» در حال جنگ با ایران نیست.\nترامپ درباره اورانیوم غنی‌شده ایران، گفت: «با وجود اینکه این مواد زیر صدها تن سنگ قرار دارد، باید بگویم از اینکه همچنان آنجا باقی بماند، خوشحال نیستم.»\nاو گفت: «بنابراین، این یکی از موضوعاتی است که درباره آن گفت‌وگو می‌کنیم. اما می‌دانید، ما در حال مذاکره هستیم و خواهیم دید که نتیجه چه خواهد شد.»\n@ VahidOOnLine \n\n 📡 @VahidOnline", "source_id": "tg_VahidOnline", "source_name": "@VahidOnline", "source_name_fa": "@VahidOnline (وحید آنلاین)", "category": "telegram", "published_at": "2026-11-04T00:53:04+00:00", "published_epoch": 1793753584, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "41f99cd6a8977ea5", "title": "ترامپ: آمریکا در حال حاضر برنامه‌ای فوری برای حمله به ایران ندارد", "link": "https://www.dw.com/fa-ir/ترامپ-آمریکا-در-حال-حاضر-برنامه‌ای-فوری-برای-حمله-به-ایران-ندارد/a-79848982?maca=per-rss-per-all-1491-xml-mrss", "summary": "به گفته دونالد ترامپ، آمریکا در حال حاضر برنامه‌ای فوری برای حمله به ایران ندارد. این در حالی است که در هفته‌های گذشته گزارش‌هایی متعددی از حمله احتمالی آمریکا به ایران پس از انتخابات میان‌دوره‌ای منتشر شده بود.", "source_id": "dw_persian", "source_name": "DW Persian", "source_name_fa": "دویچه‌وله فارسی", "category": "persian", "published_at": "2026-11-04T00:51:00+00:00", "published_epoch": 1793753460, "rtl": true, "raw_media_urls": [], "local_media_path": null}, {"hash": "753efd5a5f673db0", "title": "Senator Jon Ossoff wins reelection, holding Georgia for Democrats - Reuters", "link": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxQQ05OSFAxbUI3MjloX2Zza2REV     let currentCategory = 'all';

    function getBadgeClass(cat) {
      if (cat === 'twitter') return 'badge-tw';
      if (cat === 'telegram') return 'badge-tg';
      if (cat === 'persian') return 'badge-fa';
      if (cat === 'wire') return 'badge-wire';
      return 'badge-tech';
    }

    function renderArticles(list) {
      const grid = document.getElementById('newsGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">موردی یافت نشد.</div>';
        return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
