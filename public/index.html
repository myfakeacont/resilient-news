faec7f999dff4", "title": "از سیاستمداران و رسانه‌های سراسر جهان که خشم خود را از شلاق‌زدن وحشیانه پرستو احمدی ابراز کرده‌اند، سپاسگزارم.", "link": "https://t.me/OfficialRezaPahlavi/1920", "summary": "از سیاستمداران و رسانه‌های سراسر جهان که خشم خود را از شلاق‌زدن وحشیانه پرستو احمدی ابراز کرده‌اند، سپاسگزارم.\n\nاما خطاب به کسانی که صدای اعتراض خود را بلند کرده‌اند، باید بر دو نکته تأکید کنم:\n\nنخست، این جنایت تنها نوک کوه یخ است. نباید از وضعیت دیگر زندانیان سیاسی غافل شویم، کسانی که سرنوشتشان بی‌تردید دغدغه پرستو نیز است. همین حالا، دو زندانی سیاسی جوان، میلاد آرمون و نوید نجاران، همراه با ده‌ها بی‌گناه دیگر، در معرض اعدام قرار دارند. «جرم» پرستو، خواندن برای آزادی بود و «جرم» آنان، آزادی‌خواهی است، چه‌بسا بهای آن را با جان خود بپردازند. اگر جهان دست به اقدام نزند، نام آنان نیز به فهرست بلند قربانیان این رژیم افزوده خواهد شد: ده‌ها هزار ایرانی که شکنجه شده‌اند، مورد تجاوز قرار گرفته‌اند، در ملأعام اعدام شده‌اند یا در خیابان‌ها به قتل رسیده‌اند.\n\nدوم، جهان می‌تواند برای توقف این جنایات علیه بشریت اقدام عملی کند. خشم عمومی، پوشش رسانه‌ای و بیانیه‌های محکومیت ارزشمندند، اما جمهوری اسلامی را متوقف نخواهند کرد. آنچه جان پرستوها و میلادها و نویدها را نجات می‌دهد، اقدام عملی است. سفیران جمهوری اسلامی را اخراج کنید و سفیران خود را از تهران فرا بخوانید. در برابر رژیمی که زنان را به‌دلیل آواز خواندن شلاق می‌زند و جوانان را به‌جرم آزادی‌خواهی اعدام می‌کند، دیپلماسی کارساز نیست. چنین رژیمی تنها زمانی عقب‌نشینی می‌کند که با قدرت و قاطعیت روبه‌رو شود و بداند که جنایاتش بی‌هزینه نخواهد ماند.\n\nاز اینکه در برابر آنچه بر پرستو گذشت، سکوت نکردید، سپاسگزاریم. اما اکنون پرستو و میلیون‌ها ایرانی از شما انتظار دارند که این اعتراض را به اقدام عملی تبدیل کنید.\n\nرضا پهلوی\n\n @OfficialRezaPahlavi", "source_id": "tg_OfficialRezaPahlavi", "source_name": "@OfficialRezaPahlavi", "source_name_fa": "@OfficialRezaPahlavi (کانال رسمی شاهزاده رضا پهلوی)", "category": "telegram", "published_at": "2026-11-25T19:47:40+00:00", "published_epoch": 1795636060, "rtl": true, "raw_media_urls": ["https         return;
      }
      grid.innerHTML = list.map(a => {
        const bClass = getBadgeClass(a.category);
        const mediaHtml = a.local_media_path ? `<div class="card-media"><img src="../${a.local_media_path}" loading="lazy" alt="Media"></div>` : '';
        const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
        return `
          <div class="news-card" dir="${a.rtl ? 'rtl' : 'ltr'}">
            <div class="card-header">
              <span class="badge ${bClass}">${a.source_name_fa || a.source_name}</span>
              <span style="font-size:0.75rem; color: var(--text-muted);">${a.published_at.slice(11, 16)} UTC</span>
            </div>
            <a class="card-title" href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
            ${summaryHtml}
            ${mediaHtml}
            <div class="card-footer">
              <span>منبع: ${a.source_name}</span>
              <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none;">مشاهده خبر اصلی ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = articles.filter(a => {
        const matchCat = (currentCategory === 'all' || a.category === currentCategory);
        const matchSearch = !q || (a.title && a.title.toLowerCase().includes(q)) ||
                                  (a.summary && a.summary.toLowerCase().includes(q)) ||
                                  (a.source_name && a.source_name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });
      renderArticles(filtered);
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    renderArticles(articles);
  </script>
</body>
</html>
